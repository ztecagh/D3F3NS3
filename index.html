      ctx.fillStyle = hover ? accentA(0.16) : 'transparent';
      ctx.fillRect(bx, by, btnW, btnH);
      ctx.strokeStyle = hover ? theme.accent : theme.textDim;
      ctx.lineWidth = 1.4;
      ctx.strokeRect(bx + 0.5, by + 0.5, btnW - 1, btnH - 1);
      txt('?  HOW TO PLAY', bx + btnW / 2, by + btnH / 2, 10,
          hover ? theme.accent : theme.text, 'center', '700', 1.5);
      settingsHitAreas.push({ x: bx, y: by, w: btnW, h: btnH, action: 'help' });
    }
    {
      const bx = px + pad + btnW + btnGap;
      const hover = pointInRect(mouse.x, mouse.y, { x: bx, y: by, w: btnW, h: btnH });
      ctx.fillStyle = hover ? accentA(0.16) : 'transparent';
      ctx.fillRect(bx, by, btnW, btnH);
      ctx.strokeStyle = hover ? theme.accent : theme.textDim;
      ctx.lineWidth = 1.4;
      ctx.strokeRect(bx + 0.5, by + 0.5, btnW - 1, btnH - 1);
      txt('RESET TO DEFAULTS', bx + btnW / 2, by + btnH / 2, 10,
          hover ? theme.accent : theme.text, 'center', '700', 1.5);
      settingsHitAreas.push({ x: bx, y: by, w: btnW, h: btnH, action: 'resetDefaults' });
    }
  }

  function drawCornerBrackets(x, y, w, h, len, color, lw) {
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.lineCap = 'square';
    ctx.beginPath();
    ctx.moveTo(x, y + len);       ctx.lineTo(x, y);           ctx.lineTo(x + len, y);
    ctx.moveTo(x + w - len, y);   ctx.lineTo(x + w, y);       ctx.lineTo(x + w, y + len);
    ctx.moveTo(x + w, y + h - len); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - len, y + h);
    ctx.moveTo(x + len, y + h);   ctx.lineTo(x, y + h);       ctx.lineTo(x, y + h - len);
    ctx.stroke();
  }
  function drawSectionHeader(x, y, w, label) {
    txt(label, x, y, 11, theme.text, 'left', '700', 2.5);
    const labelW = ctx.measureText(label).width;
    const lineX = x + labelW + 14;
    ctx.strokeStyle = fgA(0.18);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(lineX, y + 0.5);
    ctx.lineTo(x + w, y + 0.5);
    ctx.stroke();
  }
  function drawSlider(x, y, w, key, label) {
    const value = settings[key];
    const labelW = 100;
    const valueW = 54;
    const trackX = x + labelW;
    const trackW = w - labelW - valueW;
    const trackY = y + 14;

    txt(label, x, trackY, 11, theme.text, 'left', '700', 1.5);

    ctx.fillStyle = fgA(0.14);
    ctx.fillRect(trackX, trackY - 2, trackW, 4);
    ctx.fillStyle = theme.accent;
    ctx.fillRect(trackX, trackY - 2, trackW * value, 4);
    for (const tv of [0.25, 0.5, 0.75]) {
      ctx.fillStyle = fgA(0.25);
      ctx.fillRect(trackX + trackW * tv - 0.5, trackY - 5, 1, 10);
    }
    const hx = trackX + trackW * value;
    ctx.fillStyle = theme.accent;
    ctx.fillRect(hx - 4, trackY - 8, 8, 16);
    ctx.strokeStyle = theme.modalBg;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(hx - 4 + 0.75, trackY - 8 + 0.75, 8 - 1.5, 16 - 1.5);

    txt(Math.round(value * 100) + '%', x + w, trackY, 11, theme.text, 'right', '700');

    sliderRects[key] = { x: trackX - 8, y: trackY - 16, w: trackW + 16, h: 32, trackX, trackW };
    settingsHitAreas.push({ x: trackX - 8, y: trackY - 16, w: trackW + 16, h: 32, action: 'slider', key });
  }
  function drawToggleRow(x, y, w, key, label) {
    const value = settings[key];
    txt(label, x, y + 11, 11, theme.text, 'left', '700', 1);
    const toggleW = 44, toggleH = 20;
    const tx = x + w - toggleW;
    const ty = y + 1;
    ctx.fillStyle = value ? theme.accent : fgA(0.14);
    ctx.fillRect(tx, ty, toggleW, toggleH);
    ctx.strokeStyle = value ? theme.accent : theme.textDim;
    ctx.lineWidth = 1.2;
    ctx.strokeRect(tx + 0.5, ty + 0.5, toggleW - 1, toggleH - 1);
    const knobW = toggleW / 2 - 2;
    const knobX = value ? tx + toggleW / 2 + 1 : tx + 1;
    ctx.fillStyle = value ? theme.accentText : theme.text;
    ctx.fillRect(knobX, ty + 2, knobW, toggleH - 4);
    txt(value ? 'ON' : 'OFF', tx - 10, y + 11, 9,
        value ? theme.accent : theme.textDim, 'right', '700', 1);
    settingsHitAreas.push({ x: x, y, w, h: toggleH + 2, action: 'toggle', key });
  }

  /* ================================================================ */
  /*  DRAW: PAUSE MENU                                                 */
  /* ================================================================ */
  function drawPauseMenu() {
    pauseHitAreas = [];

    ctx.fillStyle = theme.overlay;
    ctx.fillRect(0, 0, W, H);

    const panelW = Math.min(420, W - 60);
    const panelH = 340;
    const px = (W - panelW) / 2;
    const py = (H - panelH) / 2;

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(px + 4, py + 4, panelW, panelH);
    ctx.fillStyle = theme.modalBg;
    ctx.fillRect(px, py, panelW, panelH);
    ctx.strokeStyle = theme.panelBorder;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(px + 0.75, py + 0.75, panelW - 1.5, panelH - 1.5);

    drawCornerBrackets(px, py, panelW, panelH, 16, theme.accent, 2);

    txt('PAUSED', px + panelW / 2, py + 48, 26, theme.text, 'center', '700', 10);
    ctx.fillStyle = theme.accent;
    ctx.fillRect(px + panelW / 2 - 24, py + 70, 48, 2);

    const statY = py + 116;
    const stats = [
      ['WAVE', String(wave)],
      ['KILLS', String(kills)],
      ['MONEY', '$' + Math.floor(money)]
    ];
    const cols = 3;
    const colW = (panelW - 60) / cols;
    for (let i = 0; i < cols; i++) {
      const cx = px + 30 + colW * i + colW / 2;
      txt(stats[i][0], cx, statY, 9, theme.textDim, 'center', '700', 2);
      txt(stats[i][1], cx, statY + 24, 20, theme.text, 'center', '700', 1);
    }

    const divY = statY + 52;
    ctx.strokeStyle = fgA(0.16);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(px + 30, divY);
    ctx.lineTo(px + panelW - 30, divY);
    ctx.stroke();

    const btnW = panelW - 60;
    const btnH = 40;
    const btnX = px + 30;
    const resumeY = divY + 24;
    const restartY = resumeY + btnH + 12;

    {
      const hover = pointInRect(mouse.x, mouse.y, { x: btnX, y: resumeY, w: btnW, h: btnH });
      if (hover) {
        ctx.strokeStyle = accentA(0.35);
        ctx.lineWidth = 2;
        ctx.strokeRect(btnX - 3, resumeY - 3, btnW + 6, btnH + 6);
      }
      ctx.fillStyle = hover ? accentA(0.92) : theme.accent;
      ctx.fillRect(btnX, resumeY, btnW, btnH);
      ctx.strokeStyle = theme.accentText;
      ctx.lineWidth = 1.5;
      ctx.strokeRect(btnX + 0.5, resumeY + 0.5, btnW - 1, btnH - 1);
      txt('RESUME', btnX + btnW / 2, resumeY + btnH / 2, 13, theme.accentText, 'center', '700', 5);
      pauseHitAreas.push({ x: btnX, y: resumeY, w: btnW, h: btnH, action: 'resume' });
    }

    {
      const hover = pointInRect(mouse.x, mouse.y, { x: btnX, y: restartY, w: btnW, h: btnH });
      ctx.fillStyle = hover ? 'rgba(192,57,43,0.22)' : 'rgba(192,57,43,0.06)';
      ctx.fillRect(btnX, restartY, btnW, btnH);
      ctx.strokeStyle = hover ? '#c0392b' : 'rgba(192,57,43,0.55)';
      ctx.lineWidth = 1.4;
      ctx.strokeRect(btnX + 0.5, restartY + 0.5, btnW - 1, btnH - 1);
      txt('RESTART', btnX + btnW / 2, restartY + btnH / 2, 13,
          hover ? '#c0392b' : theme.text, 'center', '700', 5);
      pauseHitAreas.push({ x: btnX, y: restartY, w: btnW, h: btnH, action: 'restart' });
    }

    txt('PRESS  [P]  OR  [ESC]  TO  RESUME',
        px + panelW / 2, py + panelH - 20, 9, theme.textDim, 'center', '700', 1.5);
  }

  /* ================================================================ */
  /*  DRAW: MAIN                                                       */
  /* ================================================================ */
  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.save();

    if (settings.screenShake && shake > 0.2) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    if (state === 'instructions') {
      ctx.restore();
      drawInstructions(false);
      return;
    }

    ctx.fillStyle = theme.bg;
    ctx.fillRect(-40, -40, W + 80, H + 80);
    if (settings.showGrid && dotPattern) {
      ctx.fillStyle = dotPattern;
      ctx.fillRect(-40, -40, W + 80, H + 80);
    }

    if (state === 'menu') {
      ctx.restore();
      drawMenu();
      drawTopHUDButtonsOnly();
      if (settingsOpen) drawSettings();
      if (showingHelp) drawInstructions(true);
      return;
    }

    panelHitAreas = [];

    for (const m of motes) {
      ctx.globalAlpha = 0.16 + 0.14 * Math.sin(performance.now() / 900 + m.ph);
      ctx.fillStyle = theme.textDim;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.s, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (!settingsOpen && !showingHelp && !paused) {
      if (player.gunEquipped) {
        if (mouse.x > -500) {
          const pulse = 0.7 + 0.3 * Math.sin(performance.now() / 180);
          ctx.strokeStyle = 'rgba(199,107,255,' + (0.8 * pulse) + ')';
          ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 10, 0, Math.PI * 2); ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(mouse.x - 14, mouse.y); ctx.lineTo(mouse.x - 6, mouse.y);
          ctx.moveTo(mouse.x + 6, mouse.y);  ctx.lineTo(mouse.x + 14, mouse.y);
          ctx.moveTo(mouse.x, mouse.y - 14); ctx.lineTo(mouse.x, mouse.y - 6);
          ctx.moveTo(mouse.x, mouse.y + 6);  ctx.lineTo(mouse.x, mouse.y + 14);
          ctx.stroke();
          ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 1.5, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(199,107,255,' + pulse + ')'; ctx.fill();
        }
      } else if (activeTurret && activeTurret.eff) {
        const eff = activeTurret.eff;
        if (eff.range !== Infinity) {
          ctx.beginPath(); ctx.arc(activeTurret.x, activeTurret.y, eff.range, 0, Math.PI * 2);
          ctx.setLineDash([5, 7]); ctx.strokeStyle = fgA(0.32); ctx.lineWidth = 1.2; ctx.stroke();
          ctx.setLineDash([]);
        } else {
          ctx.setLineDash([4, 6]);
          ctx.strokeStyle = 'rgba(217,74,61,0.35)';
          ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.arc(activeTurret.x, activeTurret.y, 90, 0, Math.PI * 2); ctx.stroke();
          ctx.setLineDash([]);
        }
      } else if (state === 'play' && mouse.x > -500) {
        const ok = canPlace(mouse.x, mouse.y);
        const st = tStats(1);
        ctx.beginPath(); ctx.arc(mouse.x, mouse.y, st.range, 0, Math.PI * 2);
        ctx.setLineDash([3, 8]);
        ctx.strokeStyle = ok ? fgA(0.16) : 'rgba(192,57,43,0.28)';
        ctx.lineWidth = 1; ctx.stroke(); ctx.setLineDash([]);
        ctx.beginPath(); ctx.arc(mouse.x, mouse.y, st.r, 0, Math.PI * 2);
        ctx.fillStyle = ok ? fgA(0.35) : 'rgba(192,57,43,0.18)'; ctx.fill();
      }
    }

    for (const t of turrets) drawTurret(t);

    for (const b of beams) {
      const a = b.life / b.maxLife;
      const bf = b.f === undefined ? 1 : b.f;
      const g1 = ctx.createLinearGradient(b.x1, b.y1, b.x2, b.y2);
      g1.addColorStop(0, 'rgba(217,74,61,' + (0.3 * a) + ')'); g1.addColorStop(1, 'rgba(217,74,61,' + (0.3 * a * bf) + ')');
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2);
      ctx.strokeStyle = g1; ctx.lineWidth = 10 * a * (0.5 + 0.5 * bf) + 3; ctx.lineCap = 'round'; ctx.stroke();
      const g2 = ctx.createLinearGradient(b.x1, b.y1, b.x2, b.y2);
      g2.addColorStop(0, 'rgba(255,200,190,' + (0.95 * a) + ')'); g2.addColorStop(1, 'rgba(255,200,190,' + (0.95 * a * bf) + ')');
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2);
      ctx.strokeStyle = g2; ctx.lineWidth = 1.5; ctx.stroke();
    }

    for (const e of fx) {
      const a = e.life / e.maxLife;
      if (e.type === 'chain') {
        ctx.strokeStyle = 'rgba(138,95,217,' + (0.9 * a) + ')';
        ctx.lineWidth = 2.4; ctx.lineCap = 'round';
        for (let i = 0; i < e.points.length - 1; i++) {
          const p1 = e.points[i], p2 = e.points[i+1];
          const segs = 4;
          ctx.beginPath(); ctx.moveTo(p1.x, p1.y);
          for (let s = 1; s < segs; s++) {
            const t = s / segs;
            ctx.lineTo(p1.x + (p2.x - p1.x) * t + (Math.random() - 0.5) * 8,
                       p1.y + (p2.y - p1.y) * t + (Math.random() - 0.5) * 8);
          }
          ctx.lineTo(p2.x, p2.y); ctx.stroke();
        }
      } else if (e.type === 'splash') {
        const r = e.r * (1 + (1 - a) * 0.5);
        ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(224,122,43,' + (0.7 * a) + ')';
        ctx.lineWidth = 2.4; ctx.stroke();
      } else if (e.type === 'impact') {
        const p = 1 - a;
        const r = e.r + p * 14;
        ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
        ctx.strokeStyle = e.color;
        ctx.globalAlpha = a * 0.8;
        ctx.lineWidth = 1.6; ctx.stroke();
        ctx.globalAlpha = 1;
      } else if (e.type === 'ring') {
        const p = 1 - a;
        const r = e.r + p * 24;
        ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
        ctx.strokeStyle = e.color;
        ctx.globalAlpha = a * 0.85;
        ctx.lineWidth = 2.4; ctx.stroke();
        ctx.globalAlpha = 1;
      } else if (e.type === 'waveRipple') {
        const p = 1 - a;
        const r = e.r + p * 280;
        ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
        ctx.strokeStyle = accentA(a * 0.6);
        ctx.lineWidth = 3; ctx.stroke();
        ctx.beginPath(); ctx.arc(e.x, e.y, r * 0.82, 0, Math.PI * 2);
        ctx.strokeStyle = accentA(a * 0.3);
        ctx.lineWidth = 1.5; ctx.stroke();
      } else if (e.type === 'blackhole') {
        const p = 1 - a;
        const r = e.r * (1 - p * 0.4);
        ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(90,58,168,' + (a * 0.85) + ')';
        ctx.lineWidth = 2.4; ctx.stroke();
        ctx.beginPath(); ctx.arc(e.x, e.y, r * 0.45, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(20,10,40,' + (a * 0.9) + ')';
        ctx.lineWidth = 3.5; ctx.stroke();
        for (let i = 0; i < 4; i++) {
          const ang = i * Math.PI / 2 + p * 3;
          const ax = e.x + Math.cos(ang) * r * 0.75;
          const ay = e.y + Math.sin(ang) * r * 0.75;
          ctx.beginPath();
          ctx.moveTo(ax, ay);
          ctx.lineTo(ax - Math.cos(ang) * 8, ay - Math.sin(ang) * 8);
          ctx.strokeStyle = 'rgba(160,120,240,' + (a * 0.8) + ')';
          ctx.lineWidth = 2; ctx.stroke();
        }
      } else if (e.type === 'execute') {
        const p = 1 - a;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 6 + p * 22, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(200,26,26,' + (a * 0.9) + ')';
        ctx.lineWidth = 2.4; ctx.stroke();
        const s = 7 + p * 5;
        ctx.strokeStyle = 'rgba(255,255,255,' + a + ')';
        ctx.lineWidth = 2.4; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(e.x - s, e.y - s); ctx.lineTo(e.x + s, e.y + s);
        ctx.moveTo(e.x + s, e.y - s); ctx.lineTo(e.x - s, e.y + s);
        ctx.stroke();
      } else if (e.type === 'bounce') {
        ctx.beginPath(); ctx.moveTo(e.x1, e.y1); ctx.lineTo(e.x2, e.y2);
        ctx.strokeStyle = 'rgba(217,43,217,' + (0.75 * a) + ')';
        ctx.lineWidth = 1.4; ctx.setLineDash([3, 4]); ctx.stroke(); ctx.setLineDash([]);
      } else if (e.type === 'drain') {
        ctx.beginPath(); ctx.moveTo(e.x1, e.y1); ctx.lineTo(e.x2, e.y2);
        ctx.strokeStyle = 'rgba(168,43,217,' + (0.75 * a) + ')';
        ctx.lineWidth = 1.6; ctx.setLineDash([2, 3]); ctx.stroke(); ctx.setLineDash([]);
      } else if (e.type === 'heal') {
        const p = 1 - a;
        const r = e.r + 4 + p * 32;
        ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(95,218,122,' + (a * 0.9) + ')';
        ctx.lineWidth = 3; ctx.stroke();
        const cs = 6 + p * 3;
        ctx.beginPath();
        ctx.moveTo(e.x - cs, e.y); ctx.lineTo(e.x + cs, e.y);
        ctx.moveTo(e.x, e.y - cs); ctx.lineTo(e.x, e.y + cs);
        ctx.strokeStyle = 'rgba(255,255,255,' + (a * 0.95) + ')';
        ctx.lineWidth = 2.4; ctx.stroke();
      } else if (e.type === 'gunKill') {
        const p = 1 - a;
        const r = e.r + 4 + p * 44;
        ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(199,107,255,' + (a * 0.85) + ')';
        ctx.lineWidth = 2.4; ctx.stroke();
      } else if (e.type === 'healBeam') {
        ctx.strokeStyle = 'rgba(61,220,132,' + (0.9 * a) + ')'; ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.moveTo(e.x1, e.y1); ctx.lineTo(e.x2, e.y2); ctx.stroke(); ctx.setLineDash([]);
        ctx.beginPath(); ctx.arc(e.x2, e.y2, 4 + (1 - a) * 8, 0, Math.PI * 2); ctx.stroke();
      } else if (e.type === 'taunt') {
        const p = 1 - a;
        ctx.strokeStyle = 'rgba(199,107,255,' + (0.8 * a) + ')'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r + p * TAUNT_R, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      } else if (e.type === 'lungeHit') {
        const p = 1 - a;
        ctx.strokeStyle = 'rgba(255,90,74,' + a + ')'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r + p * 26, 0, Math.PI * 2); ctx.stroke();
        for (let i = 0; i < 6; i++) { const an = i * Math.PI / 3; ctx.beginPath(); ctx.moveTo(e.x + Math.cos(an) * (e.r + p * 14), e.y + Math.sin(an) * (e.r + p * 14)); ctx.lineTo(e.x + Math.cos(an) * (e.r + 8 + p * 30), e.y + Math.sin(an) * (e.r + 8 + p * 30)); ctx.stroke(); }
      } else if (e.type === 'zap') {
        ctx.strokeStyle = 'rgba(150,240,255,' + (0.95 * a) + ')'; ctx.lineWidth = 1.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath(); ctx.moveTo(e.x1, e.y1);
        for (let k = 1; k < 6; k++) { const f = k / 6; ctx.lineTo(e.x1 + (e.x2 - e.x1) * f + (Math.random() - 0.5) * 9, e.y1 + (e.y2 - e.y1) * f + (Math.random() - 0.5) * 9); }
        ctx.lineTo(e.x2, e.y2); ctx.stroke();
      } else if (e.type === 'shieldBreak') {
        const p = 1 - a;
        ctx.strokeStyle = 'rgba(120,220,255,' + (a * 0.9) + ')'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 12 + p * 34, 0, Math.PI * 2); ctx.stroke();
        ctx.lineWidth = 2; ctx.lineCap = 'round';
        for (let i = 0; i < 8; i++) {
          const an = i * Math.PI / 4 + 0.4, r1 = e.r + 12 + p * 26, r2 = r1 + 8;
          ctx.beginPath(); ctx.moveTo(e.x + Math.cos(an) * r1, e.y + Math.sin(an) * r1); ctx.lineTo(e.x + Math.cos(an) * r2, e.y + Math.sin(an) * r2); ctx.stroke();
        }
      } else if (e.type === 'build') {
        const p = 1 - a, d = e.r + 26 - p * 18, L = 7;
        ctx.strokeStyle = accentA(a); ctx.lineWidth = 2; ctx.lineCap = 'square';
        for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(e.x + sx * d, e.y + sy * (d - L)); ctx.lineTo(e.x + sx * d, e.y + sy * d); ctx.lineTo(e.x + sx * (d - L), e.y + sy * d);
          ctx.stroke();
        }
      } else if (e.type === 'levelUp') {
        const p = 1 - a;
        ctx.strokeStyle = accentA(a * 0.9); ctx.lineWidth = 3 * a + 1;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 4 + p * 46, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,' + (a * 0.8) + ')'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 4 + p * 28, 0, Math.PI * 2); ctx.stroke();
        for (let i = 0; i < 8; i++) {
          const an = i * Math.PI / 4 + p * 1.5;
          ctx.beginPath();
          ctx.moveTo(e.x + Math.cos(an) * (e.r + 8 + p * 30), e.y + Math.sin(an) * (e.r + 8 + p * 30));
          ctx.lineTo(e.x + Math.cos(an) * (e.r + 14 + p * 36), e.y + Math.sin(an) * (e.r + 14 + p * 36));
          ctx.stroke();
        }
      } else if (e.type === 'explode') {
        const p = 1 - a, rad = e.r * (1 + p * 3);
        const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, rad);
        g.addColorStop(0, 'rgba(255,240,200,' + a + ')'); g.addColorStop(0.5, 'rgba(255,120,50,' + (a * 0.6) + ')'); g.addColorStop(1, 'rgba(255,60,30,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(e.x, e.y, rad, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,90,60,' + a + ')'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r + p * 50, 0, Math.PI * 2); ctx.stroke();
      } else if (e.type === 'sell') {
        const p = 1 - a;
        const r = e.r + 6 + p * 20;
        ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(95,218,122,' + (a * 0.7) + ')';
        ctx.lineWidth = 2; ctx.stroke();
        ctx.globalAlpha = a;
        txt('+$' + e.amount, e.x, e.y - 26 - p * 16, 14, '#5fda7a', 'center', '700', 1);
        ctx.globalAlpha = 1;
      }
    }

    if (state === 'play' && !paused && !betweenWaves) {
      const mv = Math.min(1, Math.hypot(player.vx, player.vy) / PLAYER_SPEED);
      ctx.save(); ctx.setLineDash([5, 7]); ctx.lineDashOffset = -performance.now() / 70; ctx.lineWidth = 1.2;
      ctx.strokeStyle = 'rgba(199,107,255,' + (0.10 + 0.28 * mv) + ')';
      ctx.beginPath(); ctx.arc(player.x, player.y, player.aggro, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
    if (player.trail) {
      for (const tr of player.trail) {
        const a = (tr.life / tr.maxLife) * 0.35;
        const sz = (tr.life / tr.maxLife) * (player.r * 0.85);
        ctx.beginPath(); ctx.arc(tr.x, tr.y, sz, 0, Math.PI * 2);
        ctx.fillStyle = fgA(a * 0.6);
        ctx.fill();
      }
    }

    for (const z of zombies) {
      if (z.type !== 'medic' || !z.mt || z.mt.hp <= 0 || zombies.indexOf(z.mt) === -1) continue;
      const o = z.mt, dx = o.x - z.x, dy = o.y - z.y, d = Math.hypot(dx, dy);
      if (d > 190) continue;
      const tt = performance.now() / 1000;
      const nx = -dy / (d || 1), ny = dx / (d || 1);
      const sag = Math.min(16, d * 0.18) * (0.75 + 0.25 * Math.sin(tt * 3 + z.x * 0.05));
      const cx = (z.x + o.x) / 2 + nx * sag, cy = (z.y + o.y) / 2 + ny * sag + 4;
      const fade = Math.max(0.25, 1 - d / 220);
      ctx.save();
      ctx.lineCap = 'round';
      ctx.globalAlpha = Math.max(0, 1 - Math.max(0, z.spawnT || 0) * 1.4);
      ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 3.6;
      ctx.beginPath(); ctx.moveTo(z.x, z.y); ctx.quadraticCurveTo(cx, cy, o.x, o.y); ctx.stroke();
      ctx.strokeStyle = 'rgba(61,220,132,' + (0.55 + 0.4 * fade) + ')'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(z.x, z.y); ctx.quadraticCurveTo(cx, cy, o.x, o.y); ctx.stroke();
      const bez = (u, a, b, c) => (1 - u) * (1 - u) * a + 2 * (1 - u) * u * b + u * u * c;
      const pulsing = z.pulseT > 0;
      const nP = pulsing ? 1 : 2;
      for (let k = 0; k < nP; k++) {
        const u = pulsing ? 1 - z.pulseT / 0.35 : ((tt * 0.7 + k * 0.5) % 1);
        const px = bez(u, z.x, cx, o.x), py = bez(u, z.y, cy, o.y);
        ctx.beginPath(); ctx.arc(px, py, pulsing ? 3.6 : 2, 0, Math.PI * 2);
        ctx.fillStyle = pulsing ? '#ffffff' : 'rgba(190,255,215,0.9)'; ctx.fill();
        if (pulsing) { ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2); ctx.fillStyle = 'rgba(61,220,132,0.35)'; ctx.fill(); }
      }
      for (const pt of [z, o]) {
        ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2); ctx.fillStyle = '#12351f'; ctx.fill();
        ctx.beginPath(); ctx.arc(pt.x, pt.y, 1.6, 0, Math.PI * 2); ctx.fillStyle = '#3ddc84'; ctx.fill();
      }
      ctx.restore();
    }

    for (const z of zombies) {
      const def = z.def || ENEMY_TYPES.grunt;
      const l = theme.zombieLight + (def.lightOffset || 0) + z.hit * 42;
      const s = theme.zombieSat + (def.satOffset || 0) + z.hit * 22;
      const spawnScale = z.spawnT > 0 ? (1 - z.spawnT * 0.9) : 1;
      const spawnAlpha = z.spawnT > 0 ? (1 - z.spawnT * 1.4) : 1;
      ctx.globalAlpha = Math.max(0, spawnAlpha);
      ctx.fillStyle = theme.isDark ? 'rgba(0,0,0,0.38)' : 'rgba(0,0,0,0.13)';
      ctx.beginPath(); ctx.ellipse(z.x + 2, z.y + z.r * 0.75, z.r * 0.95, z.r * 0.42, 0, 0, Math.PI * 2); ctx.fill();

      if (z.bonus) {
        const trailLen = 5;
        for (let i = 0; i < trailLen; i++) {
          const tx = z.x - z.bonusDir * i * 6;
          const alpha = 0.5 * (1 - i / trailLen);
          ctx.beginPath();
          ctx.arc(tx, z.y, z.r * (0.8 - i * 0.1), 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(199,107,255,' + alpha + ')';
          ctx.fill();
        }
        const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 200);
        ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2);
        ctx.fillStyle = '#c76bff'; ctx.fill();
        ctx.beginPath(); ctx.arc(z.x, z.y, z.r + 3 + pulse * 2, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(199,107,255,' + (0.7 * pulse) + ')';
        ctx.lineWidth = 1.6; ctx.stroke();
        ctx.beginPath(); ctx.arc(z.x, z.y, z.r * 0.4, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff'; ctx.fill();
      } else {
        if (SPECIAL_COLORS[z.type]) { drawSpecialZombie(z, spawnScale); }
        else { ctx.fillStyle = 'hsl(' + z.hue + ',' + s + '%,' + l + '%)';
        ctx.beginPath(); ctx.arc(z.x, z.y, z.r * spawnScale, 0, Math.PI * 2); ctx.fill(); }

        if (!SPECIAL_COLORS[z.type] && z.face !== undefined && z.spawnT <= 0) {
          const er = Math.max(1, z.r * 0.17);
          for (const sgn of [-1, 1]) {
            const ea = z.face + sgn * 0.55;
            ctx.beginPath(); ctx.arc(z.x + Math.cos(ea) * z.r * 0.52, z.y + Math.sin(ea) * z.r * 0.52, er, 0, Math.PI * 2);
            ctx.fillStyle = theme.bg; ctx.fill();
          }
        }
        if (z.type === 'brute') {
          ctx.beginPath(); ctx.arc(z.x, z.y, z.r + 1, 0, Math.PI * 2);
          ctx.strokeStyle = 'hsl(' + z.hue + ',' + s + '%,' + Math.max(10, l - 20) + '%)';
          ctx.lineWidth = 1.6; ctx.stroke();
        }
        if (z.type === 'sprinter') {
          if (z.speed > 60) {
            ctx.beginPath();
            ctx.arc(z.x, z.y, z.r * 0.5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.fill();
          }
        }
      }

      if (z.freezeT > gameTime) {
        ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(200,235,255,0.45)'; ctx.fill();
      }
      if (z.hit > 0.1) {
        ctx.beginPath(); ctx.arc(z.x, z.y, z.r + 1.5, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,' + (z.hit * 0.7) + ')';
        ctx.lineWidth = 1.6; ctx.stroke();
      }
      if ((z.type === 'brute' || z.bonus || SPECIAL_COLORS[z.type]) && z.hp < z.maxHp) {
        const w = z.r * 2.4;
        const h = 2.5;
        const bx = z.x - w / 2;
        const by = z.y - z.r - 8;
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(bx, by, w, h);
        ctx.fillStyle = z.bonus ? '#c76bff' : (SPECIAL_COLORS[z.type] || '#d9a02b');
        ctx.fillRect(bx, by, w * (z.hp / z.maxHp), h);
      }
      if (z.chew > 0.6) { ctx.beginPath(); ctx.arc(z.x, z.y, z.r + 3, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(255,59,48,' + Math.min(1, z.chew / 3) + ')'; ctx.lineWidth = 1.6; ctx.stroke(); }
      drawZombieStatus(z);
      ctx.globalAlpha = 1;
    }

    for (const b of ebullets) {
      const col = b.kind === 'fire' ? '#ff6a2a' : '#ff3b5c';
      ctx.globalAlpha = 0.3; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1; ctx.fillStyle = b.kind === 'fire' ? '#ffd27a' : '#ffb0c0'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.stroke();
    }

    for (const b of bullets) {
      if (b.trail) {
        for (const tr of b.trail) {
          const a = tr.life / 0.12;
          const col = bulletColor(b);
          ctx.globalAlpha = a * 0.6;
          ctx.fillStyle = col;
          ctx.beginPath(); ctx.arc(tr.x, tr.y, b.r * 0.8, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      if (b.turret) {
        const eff = b.turret.eff;
        if (eff.mods.ice > 0) {
          ctx.beginPath(); ctx.arc(b.x - b.vx * 0.014, b.y - b.vy * 0.014, b.r * 0.7, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(168,220,245,0.45)'; ctx.fill();
        }
        if (eff.mods.fire > 0) {
          ctx.beginPath(); ctx.arc(b.x - b.vx * 0.012, b.y - b.vy * 0.012, b.r * 0.7, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,140,60,0.45)'; ctx.fill();
        }
        if (eff.mods.poison > 0) {
          ctx.beginPath(); ctx.arc(b.x - b.vx * 0.012, b.y - b.vy * 0.012, b.r * 0.8, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(95,173,60,0.4)'; ctx.fill();
        }
      }
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = bulletColor(b); ctx.fill();
      ctx.globalAlpha = 0.28; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2.6, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
      ctx.strokeStyle = bulletColor(b); ctx.lineWidth = b.r * 1.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 0.03, b.y - b.vy * 0.03); ctx.stroke();
    }

    for (const s of specials) {
      for (const tr of s.trail) {
        const a = Math.max(0, tr.life / 0.32);
        const sz = 1.4 + a * 2.4;
        ctx.beginPath(); ctx.arc(tr.x, tr.y, sz, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(199,107,255,' + (a * 0.9) + ')'; ctx.fill();
      }
      const glow = 0.85 + 0.15 * Math.sin(performance.now() / 60);
      ctx.beginPath(); ctx.arc(s.x, s.y, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(199,107,255,' + (0.35 * glow) + ')'; ctx.fill();
      ctx.beginPath(); ctx.arc(s.x, s.y, 2.6, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff'; ctx.fill();
      ctx.beginPath(); ctx.arc(s.x, s.y, 1.4, 0, Math.PI * 2);
      ctx.fillStyle = '#c76bff'; ctx.fill();
    }

    const hpRatio = Math.max(0, player.hp / player.maxHp);
    if (player.gunEquipped) {
      const pulse = 0.55 + 0.45 * Math.sin(performance.now() / 220);
      const lowHp = player.hp <= player.maxHp * GUN_COST_PCT;
      ctx.beginPath(); ctx.arc(player.x, player.y, player.r + 7 + pulse * 2, 0, Math.PI * 2);
      ctx.strokeStyle = lowHp ? 'rgba(192,57,43,' + (0.7 * pulse) + ')' : 'rgba(199,107,255,' + (0.75 * pulse) + ')';
      ctx.lineWidth = 1.6; ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r + 4, -Math.PI/2, -Math.PI/2 + Math.PI * 2 * hpRatio);
    ctx.strokeStyle = player.hurt > 0.25 ? '#d94a3d' : fgA(0.5);
    ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.stroke();
    ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
    ctx.fillStyle = theme.player; ctx.fill();
    ctx.beginPath(); ctx.arc(player.x, player.y, player.r * 0.32, 0, Math.PI * 2);
    ctx.fillStyle = player.gunEquipped ? '#c76bff' : theme.playerCore; ctx.fill();
    if (player.burnT > 0) {
      const fl = 0.6 + 0.4 * Math.sin(performance.now() / 60);
      ctx.beginPath(); ctx.arc(player.x, player.y, player.r + 3 + fl * 2, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,120,40,' + (0.8 * fl) + ')'; ctx.lineWidth = 2.2; ctx.stroke();
    }
    if (player.dashCd > DASH_CD - 0.25) {
      ctx.beginPath(); ctx.arc(player.x, player.y, player.r + 5, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(199,107,255,0.7)'; ctx.lineWidth = 2; ctx.stroke();
    }
    if (player.gunFlash > 0) {
      ctx.beginPath(); ctx.arc(player.x, player.y, player.r + 10 * (1 - player.gunFlash), 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(199,107,255,' + (player.gunFlash * 0.7) + ')';
      ctx.lineWidth = 2; ctx.stroke();
    }

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      if (p.shard) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillRect(-p.s/2, -p.s/2, p.s, p.s);
        ctx.restore();
      } else {
        ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
      }
    }
    ctx.globalAlpha = 1;

    for (const ft of floatTexts) {
      const a = ft.life / ft.maxLife;
      ctx.globalAlpha = a;
      txt(ft.text, ft.x, ft.y, ft.size, ft.color, 'center', '700', 1);
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    // Low HP vignette only (no crit/heal screen flashes)
    if (state === 'play' && hpRatio < 0.3 && !settingsOpen && !showingHelp) {
      const intensity = 1 - hpRatio / 0.3;
      const pulse = 0.55 + 0.45 * Math.sin(performance.now() / 320);
      const g = ctx.createRadialGradient(W/2, H/2, Math.min(W,H) * 0.35, W/2, H/2, Math.max(W,H) * 0.72);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(192,57,43,' + (0.42 * intensity * (0.5 + 0.5 * pulse)) + ')');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    if (state === 'play' && player.hurt > 0.05 && !settingsOpen && !showingHelp) {
      const g2 = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.75);
      g2.addColorStop(0, 'rgba(0,0,0,0)'); g2.addColorStop(1, 'rgba(220,40,30,' + (player.hurt * 0.3) + ')');
      ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
    }

    if (activeTurret && state === 'play' && !player.gunEquipped && !settingsOpen && !showingHelp && !paused) drawTurretPanel(activeTurret);

    if (banner && state === 'play' && !paused && !settingsOpen && !showingHelp) {
      const bt = banner.t;
      const dur = banner.dur || 2.0;
      const ba = bt < 0.25 ? bt / 0.25 : (bt > dur - 0.5 ? Math.max(0, (dur - bt) / 0.5) : 1);
      const slide = (1 - Math.min(1, bt / 0.35)) * 40;
      const bc = banner.color || theme.accent;
      const by = H * 0.4;
      ctx.globalAlpha = ba * 0.9;
      const lw = 90 + (1 - Math.min(1, bt / 0.5)) * 120;
      ctx.fillStyle = bc; ctx.fillRect(W / 2 - lw - 140, by + 22, lw, 2); ctx.fillRect(W / 2 + 140, by + 22, lw, 2);
      ctx.globalAlpha = ba;
      ctx.save(); ctx.shadowColor = bc; ctx.shadowBlur = 20;
      txt(banner.text, W / 2 + slide, by, 38, theme.text, 'center', '700', 10);
      ctx.restore();
      txt(banner.sub, W / 2 - slide, by + 34, 11, bc, 'center', '700', 3);
      if (banner.note) txt(banner.note, W / 2, by + 62, 11, banner.noteColor || bc, 'center', '700', 2);
      ctx.globalAlpha = 1;
    }

    if (addModFlash) {
      const t = addModFlash.t;
      const a = Math.max(0, 1 - t / 1.6);
      ctx.globalAlpha = a;
      txt(addModFlash.text, W / 2, 140 - t * 20, 20, addModFlash.color, 'center', '700', 4);
      ctx.globalAlpha = 1;
    }

    /* HUD */
    txt('$' + Math.floor(money), 26, 30, 16, theme.text, 'left', '700');
    const hpPct = Math.round(hpRatio * 100);
    const hpColor = hpRatio > 0.5 ? theme.text : (hpRatio > 0.25 ? '#8a7016' : '#c0392b');
    txt('HP ' + Math.ceil(player.hp) + ' / ' + player.maxHp, 26, 52, 12, hpColor, 'left', '700');
    if (player.burnT > 0) txt('BURNING', 150, 52, 11, '#ff6a2a', 'left', '700', 1);
    const barW = 100, barH = 4;
    ctx.fillStyle = fgA(0.12); ctx.fillRect(26, 62, barW, barH);
    ctx.fillStyle = hpColor; ctx.fillRect(26, 62, barW * hpRatio, barH);
    ctx.fillStyle = 'rgba(192,57,43,0.85)';
    ctx.fillRect(26 + barW * GUN_COST_PCT - 1, 60, 2, barH + 4);

    const canFire = canFireGun();
    const gunColor = !player.gunEquipped ? theme.textDim : (canFire ? '#8a3ad9' : '#c0392b');
    const gunText = player.gunEquipped
      ? (canFire ? 'GUN ARMED  ( -' + Math.round(player.maxHp * GUN_COST_PCT) + ' HP )' : 'GUN: TOO WEAK')
      : 'GUN HOLSTERED  ·  [G]';
    const gunW = 210, gunH = 24, gunX = 26, gunY = 78;
    ctx.fillStyle = player.gunEquipped ? (canFire ? 'rgba(138,58,217,0.12)' : 'rgba(192,57,43,0.14)') : fgA(0.06);
    ctx.fillRect(gunX, gunY, gunW, gunH);
    ctx.strokeStyle = gunColor;
    ctx.lineWidth = player.gunEquipped ? 1.4 : 1;
    ctx.strokeRect(gunX + 0.5, gunY + 0.5, gunW - 1, gunH - 1);
    txt(gunText, gunX + gunW / 2, gunY + gunH / 2, 10, gunColor, 'center', '700', 0.5);

    txt('KILLS ' + kills, 26, 116, 10, theme.textDim, 'left', '600', 1);
    txt(D().name, 26, 132, 10, D().color, 'left', '700', 2);
    {
      const dReady = player.dashCd <= 0;
      txt(dReady ? 'DASH READY  \u00b7  [SHIFT]' : 'DASH', 26, 150, 9, dReady ? '#8a3ad9' : theme.textDim, 'left', '700', 1);
      ctx.fillStyle = fgA(0.12); ctx.fillRect(26, 158, 100, 3);
      ctx.fillStyle = dReady ? '#c76bff' : theme.textDim; ctx.fillRect(26, 158, 100 * (1 - Math.max(0, player.dashCd) / DASH_CD), 3);
    }
    if (settings.showFps) txt('FPS ' + fps, 26, 176, 10, theme.textDim, 'left', '600', 1);

    const pb = pauseBtnRect();
    const wb = waveModeBtnRect();
    const sb = settingsBtnRect();

    const waveRightX = wb.x - 18;
    txt('WAVE ' + Math.max(1, wave), waveRightX, 30, 15, theme.text, 'right', '700');
    txt((zombies.length + spawnQueue.length) + ' LEFT', W - 26, 52, 11, theme.textDim, 'right', '400');

    {
      const hover = pointInRect(mouse.x, mouse.y, pb);
      ctx.fillStyle = paused ? theme.accent : (hover ? fgA(0.16) : fgA(0.06));
      ctx.fillRect(pb.x, pb.y, pb.w, pb.h);
      ctx.strokeStyle = theme.text; ctx.lineWidth = 1.2;
      ctx.strokeRect(pb.x + 0.5, pb.y + 0.5, pb.w - 1, pb.h - 1);
      const icx = pb.x + pb.w / 2, icy = pb.y + pb.h / 2;
      const ic = paused ? theme.accentText : theme.text;
      if (paused) {
        ctx.beginPath();
        ctx.moveTo(icx - 4, icy - 6); ctx.lineTo(icx + 6, icy); ctx.lineTo(icx - 4, icy + 6);
        ctx.closePath(); ctx.fillStyle = ic; ctx.fill();
      } else {
        ctx.fillStyle = ic;
        ctx.fillRect(icx - 4, icy - 6, 3, 12);
        ctx.fillRect(icx + 1, icy - 6, 3, 12);
      }
    }
    {
      const hover = pointInRect(mouse.x, mouse.y, wb);
      ctx.fillStyle = autoWave ? (hover ? fgA(0.16) : fgA(0.06)) : theme.accent;
      ctx.fillRect(wb.x, wb.y, wb.w, wb.h);
      ctx.strokeStyle = theme.text; ctx.lineWidth = 1.2;
      ctx.strokeRect(wb.x + 0.5, wb.y + 0.5, wb.w - 1, wb.h - 1);
      txt(autoWave ? 'AUTO' : 'MANUAL', wb.x + wb.w / 2, wb.y + wb.h / 2, 10,
          autoWave ? theme.text : theme.accentText, 'center', '700', 1.2);
    }
    {
      const hover = pointInRect(mouse.x, mouse.y, sb);
      ctx.fillStyle = hover ? fgA(0.16) : fgA(0.06);
      ctx.fillRect(sb.x, sb.y, sb.w, sb.h);
      ctx.strokeStyle = theme.text; ctx.lineWidth = 1.2;
      ctx.strokeRect(sb.x + 0.5, sb.y + 0.5, sb.w - 1, sb.h - 1);
      drawGearIcon(sb.x + sb.w / 2, sb.y + sb.h / 2, 7, theme.text);
    }

    if (betweenWaves && state === 'play' && !paused && !settingsOpen && !showingHelp) {
      txt(wave === 0 ? 'WAVE 1' : 'WAVE ' + (wave + 1), W / 2, 76, 22, theme.text, 'center', '700', 3);
      if (autoWave) txt('STARTING IN ' + Math.max(0, waveTimer).toFixed(1), W / 2, 104, 11, theme.textDim, 'center', '400', 1);
      else txt('MANUAL MODE — READY WHEN YOU ARE', W / 2, 104, 11, theme.textDim, 'center', '400', 1);
      if (player.hp < player.maxHp) txt('+20 HP ON WAVE START', W / 2, 122, 9, '#5fda7a', 'center', '700', 1);

      drawWavePreview(W / 2, 150, wave + 1);

      if (!autoWave) {
        const nb = nextWaveBtnRect();
        const nbHov = pointInRect(mouse.x, mouse.y, nb);
        const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 400);
        ctx.fillStyle = nbHov ? accentA(0.85) : theme.accent;
        ctx.fillRect(nb.x, nb.y, nb.w, nb.h);
        ctx.strokeStyle = theme.accentText; ctx.lineWidth = 1.5;
        ctx.strokeRect(nb.x + 0.5, nb.y + 0.5, nb.w - 1, nb.h - 1);
        ctx.strokeStyle = accentA(0.35 * pulse); ctx.lineWidth = 2;
        ctx.strokeRect(nb.x - 3, nb.y - 3, nb.w + 6, nb.h + 6);
        txt('START WAVE ' + (wave + 1), nb.x + nb.w/2, nb.y + nb.h/2, 13, theme.accentText, 'center', '700', 1.5);
      }
    }

    if (hintTimer > 0 && state === 'play' && !paused && !settingsOpen && !showingHelp && settings.showHints) {
      ctx.globalAlpha = Math.min(1, hintTimer / 2);
      const hint = player.gunEquipped
        ? 'AIM WITH CURSOR  ·  CLICK ENEMY TO KILL  ·  CLICK TURRET TO HEAL  ·  [G] HOLSTER'
        : 'WASD MOVE  ·  SHIFT DASH + TAUNT  ·  CLICK GROUND TO BUILD  ·  [O] SETTINGS';
      txt(hint, W / 2, H - 30, 11, theme.textDim, 'center', '400', 1);
      ctx.globalAlpha = 1;
    }

    if (paused && state === 'play' && !settingsOpen && !showingHelp) {
      drawPauseMenu();
    }

    if (settingsOpen) drawSettings();
    if (showingHelp) drawInstructions(true);

    if (state === 'dead') {
      ctx.fillStyle = theme.overlay;
      ctx.fillRect(0, 0, W, H);
      txt('YOU DIED', W / 2, H / 2 - 36, 42, theme.text, 'center', '700', 8);
      txt('WAVE ' + wave + '   ·   ' + kills + ' KILLS   ·   ' + D().name, W / 2, H / 2 + 16, 13, theme.textDim, 'center', '400', 2);
      if ((performance.now() - deadAt) > 600) {
        const a = 0.45 + 0.55 * Math.abs(Math.sin(performance.now() / 500));
        ctx.globalAlpha = a;
        txt('CLICK TO RESTART', W / 2, H / 2 + 62, 12, theme.text, 'center', '600', 2);
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawTopHUDButtonsOnly() {
    const sb = settingsBtnRect();
    const hover = pointInRect(mouse.x, mouse.y, sb);
    ctx.fillStyle = hover ? fgA(0.16) : fgA(0.06);
    ctx.fillRect(sb.x, sb.y, sb.w, sb.h);
    ctx.strokeStyle = theme.text; ctx.lineWidth = 1.2;
    ctx.strokeRect(sb.x + 0.5, sb.y + 0.5, sb.w - 1, sb.h - 1);
    drawGearIcon(sb.x + sb.w / 2, sb.y + sb.h / 2, 7, theme.text);
  }
  function drawGearIcon(cx, cy, r, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.4;
    ctx.lineCap = 'round';
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4 + performance.now() / 4000;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * (r * 0.75), cy + Math.sin(a) * (r * 0.75));
      ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.7, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawMenu() {
    menuThemeHitAreas = []; menuDiffHitAreas = [];
    const t = performance.now() / 1000;
    for (let i = 0; i < 26; i++) {
      const a = i * 2.4 + t * 0.25;
      const rad = 160 + Math.sin(i * 1.7 + t * 0.7) * 60;
      const x = W/2 + Math.cos(a) * rad * 1.4;
      const y = H/2 + Math.sin(a) * rad * 0.8;
      ctx.fillStyle = 'hsl(' + (theme.zombieHue + i * 0.7) + ',' + theme.zombieSat + '%,' + (theme.zombieLight + 10) + '%)';
      ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = theme.player;
    ctx.beginPath(); ctx.arc(W/2, H/2, PLAYER_R, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(W/2, H/2, PLAYER_R * 0.32, 0, Math.PI * 2); ctx.fillStyle = '#c76bff'; ctx.fill();

    txt('D3F3NS3', W / 2, H / 2 - 140, 56, theme.text, 'center', '700', 14);
    txt('A MINIMAL TOWER DEFENSE', W / 2, H / 2 - 96, 11, theme.textDim, 'center', '400', 3);
    {
      const keysD = ['easy', 'normal', 'hard', 'expert'];
      const bw = 96, bh = 28, gap = 8, totalW = bw * 4 + gap * 3, x0 = W / 2 - totalW / 2, by0 = H / 2 + 40;
      txt('DIFFICULTY  [1-4]', W / 2, by0 - 14, 10, theme.textDim, 'center', '700', 3);
      keysD.forEach((k, i) => {
        const d = DIFFS[k], x = x0 + i * (bw + gap), sel = k === difficulty;
        const hov = mouse.x >= x && mouse.x <= x + bw && mouse.y >= by0 && mouse.y <= by0 + bh;
        ctx.fillStyle = sel ? d.color : (hov ? fgA(0.14) : fgA(0.05)); ctx.fillRect(x, by0, bw, bh);
        ctx.strokeStyle = sel ? d.color : (hov ? theme.text : fgA(0.4)); ctx.lineWidth = sel ? 2 : 1;
        ctx.strokeRect(x + 0.5, by0 + 0.5, bw - 1, bh - 1);
        txt(d.name, x + bw / 2, by0 + bh / 2, 11, sel ? '#111111' : theme.text, 'center', '700', 2);
        menuDiffHitAreas.push({ x, y: by0, w: bw, h: bh, key: k });
      });
      txt(D().desc, W / 2, by0 + bh + 16, 10, D().color, 'center', '700', 1);
    }

    const a = 0.4 + 0.6 * Math.abs(Math.sin(performance.now() / 550));
    ctx.globalAlpha = a;
    txt('CLICK TO BEGIN', W / 2, H / 2 + 112, 14, theme.text, 'center', '700', 4);
    ctx.globalAlpha = 1;

    txt('NEW?  YOU\u2019LL SEE A QUICK GUIDE FIRST  ·  REOPEN IT FROM SETTINGS [?]',
        W / 2, H / 2 + 146, 10, theme.accent, 'center', '700', 0.6);
    txt('BUILD TURRETS  ·  STACK 20 MODIFIERS  ·  UPGRADES SCALE WITHOUT LIMIT',
        W / 2, H / 2 + 164, 10, theme.textDim, 'center', '400', 0.8);

    const swR = 12, swGap = 10;
    const totalSwW = THEMES.length * (swR * 2) + (THEMES.length - 1) * swGap;
    const startX = W / 2 - totalSwW / 2 + swR;
    const swY = H - 110;
    txt('THEME', W / 2, swY - 26, 10, theme.textDim, 'center', '700', 3);
    for (let i = 0; i < THEMES.length; i++) {
      const th = THEMES[i];
      const cx = startX + i * (swR * 2 + swGap);
      const cy = swY;
      const hovered = Math.hypot(mouse.x - cx, mouse.y - cy) <= swR + 3;
      const selected = i === themeIdx;
      ctx.beginPath(); ctx.arc(cx, cy, swR, 0, Math.PI * 2);
      ctx.fillStyle = th.bg; ctx.fill();
      ctx.beginPath(); ctx.arc(cx, cy, swR * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = th.accent; ctx.fill();
      if (selected) {
        ctx.beginPath(); ctx.arc(cx, cy, swR + 3, 0, Math.PI * 2);
        ctx.strokeStyle = theme.accent; ctx.lineWidth = 1.4;
        ctx.setLineDash([3, 3]); ctx.stroke(); ctx.setLineDash([]);
      }
      ctx.beginPath(); ctx.arc(cx, cy, swR, 0, Math.PI * 2);
      ctx.strokeStyle = selected ? theme.accent : (hovered ? theme.text : fgA(0.35));
      ctx.lineWidth = selected ? 2.2 : (hovered ? 1.6 : 1);
      ctx.stroke();
      menuThemeHitAreas.push({ cx, cy, r: swR, idx: i });
    }

    txt('WASD MOVE  ·  SHIFT DASH  ·  G GUN  ·  P PAUSE  ·  O SETTINGS  ·  ESC CLOSE  ·  F FULLSCREEN',
        W / 2, H - 40, 11, theme.textDim, 'center', '400', 0.8);
  }

  /* ================================================================ */
  /*  LOOP                                                             */
  /* ================================================================ */
  let lastT = performance.now();
  function loop(now) {
    let dt = (now - lastT) / 1000;
    lastT = now;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  resize();
  reset();
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
