  function applyMasterVolume() { if (masterGain) masterGain.gain.value = settings.masterVolume; }

  function initAudio() {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      masterGain = actx.createGain();
      masterGain.gain.value = settings.masterVolume;
      masterGain.connect(actx.destination);
      const len = Math.floor(actx.sampleRate * 0.25);
      noiseBuffer = actx.createBuffer(1, len, actx.sampleRate);
      const d = noiseBuffer.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { actx = null; }
  }
  function canPlay(name, ms) {
    const now = performance.now();
    if (soundCooldown[name] && now - soundCooldown[name] < ms) return false;
    soundCooldown[name] = now; return true;
  }
  function toneAt(freq, dur, type, vol, freqEnd, delay) {
    if (!actx) return;
    const t0 = actx.currentTime + (delay || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol * settings.sfxVolume, t0 + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(masterGain);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noiseAt(dur, vol, freq, q, delay) {
    if (!actx || !noiseBuffer) return;
    const t0 = actx.currentTime + (delay || 0);
    const src = actx.createBufferSource();
    src.buffer = noiseBuffer;
    const f = actx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1;
    const g = actx.createGain();
    g.gain.setValueAtTime(vol * settings.sfxVolume, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(masterGain);
    src.start(t0); src.stop(t0 + dur + 0.02);
  }

    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];

  function composeWave(waveNum) {
    const dd = D();
    const total = Math.round((6 + waveNum * 3) * dd.count);
    let grunts = total;
    let sprinters = 0;
    let brutes = 0;

    if (waveNum >= 3) {
      sprinters = Math.floor(total * (waveNum >= 8 ? 0.32 : 0.22));
      grunts = total - sprinters;
    }
    if (waveNum >= 5) {
      brutes = Math.floor(total * (waveNum >= 10 ? 0.25 : 0.15));
      grunts = total - sprinters - brutes;
    }
    const sp = dd.special;
    const cap = (n, f) => Math.max(0, Math.min(n, Math.ceil(total * f)));
    const lungers = waveNum >= 4 ? cap(Math.floor((waveNum - 3) * 0.6 * sp + 0.5), 0.16) : 0;
    const pyros   = waveNum >= 5 ? cap(Math.floor((waveNum - 4) * 0.5 * sp + 0.5), 0.12) : 0;
    const medics  = waveNum >= 6 ? cap(Math.max(1, Math.floor((waveNum - 5) * 0.4 * sp + 0.5)), 0.10) : 0;
    const trojans = waveNum >= 7 ? cap(Math.max(1, Math.floor((waveNum - 5) * 0.35 * sp + 0.5)), 0.09) : 0;
    grunts = Math.max(0, grunts - lungers - pyros - medics - trojans);

    const arr = [];
    for (let i = 0; i < grunts; i++) arr.push('grunt');
    for (let i = 0; i < sprinters; i++) arr.push('sprinter');
    for (let i = 0; i < brutes; i++) arr.push('brute');
    for (let i = 0; i < lungers; i++) arr.push('lunger');
    for (let i = 0; i < pyros; i++) arr.push('pyro');
    for (let i = 0; i < medics; i++) arr.push('medic');
    for (let i = 0; i < trojans; i++) arr.push('trojan');

    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function wrapText(text, maxWidth, font) {
    ctx.font = font;
    const words = text.split(' ');
    const lines = [];
    let cur = '';
    for (const w of words) {
      const test = cur ? cur + ' ' + w : w;
      if (ctx.measureText(test).width <= maxWidth) cur = test;
      else { if (cur) lines.push(cur); cur = w; }
    }
    if (cur) lines.push(cur);
    return lines;
  }
  function txt(str, x, y, size, color, align, weight, spacing) {
    ctx.font = (weight || '400') + ' ' + size + 'px ' + MONO;
    ctx.fillStyle = color;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'alphabetic';
    const ls = spacing || 0;
    if ('letterSpacing' in ctx) ctx.letterSpacing = ls + 'px';
    const dx = align === 'center' ? ls / 2 : (align === 'right' ? ls : 0);
    ctx.fillText(str, x + dx, y + size * 0.36);
    if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  }

  function computeEff(t) {
    const base = tStats(t.level);
    const m = t.mods;
    let range = base.range, dmg = base.dmg, interval = base.interval, hp = base.hp;
    let fireMode = 'bullet', laserPierce = false, laserMult = 1;
    let slowFactor = 0, slowDur = 0, freezeChance = 0, freezeDur = 0;
    let burnDps = 0, burnDur = 0, burnSpread = 0, burnBonus = 0;
    let poisonDps = 0, poisonDur = 0, poisonStacking = false, poisonBonus = 0;
    let chainJumps = 0, chainDmgRet = 0.6, chainRange = 90;
    let splashRadius = 0, splashDmgMult = 0, splashZone = 0;
    let stunChance = 0, stunDur = 0;
    let knockDist = 0, knockSlow = 0, knockSlowDur = 0;
    let critChance = 0, critMult = 1;
    let drainHeal = 0, drainPlayerHeal = 0, drainDmgBonus = 0;
    let bounceCount = 0, bounceRet = 0.7;
    let markBonus = 1, markDur = 0, markSpread = 0;
    let homingLevel = 0, homingStrength = 0, homingRetarget = false;
    let blackholeRadius = 0, blackholePull = 0;
    let executeThreshold = 0;
    let fieldRadius = 0, fieldDps = 0, fieldSlow = 1;
    let regenWave = 0, regenPassive = 0;
    let shieldMax = 0, shieldDelay = 0, shieldRate = 0;
    let nitroRadius = 0, nitroBoost = 0, nitroBullet = 0;
    const bd = base.dmg;

    if (m.rapid >= 1) interval *= 0.80;
    if (m.rapid >= 2) interval *= 0.65;
    if (m.rapid >= 3) { interval *= 0.85; dmg *= 1.15; }
    if (m.rapid >= 4) { interval *= 0.82; dmg *= 1.10; }
    if (m.ice > 0) {
      range *= 0.72;
      if (m.ice >= 1) { slowFactor = 0.60; slowDur = 1.5; }
      if (m.ice >= 2) { slowFactor = 0.45; slowDur = 2.0; }
      if (m.ice >= 3) { freezeChance = 0.25; freezeDur = 0.7; }
      if (m.ice >= 4) { slowFactor = 0.32; slowDur = 2.5; freezeChance = 0.42; freezeDur = 1.1; }
    }
    if (m.laser > 0) {
      fireMode = 'laser'; range = base.range * (1.15 + 0.1 * m.laser);
      if (m.laser === 1) laserMult = 0.42;
      else if (m.laser === 2) laserMult = 0.55;
      else if (m.laser === 3) { laserMult = 0.55; laserPierce = true; }
      else { laserMult = 0.70; laserPierce = true; }
      interval = Math.max(0.16, interval * 1.3);
    }
    if (m.fire >= 1) { burnDps = 3;  burnDur = 3.0; }
    if (m.fire >= 2) { burnDps = 6;  burnDur = 3.5; }
    if (m.fire >= 3) { burnSpread = 45; }
    if (m.fire >= 4) { burnDps = 11; burnDur = 4.0; burnSpread = 60; burnBonus = 1.6; }
    if (m.poison >= 1) { poisonDps = 3;  poisonDur = 3; }
    if (m.poison >= 2) { poisonDur = 5; }
    if (m.poison >= 3) { poisonDps = 5; poisonStacking = true; }
    if (m.poison >= 4) { poisonDps = 7; poisonStacking = true; poisonBonus = 1.25; }
    if (m.chain >= 1) { chainJumps = 2; chainDmgRet = 0.6; chainRange = 90; }
    if (m.chain >= 2) { chainJumps = 3; }
    if (m.chain >= 3) { chainRange = 130; }
    if (m.chain >= 4) { chainDmgRet = 0.85; chainJumps = 4; }
    if (m.splash >= 1) { splashRadius = 32; splashDmgMult = 0.5; }
    if (m.splash >= 2) { splashRadius = 48; }
    if (m.splash >= 3) { splashDmgMult = 0.75; }
    if (m.splash >= 4) { splashRadius = 60; splashZone = 2.0; splashDmgMult = 0.9; }
    if (m.stun >= 1) { stunChance = 0.10; stunDur = 0.5; }
    if (m.stun >= 2) { stunDur = 0.9; }
    if (m.stun >= 3) { stunChance = 0.20; }
    if (m.stun >= 4) { stunChance = 0.30; stunDur = 1.2; }
    if (m.knock >= 1) { knockDist = 30; }
    if (m.knock >= 2) { knockDist = 55; }
    if (m.knock >= 3) { knockDist = 75; }
    if (m.knock >= 4) { knockDist = 75; knockSlow = 0.6; knockSlowDur = 1.5; }
    if (m.crit >= 1) { critChance = 0.15; critMult = 2.0; }
    if (m.crit >= 2) { critChance = 0.25; }
    if (m.crit >= 3) { critMult = 2.5; }
    if (m.crit >= 4) { critChance = 0.35; critMult = 3.0; }
    if (m.drain >= 1) { drainHeal = 1; }
    if (m.drain >= 2) { drainHeal = 2; }
    if (m.drain >= 3) { drainHeal = 2; drainPlayerHeal = 0.5; }
    if (m.drain >= 4) { drainHeal = 3; drainPlayerHeal = 1.0; drainDmgBonus = 1.5; }
    if (m.bounce >= 1) { bounceCount = 1; bounceRet = 0.7; }
    if (m.bounce >= 2) { bounceCount = 2; bounceRet = 0.7; }
    if (m.bounce >= 3) { bounceRet = 0.85; }
    if (m.bounce >= 4) { bounceCount = 3; bounceRet = 0.9; }
    if (m.marked >= 1) { markBonus = 1.2;  markDur = 3; }
    if (m.marked >= 2) { markDur = 5; }
    if (m.marked >= 3) { markBonus = 1.35; }
    if (m.marked >= 4) { markSpread = 60; }
    if (m.homing >= 1) { homingLevel = 1; homingStrength = 3.0; }
    if (m.homing >= 2) { homingStrength = 5.5; }
    if (m.homing >= 3) { homingStrength = 8.0; }
    if (m.homing >= 4) { homingStrength = 10.0; homingRetarget = true; }
    if (m.blackhole >= 1) { blackholeRadius = 44; blackholePull = 55; }
    if (m.blackhole >= 2) { blackholeRadius = 62; blackholePull = 90; }
    if (m.blackhole >= 3) { blackholeRadius = 80; blackholePull = 130; }
    if (m.blackhole >= 4) { blackholeRadius = 100; blackholePull = 180; }
    if (m.execute >= 1) { executeThreshold = 0.10; }
    if (m.execute >= 2) { executeThreshold = 0.16; }
    if (m.execute >= 3) { executeThreshold = 0.24; }
    if (m.execute >= 4) { executeThreshold = 0.32; }
    if (m.field >= 1) { fieldRadius = 75;  fieldDps = bd * 0.22; }
    if (m.field >= 2) { fieldRadius = 95;  fieldDps = bd * 0.34; }
    if (m.field >= 3) { fieldRadius = 115; fieldDps = bd * 0.46; fieldSlow = 0.8; }
    if (m.field >= 4) { fieldRadius = 140; fieldDps = bd * 0.5; fieldSlow = 0.6; }
    if (m.regen >= 1) { regenWave = 0.08; }
    if (m.regen >= 2) { regenWave = 0.15; }
    if (m.regen >= 3) { regenWave = 0.24; regenPassive = 0.004; }
    if (m.regen >= 4) { regenWave = 0.35; regenPassive = 0.012; }
    if (m.shield >= 1) { shieldMax = hp * 0.20; shieldDelay = 4.0; shieldRate = 0.20; }
    if (m.shield >= 2) { shieldMax = hp * 0.32; shieldDelay = 3.4; shieldRate = 0.24; }
    if (m.shield >= 3) { shieldMax = hp * 0.45; shieldDelay = 3.0; shieldRate = 0.30; }
    if (m.shield >= 4) { shieldMax = hp * 0.65; shieldDelay = 2.5; shieldRate = 0.38; }
    if (m.nitro >= 1) { nitroRadius = 90;  nitroBoost = 0.12; }
    if (m.nitro >= 2) { nitroRadius = 115; nitroBoost = 0.20; }
    if (m.nitro >= 3) { nitroRadius = 140; nitroBoost = 0.28; nitroBullet = 0.15; }
    if (m.nitro >= 4) { nitroRadius = 170; nitroBoost = 0.38; nitroBullet = 0.30; }

    return {
      range, dmg: dmg * laserMult, interval, hp,
      fireMode, pierce: laserPierce,
      slowFactor, slowDur, freezeChance, freezeDur,
      burnDps, burnDur, burnSpread, burnBonus,
      poisonDps, poisonDur, poisonStacking, poisonBonus,
      chainJumps, chainDmgRet, chainRange,
      splashRadius, splashDmgMult, splashZone,
      stunChance, stunDur,
      knockDist, knockSlow, knockSlowDur,
      critChance, critMult,
      drainHeal, drainPlayerHeal, drainDmgBonus,
      bounceCount, bounceRet,
      markBonus, markDur, markSpread,
      homingLevel, homingStrength, homingRetarget,
      blackholeRadius, blackholePull,
      executeThreshold,
      fieldRadius, fieldDps, fieldSlow, regenWave, regenPassive,
      shieldMax, shieldDelay, shieldRate,
      nitroRadius, nitroBoost, nitroBullet,
      mods: m
    };
  }

  function ambient(t, dt) {
    if (particles.length > 700) return;
    const m = t.mods, r = tStats(t.level).r, R = Math.random;
    const em = (c, vx, vy, s) => particles.push({ x: t.x + (R() - 0.5) * r * 1.4, y: t.y + (R() - 0.5) * r, vx: vx + (R() - 0.5) * 20, vy, life: 0.6, maxLife: 0.6, s: s + R() * 1.2, color: c });
    if (m.fire && R() < dt * 6) em(R() < 0.5 ? '#ff8833' : '#ffcc33', 0, -40 - R() * 30, 1.6);
    if (m.ice && R() < dt * 4) em('#bfe6ff', 0, 12, 1.6);
    if (m.poison && R() < dt * 4) em('#5fad3c', 0, -22, 2);
    if (m.chain && R() < dt * 3) em('#b9a0ff', (R() - 0.5) * 120, (R() - 0.5) * 120, 1.4);
    if (m.regen && R() < dt * 1.5) em('#2fd47a', 0, -26, 2.2);
    if (m.nitro && R() < dt * 3) em('#f5a623', 0, -22, 2);
    if (t.nitro > 0 && R() < dt * 4) em('#ffd27a', 0, -34, 1.6);
    if (m.crit && R() < dt * 2) em('#ffd94a', 0, -30, 1.6);
  }

  function startGame() { initAudio(); reset(); state = 'play'; }
  function restartFromPause() { paused = false; startGame(); }
  function gameOver() {
    state = 'dead'; deadAt = performance.now();
    burst(player.x, player.y, 44, theme.player, 270, 3);
    shake = 16; sndGameOver();
    updateCursor();
  }
  function clearSelection() {
    activeTurret = null; panelRect = null; upgradeBtnRect = null; sellBtnRect = null;
  }
  function startWave() {
    betweenWaves = false; wave++;
    spawnQueue = composeWave(wave);
    spawnTimer = 0;
    player.hp = Math.min(player.maxHp, player.hp + 20);
    sndWave();
    banner = { text: 'WAVE ' + wave, sub: (spawnQueue.length) + ' ENEMIES INCOMING', t: 0, color: null };
    for (const ty of spawnQueue) {
      if (NEW_NOTES[ty] && !seenTypes[ty]) { seenTypes[ty] = true; banner.note = NEW_NOTES[ty]; banner.noteColor = SPECIAL_COLORS[ty]; banner.dur = 3.6; break; }
    }
    fx.push({ type: 'waveRipple', x: player.x, y: player.y, r: 8, life: 0.75, maxLife: 0.75 });
    ufoScheduled = wave >= 3 && Math.random() < 0.35;
    ufoSpawned = false;
    ufoTimer = 4 + Math.random() * 3;
    nextWavePreview = composeWave(wave + 1);
  }

  function burst(x, y, count, color, spread, size) {
    spread = spread || 130; size = size || 2.4;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 20 + Math.random() * spread;
      const life = 0.25 + Math.random() * 0.4;
      particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life, maxLife: life, s: 1.5 + Math.random()*size, color });
    }
  }
  function shards(x, y, count, color, spread, size) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 40 + Math.random() * spread;
      const life = 0.4 + Math.random() * 0.5;
      particles.push({
        x, y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30,
        life, maxLife: life,
        s: size * (0.7 + Math.random() * 0.8),
        color,
        rot: Math.random() * Math.PI * 2,
        rotV: (Math.random() - 0.5) * 14,
        shard: true,
        gravity: 220
      });
    }
  }
  function risingParticles(x, y, count, color, spread, riseSpeed) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = Math.random() * spread;
      const life = 0.5 + Math.random() * 0.5;
      particles.push({
        x: x + Math.cos(a) * r, y: y + Math.sin(a) * r,
        vx: Math.cos(a) * 12, vy: -riseSpeed - Math.random() * 40,
        life, maxLife: life, s: 1.5 + Math.random() * 2, color
      });
    }
  }
  function addFloatText(x, y, text, color, size) {
    floatTexts.push({ x, y, text, color, size: size || 14, life: 0.9, maxLife: 0.9, vy: -40 });
  }

  function spawnZombie(type, opts) {
    opts = opts || {};
    type = type || 'grunt';
    const def = ENEMY_TYPES[type] || ENEMY_TYPES.grunt;
    const m = 44;
    let x, y;
    const side = (Math.random() * 4) | 0;
    if (type === 'ufo') {
      const dir = Math.random() < 0.5 ? 1 : -1;
      x = dir === 1 ? -30 : W + 30;
      y = 100 + Math.random() * (H - 200);
      opts.bonusDir = dir;
    } else {
      if (side === 0)      { x = Math.random() * W; y = -m; }
      else if (side === 1) { x = W + m; y = Math.random() * H; }
      else if (side === 2) { x = Math.random() * W; y = H + m; }
      else                 { x = -m; y = Math.random() * H; }
    }
    const hp = (def.hpBase + wave * def.hpLinear + wave * wave * def.hpQuad) * D().hp;
    const r  = def.rBase + Math.min(def.rMax, wave * def.rScale);
    const baseSpeed = Math.min(def.speedMax, def.speedBase + wave * def.speedScale) * D().speed;
    zombies.push({
      x, y, r,
      hp, maxHp: hp,
      speed: baseSpeed * (0.85 + Math.random() * 0.3),
      hit: 0,
      hue: theme.zombieHue + Math.random() * theme.zombieHueRange,
      wob: Math.random() * Math.PI * 2,
      slowT: 0, slowF: 1, freezeT: 0, stunT: 0,
      burnT: 0, burnD: 0, burnSpread: 0,
      poisonT: 0, poisonD: 0, poisonStacks: 0,
      markT: 0, kx: 0, ky: 0, frost: 0, gunKilled: false,
      spawnT: 0.5,
      type: type,
      def: def,
      bonus: type === 'ufo',
      bonusDir: opts.bonusDir || 1
    });
    fx.push({ type: 'ring', x: Math.max(14, Math.min(W - 14, x)), y: Math.max(14, Math.min(H - 14, y)), r: 5, life: 0.45, maxLife: 0.45, color: theme.accent });
    sndSpawn();
  }

  function applyHit(z, baseDmg, turret, opts) {
    opts = opts || {};
    if (!turret || !turret.eff) { z.hp -= baseDmg; z.hit = 1; return { dmg: baseDmg, isCrit: false }; }
    const eff = turret.eff;
    let dmg = baseDmg;
    if (z.markT > gameTime && eff.markBonus > 1) dmg *= eff.markBonus;
    if (eff.burnBonus > 0 && (z.slowT > gameTime || z.freezeT > gameTime)) dmg *= eff.burnBonus;
    if (eff.poisonBonus > 0 && z.poisonStacks > 0) dmg *= eff.poisonBonus;
    if (eff.drainDmgBonus > 0 && z.hp < z.maxHp) dmg *= eff.drainDmgBonus;
    let isCrit = false;
    if (!opts.noCrit && eff.critChance > 0 && Math.random() < eff.critChance) { dmg *= eff.critMult; isCrit = true; }
    z.hp -= dmg; z.hit = 1;
    if (!opts.noEffects) {
      if (eff.slowFactor > 0) {
        if (z.slowT < gameTime || z.slowF > eff.slowFactor) z.slowF = eff.slowFactor;
        z.slowT = Math.max(z.slowT, gameTime + eff.slowDur);
        z.frost = 1; sndFrost();
      }
      if (eff.freezeChance > 0 && gameTime > (z.ccImmune || 0) && Math.random() < eff.freezeChance) { z.freezeT = gameTime + eff.freezeDur; z.ccImmune = z.freezeT + 1.5; }
      if (eff.burnDps > 0) {
        if (z.burnD < eff.burnDps) z.burnD = eff.burnDps;
        z.burnT = Math.max(z.burnT, gameTime + eff.burnDur);
        if (eff.burnSpread > 0) z.burnSpread = Math.max(z.burnSpread, eff.burnSpread);
        sndIgnite();
      }
      if (eff.poisonDps > 0) {
        if (eff.poisonStacking) z.poisonStacks = Math.min(5, (z.poisonStacks || 0) + 1);
        else z.poisonStacks = 1;
        z.poisonD = eff.poisonDps;
        z.poisonT = Math.max(z.poisonT, gameTime + eff.poisonDur);
        sndPoison();
      }
      if (eff.stunChance > 0 && gameTime > (z.ccImmune || 0) && Math.random() < eff.stunChance) { z.stunT = gameTime + eff.stunDur; z.ccImmune = z.stunT + 1.5; }
      if (eff.knockDist > 0 && opts.dirX !== undefined) {
        z.kx += opts.dirX * eff.knockDist;
        z.ky += opts.dirY * eff.knockDist;
        burst(z.x, z.y, 4, theme.textDim, 80, 1.8);
        if (eff.knockSlow > 0) {
          if (z.slowT < gameTime || z.slowF > eff.knockSlow) z.slowF = eff.knockSlow;
          z.slowT = Math.max(z.slowT, gameTime + eff.knockSlowDur);
        }
      }
      if (eff.markBonus > 1) z.markT = Math.max(z.markT, gameTime + eff.markDur);
      if (eff.drainHeal > 0) {
        turret.hp = Math.min(turret.maxHp, turret.hp + eff.drainHeal);
        if (eff.drainPlayerHeal > 0 && player.healBank > 0) { const h = Math.min(eff.drainPlayerHeal, player.healBank); player.healBank -= h; player.hp = Math.min(player.maxHp, player.hp + h); }
        fx.push({ type:'drain', x1: z.x, y1: z.y, x2: turret.x, y2: turret.y, life: 0.18, maxLife: 0.18 });
      }
      if (eff.blackholeRadius > 0) {
        for (const o of zombies) {
          if (o === z || o.bonus) continue;
          const ddx = z.x - o.x, ddy = z.y - o.y;
          const d = Math.hypot(ddx, ddy);
          if (d < eff.blackholeRadius && d > 0.001) {
            const f = (1 - d / eff.blackholeRadius) * eff.blackholePull * 0.14;
            o.kx += (ddx / d) * f;
            o.ky += (ddy / d) * f;
          }
        }
        fx.push({ type: 'blackhole', x: z.x, y: z.y, r: eff.blackholeRadius, life: 0.42, maxLife: 0.42 });
        sndBlackhole();
      }
      if (eff.executeThreshold > 0 && z.hp > 0 && z.hp / z.maxHp < eff.executeThreshold) {
        z.hp = 0;
        z.executed = true;
        fx.push({ type: 'execute', x: z.x, y: z.y, r: z.r, life: 0.5, maxLife: 0.5 });
        addFloatText(z.x, z.y - z.r - 8, 'EXECUTE', '#ff4444', 12);
        sndExecute();
      }
    }
    if (isCrit) {
      burst(z.x, z.y, 10, '#ffd94a', 160, 2.8);
      sndCrit();
      addFloatText(z.x, z.y - z.r - 6, Math.round(dmg).toString(), '#ffd94a', 16);
    }
    return { dmg, isCrit };
  }

  function doChain(z, dmg, turret, chainDmgRet, maxJumps, chainRange) {
    const hitSet = new Set([z]);
    let source = z;
    let chainDmg = dmg * chainDmgRet;
    const points = [{ x: z.x, y: z.y }];
    for (let i = 1; i < maxJumps; i++) {
      let nearest = null, nearestD = chainRange;
      for (const o of zombies) {
        if (hitSet.has(o)) continue;
        const d = Math.hypot(o.x - source.x, o.y - source.y);
        if (d < nearestD) { nearestD = d; nearest = o; }
      }
      if (!nearest) break;
      applyHit(nearest, chainDmg, turret, { noCrit: true, noEffects: true });
      hitSet.add(nearest);
      points.push({ x: nearest.x, y: nearest.y });
      chainDmg *= chainDmgRet;
      source = nearest;
    }
    if (points.length > 1) { fx.push({ type: 'chain', points, life: 0.16, maxLife: 0.16 }); sndChain(); }
  }

  function doSplash(z, dmg, turret, radius, mult) {
    for (const o of zombies) {
      if (o === z) continue;
      if (Math.hypot(o.x - z.x, o.y - z.y) < radius) applyHit(o, dmg * mult, turret, { noCrit: true, noEffects: false });
    }
    fx.push({ type: 'splash', x: z.x, y: z.y, r: radius, life: 0.32, maxLife: 0.32 });
    burst(z.x, z.y, 5, '#e07a2b', 100, 2);
  }

  function laserFalloff(d, R) {
    const n = d / Math.max(1, R);
    if (n <= 0.25) return 1;
    return Math.max(0.25, 1 - (n - 0.25));
  }
  function fireLaser(t, target) {
    const eff = t.eff;
    const angle = Math.atan2(target.y - t.y, target.x - t.x);
    const R = eff.range;
    let ex, ey;
    const hits = [];
    if (eff.pierce) {
      ex = t.x + Math.cos(angle) * R;
      ey = t.y + Math.sin(angle) * R;
      for (const z of zombies) {
        const d = distToSegment(z.x, z.y, t.x, t.y, ex, ey);
        if (d < z.r + 4 && z.x > -4 && z.x < W + 4 && z.y > -4 && z.y < H + 4) hits.push({ z, mult: z === target ? 1 : 0.5 });
      }
    } else { ex = target.x; ey = target.y; hits.push({ z: target, mult: 1 }); }
    for (const h of hits) {
      const dist = Math.hypot(h.z.x - t.x, h.z.y - t.y);
      const dmg = eff.dmg * h.mult * laserFalloff(dist, R);
      applyHit(h.z, dmg, t, { dirX: Math.cos(angle), dirY: Math.sin(angle) });
      if (h.z === target) {
        if (eff.chainJumps > 0) doChain(h.z, dmg * 0.6, t, eff.chainDmgRet, eff.chainJumps, eff.chainRange);
        if (eff.splashRadius > 0) doSplash(h.z, dmg * 0.6, t, eff.splashRadius, eff.splashDmgMult);
      }
    }
    beams.push({ x1: t.x, y1: t.y, x2: ex, y2: ey, life: 0.11, maxLife: 0.11, f: laserFalloff(Math.hypot(ex - t.x, ey - t.y), R) });
    burst(target.x, target.y, 3, '#d94a3d', 60, 1.4);
    fx.push({ type: 'impact', x: target.x, y: target.y, r: 5, life: 0.2, maxLife: 0.2, color: '#ff6a5a' });
    t.fireFlash = 1; t.recoil = 1;
    sndLaser();
  }

  function distToSegment(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx*dx + dy*dy;
    if (len2 < 1e-6) return Math.hypot(px - x1, py - y1);
    let t = ((px - x1) * dx + (py - y1) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (x1 + t*dx), py - (y1 + t*dy));
  }

  function fireBullets(t, target) {
    const eff = t.eff;
    const ang = Math.atan2(target.y - t.y, target.x - t.x);
    t.angle = ang;
    const st = tStats(t.level);
    const bx = t.x + Math.cos(ang) * (st.r + 6);
    const by = t.y + Math.sin(ang) * (st.r + 6);
    bullets.push({
      x: bx, y: by,
      vx: Math.cos(ang) * BULLET_SPEED * (1 + (t.nitroSpd || 0)), vy: Math.sin(ang) * BULLET_SPEED * (1 + (t.nitroSpd || 0)),
      dmg: eff.dmg, r: 2.2, life: 1.5,
      turret: t,
      bounceLeft: eff.bounceCount, bounceRet: eff.bounceRet,
      hitZombies: [],
      homing: eff.homingLevel > 0,
      homingStr: eff.homingStrength,
      homingRetarget: eff.homingRetarget,
      target: target,
      trail: []
    });
    const mc = bulletColorOf(t);
    for (let i = 0; i < 3; i++) {
      const a = ang + (Math.random() - 0.5) * 0.6;
      const s = 60 + Math.random() * 80;
      particles.push({
        x: bx, y: by,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 0.18 + Math.random() * 0.12, maxLife: 0.3,
        s: 1.2 + Math.random() * 1.2, color: mc
      });
    }
    t.fireFlash = 1; t.recoil = 1;
    sndShoot();
  }

  /* ================================================================ */
  /*  HEAL GUN                                                         */
  /* ================================================================ */
  function toggleGun() {
    if (!player) return;
    player.gunEquipped = !player.gunEquipped;
    sndGunToggle(player.gunEquipped);
    updateCursor();
    if (player.gunEquipped) clearSelection();
  }
  function canFireGun() { return player.hp > player.maxHp * GUN_COST_PCT + 0.001; }

  function fireGunAt(target, type) {
    if (!canFireGun()) { sndDenied(); flashMsg('TOO WEAK TO FIRE', '#c0392b'); return; }
    const cost = player.maxHp * GUN_COST_PCT;
    player.hp = Math.max(0, player.hp - cost);
    player.hurt = 1; player.gunFlash = 1;
    shake = Math.max(shake, 3);
    sndGunFire();
    burst(player.x, player.y, 12, '#c76bff', 150, 2.4);
    burst(player.x, player.y, 4, '#ffffff', 80, 1.6);
    const tx = target.x, ty = target.y;
    const dist = Math.hypot(tx - player.x, ty - player.y) || 1;
    specials.push({
      sx: player.x, sy: player.y, x: player.x, y: player.y,
      tx, ty, target, targetType: type,
      progress: 0, duration: Math.max(0.10, dist / GUN_SPEED),
      trail: [], swirlPhase: 0, sparkTimer: 0
    });
  }

  function applyGunEffect(s) {
    if (s.targetType === 'enemy') {
      const z = s.target;
      if (!z || z.hp <= 0 || zombies.indexOf(z) === -1) { burst(s.x, s.y, 6, '#c76bff', 90, 1.6); return; }
      z.gunKilled = true; z.hp = 0; z.hit = 1;
      burst(z.x, z.y, 26, '#c76bff', 260, 3);
      burst(z.x, z.y, 12, '#ffffff', 160, 2);
      shards(z.x, z.y, 6, '#c76bff', 90, 2.4);
      fx.push({ type: 'gunKill', x: z.x, y: z.y, life: 0.45, maxLife: 0.45, r: z.r });
      sndGunKill();
    } else {
      const t = s.target;
      if (!t || turrets.indexOf(t) === -1) { burst(s.x, s.y, 6, '#5aa5d9', 90, 1.6); return; }
      const heal = t.maxHp * GUN_HEAL_PCT;
      t.hp = Math.min(t.maxHp, t.hp + heal);
      t.healPulse = 1;
      fx.push({ type: 'heal', x: t.x, y: t.y, life: 0.55, maxLife: 0.55, r: tStats(t.level).r });
      risingParticles(t.x, t.y, 14, '#5fda7a', 12, 90);
      risingParticles(t.x, t.y, 6, '#ffffff', 8, 120);
      burst(t.x, t.y, 6, '#5fda7a', 60, 1.8);
      sndGunHeal();
    }
  }

  /* ================================================================ */
  /*  PLACEMENT / CLICKS                                               */
  /* ================================================================ */
  function canPlace(x, y) {
    if (money < TURRET_COST) return false;
    if (x < 60 || y < 60 || x > W - 60 || y > H - 60) return false;
    if (Math.hypot(x - player.x, y - player.y) < player.r + 24) return false;
    for (const t of turrets) if (Math.hypot(t.x - x, t.y - y) < tStats(t.level).r + 18) return false;
    return true;
  }
  function turretAt(x, y) {
    for (const t of turrets) if (Math.hypot(t.x - x, t.y - y) < tStats(t.level).r + 12) return t;
    return null;
  }
  function zombieAt(x, y, extra) {
    extra = extra || 8;
    let best = null, bestD = Infinity;
    for (const z of zombies) {
      const d = Math.hypot(z.x - x, z.y - y);
      if (d < z.r + extra && d < bestD) { bestD = d; best = z; }
    }
    return best;
  }
  function pointInRect(x, y, r) { return r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

  const BTN_H = 26, BTN_Y = 18;
  function settingsBtnRect() { return { x: W - 26 - 30,      y: BTN_Y, w: 30, h: BTN_H }; }
  function pauseBtnRect()    { return { x: W - 26 - 30 - 6 - 30, y: BTN_Y, w: 30, h: BTN_H }; }
  function waveModeBtnRect() { return { x: W - 26 - 30 - 6 - 30 - 6 - 78, y: BTN_Y, w: 78, h: BTN_H }; }

  function nextWaveBtnRect() { const w = 220, h = 44; return { x: W/2 - w/2, y: 170, w, h }; }

  function upgradeTurret(t) {
    if (t.level >= MAX_LEVEL) { sndDenied(); return; }
    const cost = milCost(t.level);
    if (money < cost) { sndDenied(); return; }
    money -= cost;
    t.invested += cost;
    t.level++;
    const oldMax = t.maxHp;
    t.maxHp = tStats(t.level).hp;
    // Preserve damage ratio when healing to new max
    const ratio = oldMax > 0 ? t.hp / oldMax : 1;
    t.hp = Math.max(t.maxHp * ratio, t.maxHp - (t.maxHp - t.hp)); // keep any existing damage, fill the rest
    if (t.hp > t.maxHp) t.hp = t.maxHp;
    if (t.hp < 1) t.hp = t.maxHp * 0.5;
    t.cd = 0; t.pulse = 1;
    t.eff = computeEff(t);
    burst(t.x, t.y, 16, theme.player, 100, 2);
    fx.push({ type: 'levelUp', x: t.x, y: t.y, r: tStats(t.level).r, life: 0.6, maxLife: 0.6 });
    risingParticles(t.x, t.y, 10, bulletColorOf(t), 14, 80);
    addFloatText(t.x, t.y - tStats(t.level).r - 24, 'LV ' + t.level, theme.text, 13);
    // Prestige chime past level 9
    if (t.level === 10) { sndPrestige(); }
    else sndUpgrade(t.level);
  }

  function addModifier(t, type) {
    if (!MOD_DEFS[type]) return;
    const slots = availSlots(t.level);
    if (usedSlots(t) >= slots) { sndDenied(); flashMsg('NO SLOTS', '#c0392b'); return; }
    const cost = modifierCost(t);
    if (money < cost) { sndDenied(); flashMsg('NEED $' + cost, '#c0392b'); return; }
    money -= cost;
    t.invested += cost;
    t.mods[type] = (t.mods[type] || 0) + 1;
    t.pulse = 1;
    t.eff = computeEff(t);
    const c = MOD_DEFS[type];
    burst(t.x, t.y, 14, c.color, 100, 2);
    sndAddMod();
    flashMsg('+' + c.name, c.dark);
  }

  function sellTurret(t) {
    if (!t) return;
    const refund = sellValue(t);
    money += refund;
    burst(t.x, t.y, 18, theme.textDim, 140, 2.4);
    burst(t.x, t.y, 8, theme.accent, 100, 2);
    fx.push({ type: 'sell', x: t.x, y: t.y, life: 0.6, maxLife: 0.6, r: tStats(t.level).r, amount: refund });
    const idx = turrets.indexOf(t);
    if (idx !== -1) turrets.splice(idx, 1);
    if (t === activeTurret) clearSelection();
    sndSell();
    flashMsg('+$' + refund, '#5fda7a');
  }

  function flashMsg(text, color) { addModFlash = { text, color, t: 0 }; }

  function handleClick(x, y) {
    if (showingHelp) {
      for (const a of instructionsHitAreas) {
        if (pointInRect(x, y, a) && a.action === 'closeHelp') { showingHelp = false; sndClose(); return; }
      }
      if (!pointInRect(x, y, settingsModalRect)) { showingHelp = false; sndClose(); }
      return;
    }
    if (state === 'instructions') {
      for (const a of instructionsHitAreas) {
        if (pointInRect(x, y, a) && a.action === 'begin') {
          hasSeenInstructions = true;
          startGame();
          return;
        }
      }
      return;
    }
    if (state === 'menu') {
      for (const a of menuDiffHitAreas) {
        if (pointInRect(x, y, a)) { setDifficulty(a.key); return; }
      }
      for (const a of menuThemeHitAreas) {
        if (Math.hypot(x - a.cx, y - a.cy) <= a.r + 2) { setTheme(a.idx); sndSelect(); return; }
      }
      if (!hasSeenInstructions) { state = 'instructions'; return; }
      startGame();
      return;
    }
    if (settingsOpen) { handleSettingsClick(x, y); return; }
    if (pointInRect(x, y, settingsBtnRect())) { settingsOpen = true; sndSelect(); return; }
    if (state === 'dead') { if (performance.now() - deadAt > 600) startGame(); return; }
    if (paused) {
      for (const a of pauseHitAreas) {
        if (pointInRect(x, y, a)) {
          if (a.action === 'resume') { paused = false; sndPause(); return; }
          if (a.action === 'restart') { restartFromPause(); return; }
        }
      }
      return;
    }
    if (pointInRect(x, y, pauseBtnRect())) { paused = !paused; sndPause(); return; }
    if (pointInRect(x, y, waveModeBtnRect())) { autoWave = !autoWave; sndSelect(); return; }
    if (pointInRect(x, y, { x: 26, y: 78, w: 210, h: 24 })) { toggleGun(); return; }
    if (betweenWaves && !autoWave && pointInRect(x, y, nextWaveBtnRect())) { startWave(); return; }
    if (player.gunEquipped) {
      const t = turretAt(x, y);
      if (t) { fireGunAt(t, 'turret'); return; }
      const z = zombieAt(x, y, 14);
      if (z) { fireGunAt(z, 'enemy'); return; }
      sndDenied(); flashMsg('NO TARGET', theme.textDim); return;
    }
    for (let i = panelHitAreas.length - 1; i >= 0; i--) {
      const a = panelHitAreas[i];
      if (x >= a.x && x <= a.x + a.w && y >= a.y && y <= a.y + a.h) {
        if (a.action === 'addMod') { addModifier(a.turret, a.type); return; }
        if (a.action === 'sell')   { sellTurret(a.turret); return; }
        if (a.action === 'upgrade'){ upgradeTurret(a.turret); return; }
        if (a.action === 'close')  { clearSelection(); sndClose(); return; }
      }
    }
    if (activeTurret && pointInRect(x, y, panelRect)) return;
    const t = turretAt(x, y);
    if (t) {
      if (activeTurret === t) upgradeTurret(t);
      else { activeTurret = t; sndSelect(); }
      return;
    }
    if (activeTurret) { clearSelection(); sndClose(); return; }
    if (canPlace(x, y)) {
      money -= TURRET_COST;
      const st = tStats(1);
      const nt = {
        x, y, level: 1, cd: 0, angle: -Math.PI/2,
        hp: st.hp, maxHp: st.hp, pulse: 1,
        mods: newMods(), invested: TURRET_COST, healPulse: 0,
        fireFlash: 0, spawnPulse: 1
      };
      nt.eff = computeEff(nt);
      turrets.push(nt);
      burst(x, y, 10, theme.player, 80, 1.8);
      sndPlace(); sndBuild();
      fx.push({ type: 'build', x, y, r: st.r, life: 0.5, maxLife: 0.5 });
    } else if (money >= TURRET_COST) { sndDenied(); }
  }

  function handleSettingsClick(x, y) {
    for (const a of settingsHitAreas) {
      if (x >= a.x && x <= a.x + a.w && y >= a.y && y <= a.y + a.h) {
        if (a.action === 'close')  { settingsOpen = false; sndClose(); return; }
        if (a.action === 'theme')  { setTheme(a.idx); sndSelect(); return; }
        if (a.action === 'toggle') {
          settings[a.key] = !settings[a.key];
          sndSelect();
          if (a.key === 'masterVolume') applyMasterVolume();
          return;
        }
        if (a.action === 'slider') { draggingSlider = a.key; updateSliderFromX(a.key, x); return; }
        if (a.action === 'resetDefaults') {
          settings.masterVolume = 0.80;
          settings.sfxVolume = 1.00;
          settings.screenShake = true;
          settings.showHints = true;
          settings.showFps = false;
          settings.showGrid = true;
          settings.autoPause = true;
          applyMasterVolume();
          sndUpgrade();
          return;
        }
        if (a.action === 'help') { showingHelp = true; sndSelect(); return; }
      }
    }
    if (!pointInRect(x, y, settingsModalRect)) { settingsOpen = false; sndClose(); }
  }
  function updateSliderFromX(key, x) {
    const r = sliderRects[key];
    if (!r) return;
    const t = Math.max(0, Math.min(1, (x - r.trackX) / r.trackW));
    settings[key] = t;
    if (key === 'masterVolume') applyMasterVolume();
  }

  /* ================================================================ */
  /*  INPUT                                                            */
  /* ================================================================ */
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    keys[k] = true;
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
    if (k === 'f') { e.preventDefault(); initAudio(); toggleFullscreen(); return; }
    initAudio();

    if (k === 'escape') {
      if (showingHelp) { showingHelp = false; sndClose(); return; }
      if (settingsOpen) { settingsOpen = false; sndClose(); return; }
      if (state === 'instructions') { state = 'menu'; return; }
      if (paused) { paused = false; sndPause(); return; }
      if (activeTurret) { clearSelection(); sndClose(); return; }
      if (player && player.gunEquipped) { toggleGun(); return; }
      return;
    }
    if (k === 'o') { if (state === 'play' || state === 'menu') { settingsOpen = !settingsOpen; sndSelect(); return; } }
    if (showingHelp || settingsOpen) return;
    if (state === 'instructions') {
      if (k === 'enter' || k === ' ') { hasSeenInstructions = true; startGame(); }
      return;
    }
    if (state === 'play' && (k === 'p' || k === ' ')) { paused = !paused; sndPause(); return; }
    if (k === 'shift') { if (state === 'play' && !paused) startDash(); return; }
    if (state === 'menu' && k.length === 1 && k >= '1' && k <= '4') { setDifficulty(['easy', 'normal', 'hard', 'expert'][+k - 1]); return; }
    if (['control', 'alt', 'meta', 'tab', 'capslock'].includes(k)) return;
    if (k === 'g') { if (state === 'play' && !paused) toggleGun(); return; }
    if (state === 'menu') { if (!hasSeenInstructions) state = 'instructions'; else startGame(); }
    else if (state === 'dead' && performance.now() - deadAt > 600) startGame();
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (settings.autoPause && state === 'play' && !settingsOpen) paused = true; });

  cvs.addEventListener('mousemove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    if (draggingSlider) updateSliderFromX(draggingSlider, e.clientX);
  });
  cvs.addEventListener('mouseleave', () => { mouse.x = mouse.y = -999; });
  window.addEventListener('mouseup', () => { draggingSlider = null; });

  cvs.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (showingHelp) { showingHelp = false; sndClose(); return; }
    if (settingsOpen) { settingsOpen = false; sndClose(); return; }
    if (state !== 'play') return;
    if (activeTurret) { clearSelection(); sndClose(); }
    else if (player && player.gunEquipped) { toggleGun(); }
  });

  cvs.addEventListener('mousedown', e => {
    e.preventDefault(); initAudio();
    mouse.x = e.clientX; mouse.y = e.clientY;
    if (e.button === 0) handleClick(e.clientX, e.clientY);
  });
  cvs.addEventListener('touchstart', e => {
    e.preventDefault(); initAudio();
    const t = e.changedTouches[0];
    mouse.x = t.clientX; mouse.y = t.clientY;
    handleClick(t.clientX, t.clientY);
  }, { passive: false });

  /* ================================================================ */
  /*  UPDATE                                                           */
  /* ================================================================ */
  function startDash() {
    if (state !== 'play' || paused || player.dashCd > 0 || player.dashT > 0) return;
    let dx = 0, dy = 0;
    if (keys['w'] || keys['arrowup']) dy--;
    if (keys['s'] || keys['arrowdown']) dy++;
    if (keys['a'] || keys['arrowleft']) dx--;
    if (keys['d'] || keys['arrowright']) dx++;
    if (!dx && !dy) {
      const sp = Math.hypot(player.vx, player.vy);
      if (sp > 20) { dx = player.vx / sp; dy = player.vy / sp; } else dy = -1;
    }
    const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    player.vx = dx * DASH_SPEED; player.vy = dy * DASH_SPEED;
    player.dashT = DASH_TIME; player.dashCd = DASH_CD;
    let n = 0;
    for (const z of zombies) {
      if (z.bonus || z.fixed || z.type === 'medic') continue;
      if (Math.hypot(z.x - player.x, z.y - player.y) < TAUNT_R) { z.tauntT = gameTime + 3.5; n++; }
    }
    fx.push({ type: 'taunt', x: player.x, y: player.y, r: 16, life: 0.5, maxLife: 0.5 });
    if (n) addFloatText(player.x, player.y - 22, 'TAUNT \u00d7' + n, '#c76bff', 11);
    burst(player.x, player.y, 8, '#c76bff', 120, 2);
    sndDash();
  }

  function dropTurret(x, y) {
    x = Math.max(24, Math.min(W - 24, x)); y = Math.max(24, Math.min(H - 24, y));
    const def = ENEMY_TYPES.hturret;
    const hp = (def.hpBase + wave * def.hpLinear + wave * wave * def.hpQuad) * D().hp;
    const life = 14 + Math.min(6, wave * 0.4);
    zombies.push({
      x, y, r: def.rBase, hp, maxHp: hp, speed: 0, hit: 0, hue: 0, wob: 0,
      slowT: 0, slowF: 1, freezeT: 0, stunT: 0, burnT: 0, burnD: 0, burnSpread: 0,
      poisonT: 0, poisonD: 0, poisonStacks: 0, markT: 0, kx: 0, ky: 0, frost: 0, gunKilled: false,
      spawnT: 0.6, type: 'hturret', def, bonus: false, bonusDir: 1,
      fixed: true, life, lifeMax: life, cd: 1.4, aim: 0
    });
    fx.push({ type: 'ring', x, y, r: 8, life: 0.5, maxLife: 0.5, color: '#ff3b5c' });
    addFloatText(x, y - 20, 'HOSTILE TURRET', '#ff3b5c', 11);
    sndDeploy();
  }

  const isDisabled = z => z.freezeT > gameTime || z.stunT > gameTime;
  const slowOf = z => (z.slowT > gameTime ? z.slowF : 1);

  function aiHTurret(z, dt, env) {
    z.life -= dt;
    z.kx = z.ky = 0;
    if (z.life <= 0) {
      burst(z.x, z.y, 14, '#ff3b5c', 140, 2.4);
      fx.push({ type: 'explode', x: z.x, y: z.y, r: z.r + 4, life: 0.4, maxLife: 0.4 });
      sndHit();
      return 'remove';
    }
    if (isDisabled(z) || z.spawnT > 0) return true;
    z.cd -= dt;
    let tgt = null, tx = 0, ty = 0, bd = 250 * 250;
    for (const t of turrets) {
      const d2 = (t.x - z.x) ** 2 + (t.y - z.y) ** 2;
      if (d2 < bd) { bd = d2; tgt = t; tx = t.x; ty = t.y; }
    }
    const pd2 = (player.x - z.x) ** 2 + (player.y - z.y) ** 2;
    if (pd2 < bd) { tgt = 'player'; tx = player.x; ty = player.y; }
    if (!tgt) return true;
    const want = Math.atan2(ty - z.y, tx - z.x);
    let df = want - z.aim;
    while (df > Math.PI) df -= Math.PI * 2;
    while (df < -Math.PI) df += Math.PI * 2;
    z.aim += df * Math.min(1, dt * 10);
    if (z.cd <= 0) {
      z.cd = 1.1;
      const dmg = (7 + wave * 1.1) * D().dmg;
      ebullets.push({ kind: 'bolt', x: z.x + Math.cos(z.aim) * z.r, y: z.y + Math.sin(z.aim) * z.r, vx: Math.cos(z.aim) * 300, vy: Math.sin(z.aim) * 300, r: 3, life: 1.2, dmg });
      sndEnemyShot();
    }
    return true;
  }

  function aiPyro(z, dt, env) {
    if (isDisabled(z)) return true;
    const dx = player.x - z.x, dy = player.y - z.y, pd = Math.hypot(dx, dy) || 1;
    z.face = Math.atan2(dy, dx);
    if (z.pcd === undefined) { z.pcd = 1.4 + Math.random(); z.sdir = Math.random() < 0.5 ? 1 : -1; }
    let sp = z.speed * slowOf(z), mx, my;
    if (pd > 190) { mx = dx / pd; my = dy / pd; }
    else if (pd < 110) { mx = -dx / pd; my = -dy / pd; sp *= 0.8; }
    else { mx = (-dy / pd) * z.sdir; my = (dx / pd) * z.sdir; sp *= 0.5; if (Math.random() < dt * 0.4) z.sdir *= -1; }
    z.x += mx * sp * dt; z.y += my * sp * dt;
    if (z.x > 0 && z.x < W && z.y > 0 && z.y < H) { z.x = Math.max(8, Math.min(W - 8, z.x)); z.y = Math.max(8, Math.min(H - 8, z.y)); }
    if (Math.random() < dt * 10) particles.push({ x: z.x + (Math.random() - 0.5) * z.r, y: z.y - z.r, vx: (Math.random() - 0.5) * 20, vy: -40 - Math.random() * 30, life: 0.4, maxLife: 0.4, s: 1.6 + Math.random() * 1.4, color: Math.random() < 0.5 ? '#ff8833' : '#ffcc33' });
    z.pcd -= dt;
    if (z.pcd <= 0 && pd < 330 && z.spawnT <= 0 && z.x > 0 && z.x < W && z.y > 0 && z.y < H) {
      z.pcd = 2.3 + Math.random() * 0.8;
      const a = Math.atan2(player.y + player.vy * 0.22 - z.y, player.x + player.vx * 0.22 - z.x);
      ebullets.push({ kind: 'fire', x: z.x, y: z.y, vx: Math.cos(a) * 240, vy: Math.sin(a) * 240, r: 5, life: 1.8, dmg: (4 + wave * 0.5) * D().dmg, burn: (3.5 + wave * 0.4) * D().dmg });
      sndFireball();
    }
    return true;
  }

  function aiMedic(z, dt, env) {
    if (isDisabled(z)) return true;
    z.rt = (z.rt || 0) - dt;
    if (z.rt <= 0 || !z.mt || z.mt.hp <= 0 || zombies.indexOf(z.mt) === -1) {
      z.rt = 0.45; z.mt = null;
      let bs = -1e9;
      for (const o of zombies) {
        if (o === z || o.bonus || o.fixed || o.type === 'medic' || o.hp <= 0 || o.spawnT > 0.3) continue;
        const d = Math.hypot(o.x - z.x, o.y - z.y);
        if (d > 460) continue;
        const damaged = o.hp < o.maxHp * 0.995;
        const sc = (damaged ? 1 : 0.12) * o.maxHp - d * 0.02;
        if (sc > bs) { bs = sc; z.mt = o; }
      }
    }
    const o = z.mt;
    if (z.healFx > 0) z.healFx = Math.max(0, z.healFx - dt * 2.5);
    if (z.pulseT > 0) z.pulseT -= dt;
    if (!o) return false;
    const dx = o.x - z.x, dy = o.y - z.y, d = Math.hypot(dx, dy) || 1;
    z.face = Math.atan2(dy, dx);
    const sp = z.speed * slowOf(z) * 1.15;
    if (d > 80) { z.x += (dx / d) * sp * dt; z.y += (dy / d) * sp * dt; }
    z.hcd = (z.hcd === undefined ? 0.5 : z.hcd) - dt;
    if (d < 130 && o.hp < o.maxHp * 0.995 && z.hcd <= 0) {
      z.hcd = 0.8;
      const before = o.hp;
      o.hp = Math.min(o.maxHp, o.hp + o.maxHp * 0.08 + 3 + wave * 0.8);
      z.healFx = 1;
      z.pulseT = 0.35;
      risingParticles(o.x, o.y, 4, '#3ddc84', o.r, 40);
      addFloatText(o.x, o.y - o.r - 6, '+' + Math.round(o.hp - before), '#3ddc84', 10);
      sndHeal();
    }
    return true;
  }

  function aiLunger(z, dt, env) {
    if (isDisabled(z)) return true;
    if (z.lst === undefined) { z.lst = 'walk'; z.lcd = 1.5 + Math.random() * 1.5; z.lt = 0; z.dirA = 0; }
    const dx = player.x - z.x, dy = player.y - z.y, pd = Math.hypot(dx, dy) || 1;
    if (z.lst === 'walk') {
      if (pd > 440 && !(z.tauntT > gameTime)) return false;
      z.face = Math.atan2(dy, dx);
      z.lcd -= dt;
      if (z.lcd <= 0 && pd < 270 && pd > 60 && z.spawnT <= 0) { z.lst = 'wind'; z.lt = 0.65; z.dirA = z.face; sndLungeWind(); return true; }
      if (pd > z.r + player.r) { const sp = z.speed * slowOf(z); z.x += (dx / pd) * sp * dt; z.y += (dy / pd) * sp * dt; }
      else if (player.dashT <= 0) { player.hp -= env.zDpsPlayer * dt; player.hurt = 1; shake = Math.min(7, shake + dt * 40); sndHurt(); }
      return true;
    }
    if (z.lst === 'wind') {
      z.lt -= dt;
      if (z.lt > 0.2) z.dirA = Math.atan2(dy, dx);
      z.face = z.dirA;
      if (z.lt <= 0) { z.lst = 'dash'; z.lt = 0.4; z.hitDone = false; sndLungeGo(); }
      return true;
    }
    if (z.lst === 'dash') {
      z.lt -= dt;
      z.x += Math.cos(z.dirA) * 560 * dt; z.y += Math.sin(z.dirA) * 560 * dt;
      z.face = z.dirA;
      if (Math.random() < dt * 60) particles.push({ x: z.x, y: z.y, vx: 0, vy: 0, life: 0.25, maxLife: 0.25, s: z.r * 0.8, color: SPECIAL_COLORS.lunger });
      let stop = false;
      if (!z.hitDone && player.dashT <= 0 && Math.hypot(player.x - z.x, player.y - z.y) < z.r + player.r + 2) {
        z.hitDone = true; stop = true;
        const dmg = env.zDpsPlayer * 1.7;
        player.hp -= dmg; player.hurt = 1; shake = Math.max(shake, 9);
        player.vx += Math.cos(z.dirA) * 300; player.vy += Math.sin(z.dirA) * 300;
        addFloatText(player.x, player.y - 18, '-' + Math.round(dmg), '#ff5a4a', 15);
        fx.push({ type: 'lungeHit', x: player.x, y: player.y, r: 8, life: 0.35, maxLife: 0.35 });
        burst(player.x, player.y, 12, '#ff5a4a', 160, 2.4);
        sndLungeHit(); sndHurt();
      }
      if (!stop) {
        for (const t of turrets) {
          if (Math.hypot(t.x - z.x, t.y - z.y) < z.r + tStats(t.level).r) {
            damageTurret(t, env.zDpsTurret * 1.4, z, 0.4);
            fx.push({ type: 'lungeHit', x: t.x, y: t.y, r: 8, life: 0.35, maxLife: 0.35 });
            sndLungeHit(); shake = Math.max(shake, 4); stop = true; break;
          }
        }
      }
      if (z.x < -20 || z.x > W + 20 || z.y < -20 || z.y > H + 20) z.lt = 0;
      if (z.lt <= 0 || stop) { z.lst = 'recover'; z.lt = 0.9; }
      return true;
    }
    z.lt -= dt;
    if (z.lt <= 0) { z.lst = 'walk'; z.lcd = 2.4 + Math.random() * 1.2; }
    return true;
  }
  const SPECIAL_AI = { hturret: aiHTurret, lunger: aiLunger, pyro: aiPyro, medic: aiMedic };

  function damageTurret(t, amt, z, dt) {
    const e = t.eff;
    if (e && e.shieldMax > 0) {
      t.shieldDelay = e.shieldDelay;
      if (t.shield > 0) {
        const ab = Math.min(t.shield, amt);
        t.shield -= ab; amt -= ab; t.shieldFlash = 1;
        sndShieldHit();
        if (t.shield <= 0) {
          t.shield = 0;
          fx.push({ type: 'shieldBreak', x: t.x, y: t.y, r: tStats(t.level).r, life: 0.5, maxLife: 0.5 });
          burst(t.x, t.y, 14, '#5ac8ff', 150, 2.2); sndShieldBreak();
          addFloatText(t.x, t.y - 34, 'SHIELD DOWN', '#5ac8ff', 11);
        }
      }
    }
    if (amt > 0) { t.hp -= amt; t.hitFlash = 1; }
  }

  function defend(t, eff, dt) {
    const st = tStats(t.level);
    if (t.burnT > 0) {
      t.burnT -= dt;
      damageTurret(t, t.burnDps * dt, null, 0);
      if (Math.random() < dt * 18) particles.push({ x: t.x + (Math.random() - 0.5) * st.r * 1.6, y: t.y - st.r * 0.4, vx: (Math.random() - 0.5) * 24, vy: -46 - Math.random() * 34, life: 0.45, maxLife: 0.45, s: 2 + Math.random() * 1.6, color: Math.random() < 0.5 ? '#ff8833' : '#ffcc33' });
      sndBurnTick();
    }
    if (eff.shieldMax > 0) {
      if (t.shield === undefined) t.shield = eff.shieldMax;
      if (t.shield > eff.shieldMax) t.shield = eff.shieldMax;
      if (t.shieldFlash > 0) t.shieldFlash = Math.max(0, t.shieldFlash - dt * 4);
      if (t.shieldDelay > 0) t.shieldDelay -= dt;
      else if (t.shield < eff.shieldMax) {
        const was = t.shield;
        t.shield = Math.min(eff.shieldMax, t.shield + eff.shieldMax * eff.shieldRate * dt);
        if (was < eff.shieldMax && t.shield >= eff.shieldMax) { sndShieldUp(); fx.push({ type: 'ring', x: t.x, y: t.y, r: st.r + 10, life: 0.4, maxLife: 0.4, color: '#5ac8ff' }); }
      }
    } else t.shield = 0;

    if (eff.fieldRadius > 0) {
      t.fieldTick = (t.fieldTick || 0) - dt;
      const tick = t.fieldTick <= 0;
      if (tick) t.fieldTick = 0.25;
      let zaps = 0;
      for (const z of zombies) {
        if (z.hp <= 0 || z.x < -4 || z.x > W + 4 || z.y < -4 || z.y > H + 4) continue;
        const d = Math.hypot(z.x - t.x, z.y - t.y);
        if (d > eff.fieldRadius + z.r) continue;
        if (eff.fieldSlow < 1 && !z.bonus) {
          if (z.slowT < gameTime || z.slowF > eff.fieldSlow) z.slowF = eff.fieldSlow;
          z.slowT = Math.max(z.slowT, gameTime + 0.35);
        }
        if (tick) {
          z.hp -= eff.fieldDps * 0.25; z.hit = Math.max(z.hit, 0.35);
          if (zaps < 3 && Math.random() < 0.6) {
            zaps++;
            fx.push({ type: 'zap', x1: t.x, y1: t.y, x2: z.x, y2: z.y, life: 0.13, maxLife: 0.13 });
            burst(z.x, z.y, 2, '#8af0ff', 70, 1.5);
          }
        }
      }
      if (tick && zaps > 0) sndField();
    }

    if (eff.regenPassive > 0 && t.hp < t.maxHp) {
      let calm = true;
      for (const z of zombies) { if (!z.bonus && Math.hypot(z.x - t.x, z.y - t.y) < 150) { calm = false; break; } }
      if (calm) {
        t.hp = Math.min(t.maxHp, t.hp + t.maxHp * eff.regenPassive * dt);
        if (Math.random() < dt * 5) particles.push({ x: t.x + (Math.random() - 0.5) * st.r * 2, y: t.y, vx: 0, vy: -26, life: 0.7, maxLife: 0.7, s: 2.2, color: '#2fd47a' });
      }
    }

  }

  function update(dt) {
    fpsFrames++;
    const nowN = performance.now();
    if (nowN - fpsLastTime >= 500) { fps = Math.round(fpsFrames * 1000 / (nowN - fpsLastTime)); fpsFrames = 0; fpsLastTime = nowN; }

    if (state !== 'play' || paused || settingsOpen || showingHelp) return;
    gameTime += dt;

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.gravity) p.vy += p.gravity * dt;
      p.vx *= 0.93; p.vy *= 0.93;
      if (p.shard) { p.rot += p.rotV * dt; p.rotV *= 0.94; }
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = beams.length - 1; i >= 0; i--) { beams[i].life -= dt; if (beams[i].life <= 0) beams.splice(i, 1); }
    for (let i = fx.length - 1; i >= 0; i--) { fx[i].life -= dt; if (fx[i].life <= 0) fx.splice(i, 1); }
    for (let i = floatTexts.length - 1; i >= 0; i--) {
      const ft = floatTexts[i];
      ft.y += ft.vy * dt;
      ft.vy *= 0.94;
      ft.life -= dt;
      if (ft.life <= 0) floatTexts.splice(i, 1);
    }

    for (let i = specials.length - 1; i >= 0; i--) {
      const s = specials[i];
      let targetValid = true;
      if (s.targetType === 'enemy') {
        const z = s.target;
        if (!z || z.hp <= 0 || zombies.indexOf(z) === -1) targetValid = false;
        else { s.tx = z.x; s.ty = z.y; }
      } else {
        const t = s.target;
        if (!t || turrets.indexOf(t) === -1) targetValid = false;
        else { s.tx = t.x; s.ty = t.y; }
      }
      if (!targetValid) {
        burst(s.x, s.y, 5, s.targetType === 'enemy' ? '#c76bff' : '#5aa5d9', 80, 1.5);
        specials.splice(i, 1); continue;
      }
      s.progress += dt / s.duration;
      const p = Math.min(1, s.progress);
      const axisX = s.tx - s.sx, axisY = s.ty - s.sy;
      const axisLen = Math.hypot(axisX, axisY) || 1;
      const nx = axisX / axisLen, ny = axisY / axisLen;
      const px = -ny, py = nx;
      s.swirlPhase += dt * 34;
      const swirlAmp = Math.min(16, axisLen * 0.22);
      const offset = Math.sin(s.progress * Math.PI * 7) * swirlAmp;
      s.x = s.sx + axisX * p + px * offset;
      s.y = s.sy + axisY * p + py * offset;
      s.trail.push({ x: s.x, y: s.y, life: 0.32 });
      for (let j = s.trail.length - 1; j >= 0; j--) {
        s.trail[j].life -= dt;
        if (s.trail[j].life <= 0) s.trail.splice(j, 1);
      }
      s.sparkTimer -= dt;
      if (s.sparkTimer <= 0) {
        s.sparkTimer = 0.02;
        particles.push({
          x: s.x + (Math.random() - 0.5) * 6,
          y: s.y + (Math.random() - 0.5) * 6,
          vx: (Math.random() - 0.5) * 40,
          vy: (Math.random() - 0.5) * 40,
          life: 0.35, maxLife: 0.35,
          s: 1.2 + Math.random() * 1.6,
          color: Math.random() < 0.5 ? '#c76bff' : '#ffffff'
        });
      }
      if (p >= 1) { applyGunEffect(s); specials.splice(i, 1); }
    }

    shake = Math.max(0, shake - dt * 40);
    if (addModFlash) { addModFlash.t += dt; if (addModFlash.t > 1.6) addModFlash = null; }
    if (hintTimer > 0) hintTimer -= dt;
    if (banner) { banner.t += dt; if (banner.t > (banner.dur || 2.0)) banner = null; }
    if (streakT > 0) { streakT -= dt; if (streakT <= 0) streak = 0; }
    hbT -= dt;
    if (player.hp < player.maxHp * 0.3 && hbT <= 0) { hbT = 0.5 + 0.7 * (player.hp / (player.maxHp * 0.3)); sndHeartbeat(); }
    for (const m of motes) {
      m.x += (m.vx + Math.sin(gameTime * 0.6 + m.ph) * 6) * dt; m.y += m.vy * dt;
      if (m.y < -6) { m.y = H + 6; m.x = Math.random() * W; }
      if (m.x < -6) m.x = W + 6; else if (m.x > W + 6) m.x = -6;
    }
    if (player.gunFlash > 0) player.gunFlash = Math.max(0, player.gunFlash - dt * 3);
    if (activeTurret && turrets.indexOf(activeTurret) === -1) clearSelection();

    let dx = 0, dy = 0;
    if (keys['w'] || keys['arrowup'])    dy--;
    if (keys['s'] || keys['arrowdown'])  dy++;
    if (keys['a'] || keys['arrowleft'])  dx--;
    if (keys['d'] || keys['arrowright']) dx++;

    let targetVX = 0, targetVY = 0;
    const isMoving = dx !== 0 || dy !== 0;
    if (isMoving) {
      const l = Math.hypot(dx, dy);
      targetVX = (dx / l) * PLAYER_SPEED;
      targetVY = (dy / l) * PLAYER_SPEED;
    }
    if (player.dashT > 0) {
      player.dashT -= dt;
      if (player.dashT <= 0) { player.vx *= 0.35; player.vy *= 0.35; }
    } else {
      const rate = isMoving ? PLAYER_ACCEL : PLAYER_DECEL;
      const k = Math.min(1, rate * dt);
      player.vx += (targetVX - player.vx) * k;
      player.vy += (targetVY - player.vy) * k;
    }
    if (player.dashCd > 0) player.dashCd -= dt;

    player.x += player.vx * dt;
    player.y += player.vy * dt;
    player.x = Math.max(player.r + 4, Math.min(W - player.r - 4, player.x));
    player.y = Math.max(player.r + 4, Math.min(H - player.r - 4, player.y));
    if (player.hurt > 0) player.hurt = Math.max(0, player.hurt - dt * 4);
    player.healBank = Math.min(6, (player.healBank || 0) + 3 * dt);
    {
      const mv = Math.min(1, Math.hypot(player.vx, player.vy) / PLAYER_SPEED);
      const ta = player.dashT > 0 ? AGGRO_MAX : AGGRO_MIN + (AGGRO_MAX - AGGRO_MIN) * mv;
      player.aggro += (ta - player.aggro) * Math.min(1, dt * 6);
    }
    if (player.burnT > 0) {
      player.burnT -= dt;
      player.hp -= player.burnDps * dt; player.hurt = Math.max(player.hurt, 0.5);
      if (Math.random() < dt * 20) particles.push({ x: player.x + (Math.random() - 0.5) * 8, y: player.y - 4, vx: (Math.random() - 0.5) * 30, vy: -50 - Math.random() * 40, life: 0.45, maxLife: 0.45, s: 2 + Math.random() * 1.6, color: Math.random() < 0.5 ? '#ff8833' : '#ffcc33' });
      sndBurnTick();
    }

    const speed = Math.hypot(player.vx, player.vy);
    if (speed > 40) {
      player.trail.push({ x: player.x, y: player.y, life: 0.28, maxLife: 0.28, speed });
      player.dustTimer -= dt;
      if (player.dustTimer <= 0 && speed > 120) {
        player.dustTimer = 0.045;
        const a = Math.atan2(-player.vy, -player.vx);
        particles.push({
          x: player.x + Math.cos(a) * player.r, y: player.y + Math.sin(a) * player.r,
          vx: Math.cos(a) * (15 + Math.random() * 20) + (Math.random() - 0.5) * 20,
          vy: Math.sin(a) * (15 + Math.random() * 20) + (Math.random() - 0.5) * 20,
          life: 0.35, maxLife: 0.35, s: 1.6 + Math.random() * 1.4, color: theme.textDim
        });
      }
    }
    for (let i = player.trail.length - 1; i >= 0; i--) {
      player.trail[i].life -= dt;
      if (player.trail[i].life <= 0) player.trail.splice(i, 1);
    }
    if (player.trail.length > 24) player.trail.splice(0, player.trail.length - 24);

    if (betweenWaves) {
      if (autoWave) { waveTimer -= dt; if (waveTimer <= 0) startWave(); }
    } else {
      if (ufoScheduled && !ufoSpawned) {
        ufoTimer -= dt;
        if (ufoTimer <= 0) {
          spawnZombie('ufo');
          ufoSpawned = true;
          sndUFO();
        }
      }
      if (spawnQueue.length > 0) {
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          const type = spawnQueue.shift();
          spawnZombie(type);
          const baseInterval = Math.max(0.08, 0.85 - wave * 0.045) * D().interval;
          const mult = type === 'brute' ? 1.35 : (type === 'sprinter' ? 0.75 : 1);
          spawnTimer = baseInterval * mult;
        }
      } else if (zombies.length === 0) {
        betweenWaves = true; waveTimer = 4;
        const clearBonus = Math.round((15 + wave * 4) * D().reward); money += clearBonus;
        banner = { text: 'WAVE ' + wave + ' CLEAR', sub: '+$' + clearBonus + '  \u00b7  TURRETS REPAIRED', t: 0, color: '#5fda7a' };
        sndWaveClear();
        addFloatText(player.x, player.y - 26, 'WAVE CLEAR +$' + clearBonus, '#5fda7a', 13);
        let anyRegen = false;
        for (const t of turrets) {
          const rg = 0.08 + (t.eff ? t.eff.regenWave : 0);
          t.hp = Math.min(t.maxHp, t.hp + t.maxHp * rg); t.healPulse = 0.6;
          if (t.eff && t.eff.regenWave > 0) { anyRegen = true; risingParticles(t.x, t.y, 8, '#2fd47a', 12, 70); addFloatText(t.x, t.y - 30, '+' + Math.round(t.maxHp * rg) + ' HP', '#2fd47a', 11); }
        }
        if (anyRegen) sndRegen();
        nextWavePreview = composeWave(wave + 1);
      }
    }

    for (const t of turrets) t.eff = computeEff(t);
    for (const t of turrets) { t.nitro = 0; t.nitroSpd = 0; t.nitroSrc = null; }
    for (const src of turrets) {
      const ne = src.eff;
      if (!(ne.nitroBoost > 0)) continue;
      for (const t of turrets) {
        if (t === src) continue;
        if (Math.hypot(t.x - src.x, t.y - src.y) < ne.nitroRadius && ne.nitroBoost > t.nitro) { t.nitro = ne.nitroBoost; t.nitroSpd = ne.nitroBullet; t.nitroSrc = src; }
      }
    }
    for (const t of turrets) {
      t.cd -= dt * (1 + (t.nitro || 0));
      if (t.pulse > 0) t.pulse = Math.max(0, t.pulse - dt * 1.8);
      if (t.healPulse > 0) t.healPulse = Math.max(0, t.healPulse - dt * 2);
      if (t.fireFlash > 0) t.fireFlash = Math.max(0, t.fireFlash - dt * 6);
      if (t.hpShown === undefined || t.hpShown < t.hp) t.hpShown = t.hp;
      else t.hpShown = Math.max(t.hp, t.hpShown - t.maxHp * 0.5 * dt);
      if (t.hitFlash > 0) t.hitFlash = Math.max(0, t.hitFlash - dt * 4);
      if (t.recoil > 0) t.recoil = Math.max(0, t.recoil - dt * 9);
      if (t.spawnPulse > 0) t.spawnPulse = Math.max(0, t.spawnPulse - dt * 3);
      ambient(t, dt);
      const eff = t.eff;
      defend(t, eff, dt);
      const rangeSq = eff.range === Infinity ? Infinity : eff.range * eff.range;
      let bestSc = Infinity, tz = null;
      for (const z of zombies) {
        if (z.x < -4 || z.x > W + 4 || z.y < -4 || z.y > H + 4) continue;
        const ddx = z.x - t.x, ddy = z.y - t.y;
        const d2 = ddx*ddx + ddy*ddy;
        if (d2 >= rangeSq) continue;
        const sc = z.type === 'medic' ? d2 * 0.4 : d2;
        if (sc < bestSc) { bestSc = sc; tz = z; }
      }
      t.tgt = tz;
      if (!tz) continue;
      const ang = Math.atan2(tz.y - t.y, tz.x - t.x);
      let diff = ang - t.angle;
      while (diff >  Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      t.angle += diff * Math.min(1, dt * 16);
      if (t.cd <= 0) {
        t.cd = eff.interval;
        if (eff.fireMode === 'laser') fireLaser(t, tz);
        else fireBullets(t, tz);
      }
    }

    let playerTakingDamage = false;
    const zDpsPlayer = Z_DPS_PLAYER_BASE * (1 + wave * Z_DPS_PLAYER_SCALE) * D().dmg;
    const zDpsTurret = Z_DPS_TURRET_BASE * (1 + wave * Z_DPS_TURRET_SCALE) * D().dmg;

    let lastStandMult = 1;
    if (!betweenWaves) {
      if (zombies.length === 1) lastStandMult = 1.6;
      else if (zombies.length === 2) lastStandMult = 1.3;
    }

    const env = { zDpsPlayer, zDpsTurret, lastStandMult };
    for (let zi = zombies.length - 1; zi >= 0; zi--) {
      const z = zombies[zi];
      if (z.hit > 0) z.hit = Math.max(0, z.hit - dt * 5);
      if (z.frost > 0) z.frost = Math.max(0, z.frost - dt * 1.2);
      if (z.spawnT > 0) z.spawnT = Math.max(0, z.spawnT - dt * 2);

      if (z.burnT > gameTime) {
        z.hp -= z.burnD * dt;
        if (Math.random() < dt * 12) {
          particles.push({
            x: z.x + (Math.random() - 0.5) * 8,
            y: z.y - z.r,
            vx: (Math.random() - 0.5) * 30,
            vy: -40 - Math.random() * 40,
            life: 0.4 + Math.random() * 0.3, maxLife: 0.7,
            s: 1.4 + Math.random() * 1.4,
            color: Math.random() < 0.5 ? '#ff8833' : '#ffcc33'
          });
        }
      }
      if (z.poisonT > gameTime) {
        const stacks = Math.max(1, z.poisonStacks);
        z.hp -= z.poisonD * stacks * dt;
        if (Math.random() < dt * 8) {
          particles.push({
            x: z.x + (Math.random() - 0.5) * 8,
            y: z.y + (Math.random() - 0.5) * 4,
            vx: (Math.random() - 0.5) * 25,
            vy: 20 + Math.random() * 30,
            life: 0.5 + Math.random() * 0.3, maxLife: 0.8,
            s: 1.4 + Math.random() * 1.4,
            color: '#5fad3c'
          });
        }
      }
      if (z.fixed) { z.kx = 0; z.ky = 0; }
      else if (z.kx || z.ky) {
        const km = Math.hypot(z.kx, z.ky); if (km > 90) { z.kx *= 90 / km; z.ky *= 90 / km; }
        z.x += z.kx * dt * 8; z.y += z.ky * dt * 8;
        const decay = Math.exp(-dt * 9);
        z.kx *= decay; z.ky *= decay;
        if (Math.abs(z.kx) < 0.1 && Math.abs(z.ky) < 0.1) { z.kx = 0; z.ky = 0; }
      }

      if (z.bonus) {
        z.x += z.speed * z.bonusDir * dt;
        if ((z.bonusDir === 1 && z.x > W + 60) || (z.bonusDir === -1 && z.x < -60)) {
          zombies.splice(zi, 1);
        }
        continue;
      }

      const ai = SPECIAL_AI[z.type];
      if (ai) {
        const res = ai(z, dt, env);
        if (res === 'remove') { zombies.splice(zi, 1); continue; }
        if (res) continue;
      }

      const lured = Math.hypot(player.x - z.x, player.y - z.y) < player.aggro || z.tauntT > gameTime;
      let target = null;
      if (!lured && turrets.length) {
        let bestScore = Infinity;
        for (const t of turrets) {
          const s = Math.hypot(t.x - z.x, t.y - z.y);
          if (s < bestScore) { bestScore = s; target = t; }
        }
      }
      z.lured = lured && turrets.length > 0;
      if (lured) z.chew = 0;
      const tx = target ? target.x : player.x;
      const ty = target ? target.y : player.y;
      const ddx = tx - z.x, ddy = ty - z.y;
      const d = Math.hypot(ddx, ddy) || 1;
      z.face = Math.atan2(ddy, ddx);
      const reach = z.r + (target ? tStats(target.level).r : player.r);
      let speedMult = 1;
      if (z.freezeT > gameTime || z.stunT > gameTime) speedMult = 0;
      else if (z.slowT > gameTime) speedMult = z.slowF;
      speedMult *= lastStandMult;
      let moveSp = z.speed * speedMult;
      if (!target) moveSp = Math.min(moveSp, PLAYER_SPEED * 0.88);
      if (d > reach) {
        z.x += (ddx / d) * moveSp * dt;
        z.y += (ddy / d) * moveSp * dt;
      } else if (target) {
        z.chew = (z.chew || 0) + dt;
        damageTurret(target, zDpsTurret * (1 + Math.min(1.5, z.chew * 0.35)) * dt, z, dt);
        if (target.hp < target.maxHp * 0.3) sndWarn(); else sndTurretHit();
        if (Math.random() < dt * 10) burst(target.x, target.y, 2, '#ff5a4a', 70, 1.6);
      } else {
        if (player.dashT <= 0) {
          player.hp -= zDpsPlayer * dt;
          player.hurt = 1;
          playerTakingDamage = true;
          shake = Math.min(7, shake + dt * 40);
        }
      }
    }
    if (playerTakingDamage) sndHurt();

    for (const z of zombies) {
      if (z.bonus) continue;
      if (z.burnT > gameTime && z.burnSpread > 0 && Math.random() < dt * 2) {
        for (const other of zombies) {
          if (other === z || other.bonus || other.burnT > gameTime) continue;
          if (Math.hypot(other.x - z.x, other.y - z.y) < z.burnSpread) {
            other.burnT = gameTime + 2;
            other.burnD = Math.max(other.burnD, z.burnD * 0.7);
            other.burnSpread = z.burnSpread * 0.8;
            burst(other.x, other.y, 3, '#ff8833', 60, 1.5);
            break;
          }
        }
      }
    }

    const n = zombies.length;
    for (let i = 0; i < n; i++) {
      const a = zombies[i];
      if (a.bonus || a.fixed) continue;
      for (let j = i + 1; j < n; j++) {
        const b = zombies[j];
        if (b.bonus || b.fixed) continue;
        const ddx = b.x - a.x, ddy = b.y - a.y;
        const rr = a.r + b.r;
        const d2 = ddx*ddx + ddy*ddy;
        if (d2 < rr*rr && d2 > 0.0001) {
          const d = Math.sqrt(d2);
          const push = ((rr - d) / d) * 0.45;
          const px = ddx * push, py = ddy * push;
          a.x -= px; a.y -= py; b.x += px; b.y += py;
        }
      }
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      const eff = b.turret ? b.turret.eff : null;
      if (b.homing && eff) {
        if (b.target && (b.target.hp <= 0 || zombies.indexOf(b.target) === -1)) b.target = null;
        if (!b.target) {
          let bestD = 320*320, nz = null;
          for (const z of zombies) {
            const d2 = (z.x - b.x)**2 + (z.y - b.y)**2;
            if (d2 < bestD) { bestD = d2; nz = z; }
          }
          b.target = nz;
        }
        if (b.target) {
          const desired = Math.atan2(b.target.y - b.y, b.target.x - b.x);
          const cur = Math.atan2(b.vy, b.vx);
          let diff = desired - cur;
          while (diff >  Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          const turn = Math.min(1, b.homingStr * dt);
          const na = cur + diff * turn;
          const sp = Math.hypot(b.vx, b.vy);
          b.vx = Math.cos(na) * sp;
          b.vy = Math.sin(na) * sp;
        }
      }
      if (b.trail) {
        b.trail.push({ x: b.x, y: b.y, life: 0.12 });
        for (let j = b.trail.length - 1; j >= 0; j--) {
          b.trail[j].life -= dt;
          if (b.trail[j].life <= 0) b.trail.splice(j, 1);
        }
        if (b.trail.length > 6) b.trail.splice(0, b.trail.length - 6);
      }
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (b.life <= 0 || b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30) { bullets.splice(i, 1); continue; }
      let consumed = false;
      for (const z of zombies) {
        if (b.hitZombies.indexOf(z) !== -1) continue;
        const ddx = z.x - b.x, ddy = z.y - b.y;
        const rr = z.r + b.r;
        if (ddx*ddx + ddy*ddy < rr*rr) {
          const sp = Math.hypot(b.vx, b.vy) || 1;
          const dirX = b.vx / sp, dirY = b.vy / sp;
          const result = applyHit(z, b.dmg, b.turret, { dirX, dirY });
          z.x += dirX * 2.2; z.y += dirY * 2.2;
          if (result.isCrit) burst(b.x, b.y, 6, '#ffd94a', 100, 2);
          if (eff) {
            if (eff.splashRadius > 0) doSplash(z, b.dmg, b.turret, eff.splashRadius, eff.splashDmgMult);
            if (eff.chainJumps > 0) doChain(z, b.dmg, b.turret, eff.chainDmgRet, eff.chainJumps, eff.chainRange);
          }
          fx.push({ type: 'impact', x: b.x, y: b.y, r: 3, life: 0.18, maxLife: 0.18, color: bulletColor(b) });
          burst(b.x, b.y, 3, bulletColor(b), 80, 1.4);
          sndHit();
          b.hitZombies.push(z);
          if (b.bounceLeft > 0) {
            let nearest = null, nearestD = 240;
            for (const o of zombies) {
              if (o === z || b.hitZombies.indexOf(o) !== -1) continue;
              const d = Math.hypot(o.x - z.x, o.y - z.y);
              if (d < nearestD) { nearestD = d; nearest = o; }
            }
            if (nearest) {
              const a = Math.atan2(nearest.y - z.y, nearest.x - z.x);
              const sp2 = Math.hypot(b.vx, b.vy);
              b.vx = Math.cos(a) * sp2; b.vy = Math.sin(a) * sp2;
              b.x = z.x; b.y = z.y;
              b.dmg *= b.bounceRet;
              b.bounceLeft--;
              b.target = nearest;
              fx.push({ type:'bounce', x1: z.x, y1: z.y, x2: nearest.x, y2: nearest.y, life: 0.2, maxLife: 0.2 });
              sndBounce();
              continue;
            }
          }
          consumed = true; break;
        }
      }
      if (consumed) bullets.splice(i, 1);
    }

    for (let i = zombies.length - 1; i >= 0; i--) {
      const z = zombies[i];
      if (z.hp <= 0) {
        kills++;
        streak++; streakT = 1.6;
        if (streak >= 5 && streak % 5 === 0) {
          addFloatText(player.x, player.y - 34, 'x' + streak + ' STREAK', '#ffd94a', 15);
          fx.push({ type: 'ring', x: player.x, y: player.y, r: 10, life: 0.5, maxLife: 0.5, color: '#ffd94a' });
          sndStreak(streak / 5);
        }
        const def = z.def || ENEMY_TYPES.grunt;
        let reward = Math.max(1, Math.floor((REWARD_BASE + wave) * def.rewardMult * D().reward));
        if (z.gunKilled) reward = Math.max(2, Math.floor(reward * 0.7));
        if (z.lured) { reward = Math.ceil(reward * 1.25); addFloatText(z.x, z.y - 26, 'DECOY', '#c76bff', 9); }
        if (z.bonus) reward = 60 + wave * 8;
        money += reward;
        addFloatText(z.x, z.y - 12, '+$' + reward, z.bonus ? '#c76bff' : theme.text, z.bonus ? 16 : 12);
        const l = theme.zombieLight + (def.lightOffset || 0);
        const s = theme.zombieSat + (def.satOffset || 0);
        burst(z.x, z.y, z.bonus ? 30 : 10, 'hsl(' + z.hue + ',' + (s + 5) + '%,' + (l + 5) + '%)', z.bonus ? 240 : 120, z.bonus ? 3.5 : 2.2);
        shards(z.x, z.y, z.bonus ? 12 : (z.type === 'brute' ? 8 : 5), theme.bg, z.bonus ? 160 : 100, z.bonus ? 3.4 : (z.type === 'brute' ? 3 : 2.6));
        fx.push({ type: 'ring', x: z.x, y: z.y, r: z.r + 2, life: z.bonus ? 0.55 : 0.35, maxLife: z.bonus ? 0.55 : 0.35, color: z.bonus ? '#c76bff' : 'hsl(' + z.hue + ',' + (s + 10) + '%,' + (l + 8) + '%)' });
        if (z.burnT > gameTime) burst(z.x, z.y, 4, '#ff8833', 90, 1.5);
        if (z.frost > 0.3) burst(z.x, z.y, 4, '#a8dcf5', 90, 1.5);
        if (z.poisonT > gameTime) burst(z.x, z.y, 4, '#5fad3c', 90, 1.5);
        let spreadMark = false, spreadRadius = 0;
        for (const t of turrets) {
          if (t.eff && t.eff.markSpread > 0 && z.markT > gameTime) { spreadMark = true; spreadRadius = t.eff.markSpread; break; }
        }
        if (spreadMark) {
          for (const o of zombies) {
            if (o === z) continue;
            if (Math.hypot(o.x - z.x, o.y - z.y) < spreadRadius) o.markT = Math.max(o.markT, gameTime + 3);
          }
        }
        if (z.bonus) sndUFOKill();
        else if (z.type === 'brute') sndBruteDeath();
        else sndDeath();
        if (z.type === 'trojan') dropTurret(z.x, z.y);
        zombies.splice(i, 1);
      }
    }

    for (let i = ebullets.length - 1; i >= 0; i--) {
      const b = ebullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (Math.random() < dt * 40) particles.push({ x: b.x, y: b.y, vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20, life: 0.3, maxLife: 0.3, s: b.kind === 'fire' ? 2.4 : 1.6, color: b.kind === 'fire' ? (Math.random() < 0.5 ? '#ff8833' : '#ffcc33') : '#ff5c7a' });
      if (b.life <= 0 || b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30) { ebullets.splice(i, 1); continue; }
      let gone = false;
      if (player.dashT <= 0 && Math.hypot(player.x - b.x, player.y - b.y) < player.r + b.r) {
        player.hp -= b.dmg; player.hurt = 1; shake = Math.max(shake, 4); sndHurt();
        if (b.kind === 'fire') {
          if (player.burnT <= 0) addFloatText(player.x, player.y - 20, 'BURNING', '#ff6a2a', 12);
          player.burnT = Math.max(player.burnT, 3.2); player.burnDps = Math.max(player.burnDps, b.burn);
          sndIgnitePlayer();
        }
        burst(b.x, b.y, 6, b.kind === 'fire' ? '#ff8833' : '#ff5c7a', 100, 1.8);
        gone = true;
      } else {
        for (const t of turrets) {
          if (Math.hypot(t.x - b.x, t.y - b.y) < tStats(t.level).r + b.r) {
            if (b.kind === 'fire') {
              damageTurret(t, b.dmg * 1.5, null, 0);
              if (!(t.burnT > 0)) addFloatText(t.x, t.y - tStats(t.level).r - 22, 'IGNITED', '#ff6a2a', 11);
              t.burnT = Math.max(t.burnT || 0, 2.5); t.burnDps = Math.max(t.burnDps || 0, b.burn * 0.7);
              burst(b.x, b.y, 8, '#ff8833', 110, 2); sndIgnitePlayer();
            } else {
              damageTurret(t, b.dmg, null, 0);
              burst(b.x, b.y, 4, '#ff5c7a', 80, 1.6); sndTurretHit();
            }
            gone = true; break;
          }
        }
      }
      if (gone) ebullets.splice(i, 1);
    }

    for (let i = turrets.length - 1; i >= 0; i--) {
      const t = turrets[i];
      if (t.hp <= 0) {
        burst(t.x, t.y, 20, theme.player, 180, 2.6);
        shards(t.x, t.y, 8, theme.player, 140, 3);
        fx.push({ type: 'explode', x: t.x, y: t.y, r: tStats(t.level).r + 6, life: 0.5, maxLife: 0.5 });
        shake = Math.max(shake, 6); addFloatText(t.x, t.y - 22, 'DESTROYED', '#ff5a4a', 12);
        sndTurretDown();
        if (t === activeTurret) clearSelection();
        turrets.splice(i, 1);
      }
    }

    if (player.hp <= 0) { player.hp = 0; gameOver(); }
  }

  /* ================================================================ */
  /*  COLORS                                                           */
  /* ================================================================ */
  function bulletColor(b) { return b.turret ? bulletColorOf(b.turret) : theme.player; }
  function bulletColorOf(t) {
    if (!t.eff) return theme.player;
    const m = t.eff.mods;
    if (m.poison > 0) return '#5fad3c';
    if (m.ice && m.fire) return '#9b6bb5';
    if (m.ice) return '#5aa5d9';
    if (m.fire) return '#e07a2b';
    if (m.laser) return '#d94a3d';
    if (m.chain) return '#8a5fd9';
    if (m.splash) return '#d9772b';
    if (m.blackhole) return '#5a3aa8';
    if (m.crit) return '#d9a02b';
    return theme.player;
  }

  /* ================================================================ */
  /*  DRAW: TURRET                                                     */
  /* ================================================================ */
  function drawTurret(t) {
    const st = tStats(t.level);
    const ratio = Math.max(0, t.hp / t.maxHp);
    const eff = t.eff;
    const accent = bulletColorOf(t);
    const time = performance.now() / 1000;

    // Prestige aura: ring count grows past level 9
    if (t.level >= 10) {
      const rings = Math.min(3, Math.floor((t.level - 9) / 3));
      for (let i = 0; i < rings; i++) {
        const phase = (time * 0.6 + i * 0.33) % 1;
        const r = st.r + 5 + phase * 14 + i * 2;
        ctx.beginPath();
        ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
        ctx.strokeStyle = accentA((1 - phase) * 0.35);
        ctx.lineWidth = 1.3;
        ctx.stroke();
      }
    }

    if (usedSlots(t) > 0) {
      const g = ctx.createRadialGradient(t.x, t.y, st.r * 0.5, t.x, t.y, st.r * 3.2);
      g.addColorStop(0, accent + '00');
      g.addColorStop(0.5, accent + '18');
      g.addColorStop(1, accent + '00');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(t.x, t.y, st.r * 3.2, 0, Math.PI * 2); ctx.fill();
    }
    if (eff.fieldRadius > 0) {
      const FR = eff.fieldRadius;
      const gF = ctx.createRadialGradient(t.x, t.y, FR * 0.3, t.x, t.y, FR);
      gF.addColorStop(0, 'rgba(0,200,240,0)'); gF.addColorStop(0.75, 'rgba(0,200,240,0.05)'); gF.addColorStop(1, 'rgba(0,200,240,0.17)');
      ctx.fillStyle = gF; ctx.beginPath(); ctx.arc(t.x, t.y, FR, 0, Math.PI * 2); ctx.fill();
      ctx.setLineDash([6, 8]); ctx.lineDashOffset = -time * 22;
      ctx.strokeStyle = 'rgba(0,200,240,0.55)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(t.x, t.y, FR, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]); ctx.lineDashOffset = 0;
      const nArc = 3 + eff.mods.field;
      ctx.strokeStyle = 'rgba(170,244,255,0.9)'; ctx.lineWidth = 1.3; ctx.lineJoin = 'round';
      for (let i = 0; i < nArc; i++) {
        const a0 = time * 0.9 + i * (Math.PI * 2 / nArc);
        ctx.beginPath();
        for (let k = 0; k <= 6; k++) {
          const aa = a0 + k * 0.055, rr = FR - 1 + (k % 2 ? 1 : -1) * Math.random() * 4.5;
          const px2 = t.x + Math.cos(aa) * rr, py2 = t.y + Math.sin(aa) * rr;
          if (k) ctx.lineTo(px2, py2); else ctx.moveTo(px2, py2);
        }
        ctx.stroke();
      }
    }
    if (eff.nitroRadius > 0) {
      const NR = eff.nitroRadius;
      const gN = ctx.createRadialGradient(t.x, t.y, NR * 0.3, t.x, t.y, NR);
      gN.addColorStop(0, 'rgba(245,166,35,0)'); gN.addColorStop(0.8, 'rgba(245,166,35,0.05)'); gN.addColorStop(1, 'rgba(245,166,35,0.16)');
      ctx.fillStyle = gN; ctx.beginPath(); ctx.arc(t.x, t.y, NR, 0, Math.PI * 2); ctx.fill();
      ctx.setLineDash([2, 7]); ctx.lineDashOffset = time * 18;
      ctx.strokeStyle = 'rgba(245,166,35,0.6)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(t.x, t.y, NR, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]); ctx.lineDashOffset = 0;
      for (const o of turrets) {
