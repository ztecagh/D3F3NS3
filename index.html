        if (o === t || Math.hypot(o.x - t.x, o.y - t.y) >= NR) continue;
        const live = o.nitroSrc === t;
        ctx.strokeStyle = 'rgba(245,166,35,' + (live ? 0.6 : 0.2) + ')'; ctx.lineWidth = live ? 1.4 : 1;
        ctx.setLineDash([3, 5]); ctx.lineDashOffset = -time * 30;
        ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(o.x, o.y); ctx.stroke();
        ctx.setLineDash([]); ctx.lineDashOffset = 0;
        if (live) {
          const u = (time * 0.9) % 1;
          ctx.beginPath(); ctx.arc(t.x + (o.x - t.x) * u, t.y + (o.y - t.y) * u, 2.6, 0, Math.PI * 2);
          ctx.fillStyle = '#ffd27a'; ctx.fill();
        }
      }
    }
    if (t.nitro > 0) {
      const gB = ctx.createRadialGradient(t.x, t.y, st.r * 0.5, t.x, t.y, st.r + 12);
      gB.addColorStop(0, 'rgba(245,166,35,0.38)'); gB.addColorStop(1, 'rgba(245,166,35,0)');
      ctx.fillStyle = gB; ctx.beginPath(); ctx.arc(t.x, t.y, st.r + 12, 0, Math.PI * 2); ctx.fill();
    }
    if (t.healPulse > 0) {
      const p = 1 - t.healPulse;
      const r = st.r + 6 + p * 26;
      ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(95,218,122,' + (t.healPulse * 0.9) + ')';
      ctx.lineWidth = 2.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(t.x, t.y, r * 0.6, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,' + (t.healPulse * 0.8) + ')';
      ctx.lineWidth = 1.4; ctx.stroke();
    }
    if (activeTurret === t) {
      const pulse = 0.6 + 0.4 * Math.sin(time * 4);
      ctx.beginPath(); ctx.arc(t.x, t.y, st.r + 16, 0, Math.PI * 2);
      ctx.strokeStyle = accentA(0.6 * pulse);
      ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
    }
    if (t.pulse > 0 && eff.range !== Infinity) {
      const p = 1 - t.pulse;
      ctx.beginPath(); ctx.arc(t.x, t.y, eff.range * p, 0, Math.PI * 2);
      ctx.strokeStyle = fgA(t.pulse * 0.55);
      ctx.lineWidth = 2; ctx.stroke();
    }
    const chargeRatio = eff.interval > 0 ? Math.max(0, Math.min(1, 1 - t.cd / eff.interval)) : 0;
    if (t.tgt && chargeRatio > 0.6 && zombies.indexOf(t.tgt) !== -1) {
      ctx.setLineDash([2, 5]); ctx.strokeStyle = accent + '66'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(t.tgt.x, t.tgt.y); ctx.stroke(); ctx.setLineDash([]);
    }
    if (chargeRatio > 0.02) {
      ctx.beginPath();
      ctx.arc(t.x, t.y, st.r + 3.5, -Math.PI/2, -Math.PI/2 + Math.PI * 2 * chargeRatio);
      ctx.strokeStyle = accentA(0.4 + 0.5 * chargeRatio);
      ctx.lineWidth = 1.6; ctx.lineCap = 'round'; ctx.stroke();
    }
    {
      const owned = MOD_LIST.filter(k => t.mods[k] > 0);
      owned.forEach((k, i) => {
        const a = time * 1.6 + i * Math.PI * 2 / owned.length, rr = st.r + 18 + Math.sin(time * 2 + i) * 1.5;
        const ox = t.x + Math.cos(a) * rr, oy = t.y + Math.sin(a) * rr, c = MOD_DEFS[k].color;
        ctx.beginPath(); ctx.arc(ox, oy, 4.5, 0, Math.PI * 2); ctx.fillStyle = c + '40'; ctx.fill();
        ctx.beginPath(); ctx.arc(ox, oy, 1.4 + t.mods[k] * 0.4, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill();
      });
    }
    const sides = Math.min(11, t.level + 2);
    ctx.beginPath();
    for (let i = 0; i < sides; i++) {
      const a = -Math.PI/2 + (i * Math.PI * 2) / sides;
      const px = t.x + Math.cos(a) * st.r;
      const py = t.y + Math.sin(a) * st.r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = fgA(0.32 + 0.68 * ratio);
    ctx.fill();
    if (usedSlots(t) > 0) {
      ctx.beginPath(); ctx.arc(t.x, t.y, st.r + 1.5, 0, Math.PI * 2);
      ctx.strokeStyle = accent; ctx.lineWidth = 1.4; ctx.stroke();
    }
    const barrelLen = st.r + 8 - (t.recoil || 0) * 4;
    const barrelX = t.x + Math.cos(t.angle) * barrelLen;
    const barrelY = t.y + Math.sin(t.angle) * barrelLen;
    ctx.beginPath();
    ctx.moveTo(t.x, t.y);
    ctx.lineTo(barrelX, barrelY);
    ctx.strokeStyle = theme.player; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();
    if (eff.fireMode === 'laser') {
      ctx.beginPath();
      ctx.moveTo(t.x, t.y);
      ctx.lineTo(barrelX, barrelY);
      ctx.strokeStyle = 'rgba(217,74,61,0.5)'; ctx.lineWidth = 5; ctx.stroke();
    }
    if (t.fireFlash > 0) {
      const f = t.fireFlash;
      const g = ctx.createRadialGradient(barrelX, barrelY, 0, barrelX, barrelY, 15 * f);
      g.addColorStop(0, 'rgba(255,255,255,' + (0.95 * f) + ')');
      g.addColorStop(0.4, accent + 'b8');
      g.addColorStop(1, accent + '00');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(barrelX, barrelY, 15 * f, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(barrelX, barrelY, 2.2 + f * 2, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff'; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(t.x, t.y, 1.9, 0, Math.PI * 2);
    ctx.fillStyle = theme.playerCore; ctx.fill();
    const slots = availSlots(t.level);
    {
      const R = st.r + 7, TAU = Math.PI * 2, A0 = -Math.PI / 2;
      const shown = Math.max(0, Math.min(1, (t.hpShown === undefined ? t.hp : t.hpShown) / t.maxHp));
      const col = ratio > 0.6 ? '#22e06b' : (ratio > 0.3 ? '#ffd21f' : '#ff3b30');
      ctx.lineCap = 'butt';
      ctx.beginPath(); ctx.arc(t.x, t.y, R + 2.8, 0, TAU);
      ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 0.8; ctx.stroke();
      ctx.beginPath(); ctx.arc(t.x, t.y, R, 0, TAU);
      ctx.strokeStyle = 'rgba(0,0,0,0.92)'; ctx.lineWidth = 4.6; ctx.stroke();
      if (shown > ratio + 0.002) {
        ctx.beginPath(); ctx.arc(t.x, t.y, R, A0 + TAU * ratio, A0 + TAU * shown);
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.6; ctx.stroke();
      }
      if (ratio > 0.001) {
        ctx.beginPath(); ctx.arc(t.x, t.y, R, A0, A0 + TAU * Math.min(1, ratio));
        ctx.strokeStyle = col; ctx.lineWidth = 2.6; ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineWidth = 1;
      for (let i = 0; i < 4; i++) {
        const an = A0 + i * Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(t.x + Math.cos(an) * (R - 2.3), t.y + Math.sin(an) * (R - 2.3));
        ctx.lineTo(t.x + Math.cos(an) * (R + 2.3), t.y + Math.sin(an) * (R + 2.3));
        ctx.stroke();
      }
      if (eff.shieldMax > 0) {
        const SR = st.r + 12, sf = Math.max(0, Math.min(1, (t.shield || 0) / eff.shieldMax));
        ctx.beginPath(); ctx.arc(t.x, t.y, SR, 0, TAU);
        ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 3.6; ctx.stroke();
        if (sf > 0.001) {
          ctx.beginPath(); ctx.arc(t.x, t.y, SR, A0, A0 + TAU * sf);
          ctx.strokeStyle = '#4dd2ff'; ctx.lineWidth = 2.2; ctx.stroke();
        } else {
          ctx.setLineDash([3, 5]); ctx.beginPath(); ctx.arc(t.x, t.y, SR, 0, TAU);
          ctx.strokeStyle = 'rgba(77,210,255,' + (0.35 + 0.3 * Math.sin(time * 6)) + ')'; ctx.lineWidth = 1.6; ctx.stroke(); ctx.setLineDash([]);
        }
        if (t.shieldFlash > 0) {
          ctx.beginPath(); ctx.arc(t.x, t.y, SR + 1.5, 0, TAU);
          ctx.strokeStyle = 'rgba(200,245,255,' + t.shieldFlash + ')'; ctx.lineWidth = 3.4; ctx.stroke();
          ctx.fillStyle = 'rgba(77,210,255,' + (t.shieldFlash * 0.16) + ')';
          ctx.beginPath(); ctx.arc(t.x, t.y, SR, 0, TAU); ctx.fill();
        }
      }
      if (activeTurret === t || ratio < 0.999) txt(Math.ceil(t.hp) + '/' + t.maxHp, t.x, t.y - R - (eff.shieldMax > 0 ? 17 : 10), 9, theme.text, 'center', '700', 0);
      if (t.burnT > 0) {
        const fl = 0.6 + 0.4 * Math.sin(time * 22);
        ctx.beginPath(); ctx.arc(t.x, t.y, st.r + 2.5, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,120,40,' + (0.85 * fl) + ')'; ctx.lineWidth = 2.4; ctx.stroke();
      }
      if (t.hitFlash > 0) { ctx.beginPath(); ctx.arc(t.x, t.y, st.r + 2, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(255,70,50,' + t.hitFlash + ')'; ctx.lineWidth = 2.5; ctx.stroke(); }
      if (ratio < 0.3) { const lp = 0.5 + 0.5 * Math.sin(time * 8); ctx.beginPath(); ctx.arc(t.x, t.y, st.r + 12 + lp * 4, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(255,59,48,' + (0.7 * lp) + ')'; ctx.lineWidth = 2; ctx.stroke(); }
      if (t.spawnPulse > 0) { ctx.beginPath(); ctx.arc(t.x, t.y, st.r + 4 + (1 - t.spawnPulse) * 30, 0, Math.PI * 2); ctx.strokeStyle = accentA(t.spawnPulse * 0.7); ctx.lineWidth = 2; ctx.stroke(); }
    }
    const dotR = 2.2, gap = 6.5;
    const totalW = (slots - 1) * gap;
    const sy = t.y + st.r + 24;
    const flat = [];
    for (const kk of MOD_LIST) for (let i = 0; i < t.mods[kk]; i++) flat.push(kk);
    for (let i = 0; i < slots; i++) {
      const sx = t.x - totalW / 2 + i * gap;
      const m = flat[i];
      if (m) {
        ctx.beginPath(); ctx.arc(sx, sy, dotR, 0, Math.PI * 2);
        ctx.fillStyle = MOD_DEFS[m].color; ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(sx, sy, dotR, 0, Math.PI * 2);
        ctx.strokeStyle = fgA(0.28); ctx.lineWidth = 1; ctx.stroke();
      }
    }

    // Level indicator for high levels — small "LV X" text under turret
    if (t.level >= 10) {
      txt('LV ' + t.level, t.x, sy + 12, 8, theme.textDim, 'center', '700', 0.5);
    }
  }

  /* ================================================================ */
  /*  DRAW: TURRET PANEL — clean, evenly-spaced layout                 */
  /* ================================================================ */
  function drawTurretPanel(t) {
    const eff = t.eff;
    const base = tStats(t.level);
    const upCost = milCost(t.level);
    const canUpgrade = money >= upCost;
    const refund = sellValue(t);
    const slots = availSlots(t.level);
    const used = usedSlots(t);
    const mCost = modifierCost(t);
    const canAffordMod = money >= mCost;
    const hasSpace = used < slots;

    // --- Layout constants (all spacing is intentional and even) ---
    const pad        = 16;    // outer padding
    const panelW     = 384;
    const hHeader    = 20;    // "TURRET LV N"
    const gapAfterH  = 12;
    const hUpBtn     = 30;
    const gapBtwnBtns= 6;
    const hSellBtn   = 24;
    const gapBeforeD1= 16;
    const divH       = 1;
    const gapAfterD1 = 14;
    const hStat      = 15;    // 4 rows → 60
    const gapBeforeD2= 14;
    const gapAfterD2 = 14;
    const hModHead   = 14;
    const gapAfterMH = 8;
    const hGridRow   = 30;
    const hGridGap   = 5;
    const gridCols   = 4;
    const gridRows   = Math.ceil(MOD_LIST.length / gridCols);
    const gridH      = gridRows * hGridRow + (gridRows - 1) * hGridGap;
    const gapAfterGH = 14;
    const hFooter    = 16;

    const contentH =
      hHeader + gapAfterH +
      hUpBtn + gapBtwnBtns + hSellBtn + gapBeforeD1 +
      divH + gapAfterD1 +
      hStat * 4 + gapBeforeD2 +
      divH + gapAfterD2 +
      hModHead + gapAfterMH +
      gridH +
      gapAfterGH + hFooter;

    const panelH = pad * 2 + contentH;

    let px = t.x + base.r + 22;
    let py = t.y - panelH / 2;
    if (px + panelW > W - 12) px = t.x - base.r - 22 - panelW;
    if (px < 12) px = 12;
    if (py < 12) py = 12;
    if (py + panelH > H - 12) py = H - 12 - panelH;

    panelRect = { x: px, y: py, w: panelW, h: panelH };

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.fillRect(px + 3, py + 3, panelW, panelH);
    // Body
    ctx.fillStyle = theme.modalBg;
    ctx.fillRect(px, py, panelW, panelH);
    ctx.strokeStyle = theme.panelBorder;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(px + 0.75, py + 0.75, panelW - 1.5, panelH - 1.5);

    // --- Cursor ---
    let cy = py + pad;

    // --- Header row ---
    const headerCY = cy + hHeader / 2;
    const lvlLabel = t.level >= 10 ? 'TURRET  \u2605 LV ' + t.level : 'TURRET LV ' + t.level;
    txt(lvlLabel, px + pad, headerCY, 12, theme.text, 'left', '700', 1.5);

    // Close X (right side of header)
    const closeSize = 20;
    const closeX = px + panelW - pad - closeSize;
    const closeY = cy + (hHeader - closeSize) / 2;
    const closeHover = mouse.x >= closeX && mouse.x <= closeX + closeSize &&
                       mouse.y >= closeY && mouse.y <= closeY + closeSize;
    if (closeHover) {
      ctx.fillStyle = 'rgba(192,57,43,0.9)';
      ctx.fillRect(closeX, closeY, closeSize, closeSize);
    }
    ctx.strokeStyle = closeHover ? '#ffffff' : theme.textDim;
    ctx.lineWidth = 1.6;
    ctx.lineCap = 'round';
    const ccx = closeX + closeSize / 2, ccy = closeY + closeSize / 2;
    ctx.beginPath();
    ctx.moveTo(ccx - 4, ccy - 4); ctx.lineTo(ccx + 4, ccy + 4);
    ctx.moveTo(ccx + 4, ccy - 4); ctx.lineTo(ccx - 4, ccy + 4);
    ctx.stroke();
    panelHitAreas.push({ x: closeX - 2, y: closeY - 2, w: closeSize + 4, h: closeSize + 4, action: 'close', turret: t });
    cy += hHeader + gapAfterH;

    // --- Upgrade button ---
    {
      const bx = px + pad, by = cy, bw = panelW - pad * 2, bh = hUpBtn;
      const hover = pointInRect(mouse.x, mouse.y, { x: bx, y: by, w: bw, h: bh });
      const isPrestige = t.level >= 9;
      const bgColor = canUpgrade
        ? (hover ? accentA(0.92) : theme.accent)
        : (theme.isDark ? '#181a20' : '#e6e6e1');
      ctx.fillStyle = bgColor;
      ctx.fillRect(bx, by, bw, bh);
      ctx.strokeStyle = canUpgrade ? theme.accentText : theme.textDim;
      ctx.lineWidth = 1.2;
      ctx.strokeRect(bx + 0.6, by + 0.6, bw - 1.2, bh - 1.2);
      const label = canUpgrade
        ? (isPrestige ? '\u2605 UPGRADE TO LV ' + (t.level + 1) + '  \u00b7  $' + upCost
                      : 'UPGRADE TO LV ' + (t.level + 1) + '  \u00b7  $' + upCost)
        : 'NEED $' + upCost;
      const labelColor = canUpgrade ? theme.accentText : (money >= upCost ? theme.text : '#c0392b');
      txt(label, bx + bw / 2, by + bh / 2, 11, labelColor, 'center', '700', 0.8);
      if (canUpgrade) panelHitAreas.push({ x: bx, y: by, w: bw, h: bh, action: 'upgrade', turret: t });
      cy += hUpBtn + gapBtwnBtns;
    }

    // --- Sell button ---
    {
      const bx = px + pad, by = cy, bw = panelW - pad * 2, bh = hSellBtn;
      const hover = pointInRect(mouse.x, mouse.y, { x: bx, y: by, w: bw, h: bh });
      ctx.fillStyle = hover ? 'rgba(192,57,43,0.26)' : (theme.isDark ? 'rgba(192,57,43,0.10)' : 'rgba(192,57,43,0.06)');
      ctx.fillRect(bx, by, bw, bh);
      ctx.strokeStyle = hover ? '#c0392b' : 'rgba(192,57,43,0.55)';
      ctx.lineWidth = 1;
      ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
      txt('SELL  \u00b7  $' + refund + '  (50%)', bx + bw / 2, by + bh / 2, 10, '#c0392b', 'center', '700', 0.8);
      panelHitAreas.push({ x: bx, y: by, w: bw, h: bh, action: 'sell', turret: t });
      cy += hSellBtn + gapBeforeD1;
    }

    // --- Divider 1 ---
    ctx.fillStyle = fgA(0.16);
    ctx.fillRect(px + pad, cy, panelW - pad * 2, divH);
    cy += divH + gapAfterD1;

    // --- Stat rows ---
    const lx = px + pad;
    const vx = px + pad + 50;
    const ax = px + pad + 150;
    const nx = px + pad + 172;
    const rngStr = r => r === Infinity ? '\u221e' : String(Math.round(r));
    const nextEff = computeEff({ ...t, level: t.level + 1, mods: t.mods });
    const rows = [
      ['DMG',  String(Math.round(eff.dmg)),       String(Math.round(nextEff.dmg))],
      ['RNG',  rngStr(eff.range),                 rngStr(nextEff.range)],
      ['RATE', (1 / eff.interval * (1 + (t.nitro || 0))).toFixed(1), (1 / nextEff.interval * (1 + (t.nitro || 0))).toFixed(1)],
      ['HP',   Math.round(t.hp) + '/' + t.maxHp,  String(nextEff.hp)]
    ];
    for (const [label, val, next] of rows) {
      const ry = cy + hStat / 2;
      txt(label, lx, ry, 10, theme.textDim, 'left', '600', 1);
      txt(val,   vx, ry, 11, theme.text, 'left', '700', 0);
      txt('\u2192', ax, ry, 11, theme.textDim, 'left', '400', 0);
      txt(next, nx, ry, 11, theme.textDim, 'left', '600', 0);
      cy += hStat;
    }
    cy += gapBeforeD2;

    // --- Divider 2 ---
    ctx.fillStyle = fgA(0.16);
    ctx.fillRect(px + pad, cy, panelW - pad * 2, divH);
    cy += divH + gapAfterD2;

    // --- Modifiers header ---
    {
      const ry = cy + hModHead / 2;
      txt('MODIFIERS', lx, ry, 10, theme.text, 'left', '700', 1.5);
      const slotText = used + ' / ' + slots + (hasSpace ? '  \u00b7  $' + mCost : '');
      txt(slotText, px + panelW - pad, ry, 10,
          hasSpace ? (canAffordMod ? theme.text : '#c0392b') : theme.textDim,
          'right', '700', 0.5);
      cy += hModHead + gapAfterMH;
    }

    // --- Modifier grid ---
    let hoveredType = null;
    const gridW = panelW - pad * 2;
    const btnW = (gridW - hGridGap * (gridCols - 1)) / gridCols;
    for (let idx = 0; idx < MOD_LIST.length; idx++) {
      const type = MOD_LIST[idx];
      const def = MOD_DEFS[type];
      const level = t.mods[type] || 0;
      const owned = level > 0;
      const col = idx % gridCols;
      const row = Math.floor(idx / gridCols);
      const bx = px + pad + col * (btnW + hGridGap);
      const by = cy + row * (hGridRow + hGridGap);
      const hoveredBtn = mouse.x >= bx && mouse.x <= bx + btnW &&
                         mouse.y >= by && mouse.y <= by + hGridRow;
      const canAdd = canAffordMod && hasSpace;
      if (hoveredBtn) hoveredType = type;

      let bg = theme.isDark ? '#1a1c22' : '#eeeeea';
      let fg = theme.textDim, border = theme.isDark ? '#3a3e48' : '#c8c8c2';
      if (owned) { bg = def.pale; fg = def.dark; border = def.dark; }
      if (hoveredBtn) {
        if (canAdd) { bg = def.color; fg = '#ffffff'; border = def.dark; }
        else { bg = theme.isDark ? '#22252c' : '#dddddd'; }
      } else if (canAdd && !owned) { bg = def.pale; fg = def.dark; border = def.dark; }

      ctx.fillStyle = bg;
      ctx.fillRect(bx, by, btnW, hGridRow);
      ctx.strokeStyle = border;
      ctx.lineWidth = (owned || hoveredBtn) ? 1.6 : 1;
      ctx.strokeRect(bx + 0.6, by + 0.6, btnW - 1.2, hGridRow - 1.2);

      // Name centered
      txt(def.name, bx + btnW / 2, by + hGridRow / 2 + (owned ? -2 : 1), 10, fg, 'center', '700', 0.5);

      // Stack count centered below name if owned
      if (owned) {
        txt('\u00d7' + level, bx + btnW / 2, by + hGridRow - 7, 9,
            (fg === '#ffffff') ? 'rgba(255,255,255,0.9)' : def.dark, 'center', '700', 0);
      }

      panelHitAreas.push({ x: bx, y: by, w: btnW, h: hGridRow, action: 'addMod', type, turret: t });
    }
    cy += gridH + gapAfterGH;

    // --- Footer ---
    const footMsg = !hasSpace
      ? 'SLOTS FULL'
      : (!canAffordMod
          ? 'NOT ENOUGH MONEY  \u00b7  COST $' + mCost
          : 'CLICK A MODIFIER TO STACK IT');
    if (hoveredType) {
      txt(MOD_DEFS[hoveredType].name + '  \u00b7  ' + MOD_DESC[hoveredType], px + panelW / 2, cy + hFooter / 2, 9,
          theme.isDark ? MOD_DEFS[hoveredType].color : MOD_DEFS[hoveredType].dark, 'center', '700', 0.6);
    } else {
      txt(footMsg, px + panelW / 2, cy + hFooter / 2, 9,
          hasSpace && canAffordMod ? theme.textDim : '#c0392b',
          'center', '700', 1);
    }
  }

  /* ================================================================ */
  /*  DRAW: ZOMBIE STATUS                                              */
  /* ================================================================ */
  function drawZombieStatus(z) {
    const slowed = z.slowT > gameTime;
    const frozen = z.freezeT > gameTime || z.stunT > gameTime;
    const burning = z.burnT > gameTime;
    const poisoned = z.poisonT > gameTime;
    const marked = z.markT > gameTime;
    if (slowed || frozen || z.frost > 0.05) {
      const a = Math.max(z.frost, frozen ? 1 : 0, slowed ? 0.75 : 0);
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r + 4 + a * 1.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(168,220,245,' + (0.18 * a) + ')'; ctx.fill();
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r + 6, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(120,190,235,' + (0.55 * a) + ')';
      ctx.lineWidth = 1.3; ctx.stroke();
    }
    if (poisoned) {
      const t = performance.now() / 400 + z.wob * 3;
      const pulses = 0.5 + 0.5 * Math.sin(t);
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r + 5 + pulses * 2, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(95,173,60,' + (0.14 + 0.08 * pulses) + ')'; ctx.fill();
      const drips = Math.min(3, z.poisonStacks);
      for (let i = 0; i < drips; i++) {
        const dx = z.x + Math.cos(i * 2.1 + z.wob) * (z.r + 2);
        const dy = z.y + Math.sin(i * 2.1 + z.wob) * (z.r + 2) + 2;
        ctx.beginPath(); ctx.arc(dx, dy, 1.4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(95,173,60,0.85)'; ctx.fill();
      }
    }
    if (burning) {
      const t = performance.now() / 180 + z.wob * 3;
      const flick = 0.6 + 0.4 * Math.sin(t);
      ctx.beginPath();
      ctx.moveTo(z.x, z.y - z.r - 3);
      ctx.lineTo(z.x - 3, z.y - z.r - 9);
      ctx.lineTo(z.x, z.y - z.r - 14 * flick);
      ctx.lineTo(z.x + 3, z.y - z.r - 9);
      ctx.closePath();
      ctx.fillStyle = 'rgba(240,120,30,0.9)'; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(z.x, z.y - z.r - 5);
      ctx.lineTo(z.x - 1.6, z.y - z.r - 9);
      ctx.lineTo(z.x, z.y - z.r - 11 * flick);
      ctx.lineTo(z.x + 1.6, z.y - z.r - 9);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,220,100,0.9)'; ctx.fill();
    }
    if (z.stunT > gameTime) {
      const a = Math.min(1, (z.stunT - gameTime) * 4);
      for (let i = 0; i < 3; i++) {
        const ang = performance.now() / 200 + i * 2.1;
        const sx = z.x + Math.cos(ang) * (z.r + 6);
        const sy = z.y - z.r - 6 + Math.sin(ang) * 3;
        ctx.beginPath(); ctx.arc(sx, sy, 1.8, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(240,220,60,' + (0.9 * a) + ')'; ctx.fill();
      }
    }
    if (marked) {
      const a = Math.min(1, (z.markT - gameTime) * 2);
      const r = z.r + 8;
      ctx.strokeStyle = 'rgba(217,43,43,' + (0.85 * a) + ')';
      ctx.lineWidth = 1.4;
      for (let i = 0; i < 4; i++) {
        const startA = i * Math.PI / 2 + performance.now() / 800;
        const endA = startA + Math.PI / 6;
        ctx.beginPath(); ctx.arc(z.x, z.y, r, startA, endA); ctx.stroke();
      }
    }
  }

  /* ================================================================ */
  /*  DRAW: WAVE PREVIEW                                               */
  /* ================================================================ */
  function drawSpecialZombie(z, sc) {
    const col = SPECIAL_COLORS[z.type], r = z.r * sc, t = performance.now() / 1000, TAU = Math.PI * 2;
    ctx.save(); ctx.translate(z.x, z.y);
    if (z.type === 'trojan') {
      ctx.fillStyle = col; ctx.fillRect(-r * 0.95, -r * 0.95, r * 1.9, r * 1.9);
      ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1.4; ctx.strokeRect(-r * 0.95, -r * 0.95, r * 1.9, r * 1.9);
      ctx.beginPath(); ctx.moveTo(-r * 0.95, -r * 0.95); ctx.lineTo(r * 0.95, r * 0.95); ctx.moveTo(r * 0.95, -r * 0.95); ctx.lineTo(-r * 0.95, r * 0.95); ctx.stroke();
      ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(0, 0, r * 0.38, 0, TAU); ctx.fill();
      ctx.fillRect(0, -r * 0.09, r * 0.75, r * 0.18);
    } else if (z.type === 'pyro') {
      for (let i = -1; i <= 1; i++) {
        const h = r * (0.9 + 0.5 * Math.sin(t * 9 + i * 2));
        ctx.beginPath(); ctx.moveTo(i * r * 0.55 - r * 0.3, -r * 0.55); ctx.lineTo(i * r * 0.55, -r * 0.55 - h); ctx.lineTo(i * r * 0.55 + r * 0.3, -r * 0.55);
        ctx.closePath(); ctx.fillStyle = 'rgba(255,176,32,0.9)'; ctx.fill();
      }
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fillStyle = col; ctx.fill();
      ctx.beginPath(); ctx.arc(0, 0, r * 0.42, 0, TAU); ctx.fillStyle = '#ffe08a'; ctx.fill();
    } else if (z.type === 'medic') {
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fillStyle = col; ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-r * 0.6, -r * 0.18, r * 1.2, r * 0.36); ctx.fillRect(-r * 0.18, -r * 0.6, r * 0.36, r * 1.2);
      if (z.healFx > 0) { ctx.beginPath(); ctx.arc(0, 0, r + 3 + (1 - z.healFx) * 10, 0, TAU); ctx.strokeStyle = 'rgba(61,220,132,' + z.healFx + ')'; ctx.lineWidth = 2; ctx.stroke(); }
    } else if (z.type === 'lunger') {
      ctx.rotate(z.face || 0);
      ctx.beginPath(); ctx.moveTo(r * 1.5, 0); ctx.lineTo(-r * 0.9, -r * 0.95); ctx.lineTo(-r * 0.5, 0); ctx.lineTo(-r * 0.9, r * 0.95); ctx.closePath();
      ctx.fillStyle = z.lst === 'wind' ? '#ff4d2e' : col; ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.2; ctx.stroke();
    } else if (z.type === 'hturret') {
      ctx.setLineDash([3, 6]); ctx.strokeStyle = 'rgba(255,59,92,0.2)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(0, 0, 250, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath();
      for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + Math.PI / 8; const px = Math.cos(a) * r * 1.15, py = Math.sin(a) * r * 1.15; if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py); }
      ctx.closePath(); ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.save(); ctx.rotate(z.aim || 0); ctx.fillStyle = '#2a0a12'; ctx.fillRect(0, -r * 0.2, r * 1.5, r * 0.4); ctx.restore();
      ctx.beginPath(); ctx.arc(0, 0, r * 0.4, 0, TAU); ctx.fillStyle = '#2a0a12'; ctx.fill();
      ctx.beginPath(); ctx.arc(0, 0, r + 5, -Math.PI / 2, -Math.PI / 2 + TAU * Math.max(0, z.life / (z.lifeMax || 14)));
      ctx.strokeStyle = 'rgba(255,59,92,0.85)'; ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.restore();
    if (z.type === 'lunger' && z.lst === 'wind') {
      ctx.setLineDash([5, 5]); ctx.strokeStyle = 'rgba(255,77,46,' + (0.35 + 0.4 * Math.sin(t * 24)) + ')'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(z.x, z.y); ctx.lineTo(z.x + Math.cos(z.dirA) * 260, z.y + Math.sin(z.dirA) * 260); ctx.stroke(); ctx.setLineDash([]);
    }
  }
  function drawWavePreview(centerX, y, waveNum) {
    const comp = (waveNum === wave + 1 && nextWavePreview) ? nextWavePreview : composeWave(waveNum);
    const counts = {};
    for (const t of comp) counts[t] = (counts[t] || 0) + 1;
    const entries = ['grunt', 'sprinter', 'brute', 'lunger', 'pyro', 'medic', 'trojan'].filter(k => counts[k] > 0).map(k => ({ type: k, count: counts[k] }));
    if (entries.length === 0) return;
    const maxDots = entries.length > 5 ? 3 : (entries.length > 3 ? 5 : 8);

    const labelY = y;
    txt('INCOMING', centerX, labelY - 14, 9, theme.textDim, 'center', '700', 2);

    const dotR = 5;
    const entryGap = 16;
    const entryDotGap = 5;
    const numW = 16;
    let totalW = 0;
    for (let i = 0; i < entries.length; i++) {
      const cnt = entries[i].count;
      const dotsToShow = Math.min(cnt, maxDots);
      totalW += dotsToShow * (dotR * 2) + (dotsToShow - 1) * entryDotGap + numW;
      if (i < entries.length - 1) totalW += entryGap;
    }

    let cx = centerX - totalW / 2;
    for (const ent of entries) {
      const def = ENEMY_TYPES[ent.type];
      const cnt = ent.count;
      const dotsToShow = Math.min(cnt, maxDots);
      const light = theme.zombieLight + (def.lightOffset || 0);
      const sat = theme.zombieSat + (def.satOffset || 0);
      const col = SPECIAL_COLORS[ent.type] || ('hsl(' + theme.zombieHue + ',' + sat + '%,' + light + '%)');
      for (let i = 0; i < dotsToShow; i++) {
        ctx.beginPath();
        ctx.arc(cx + i * (dotR * 2 + entryDotGap) + dotR, labelY + 6, dotR, 0, Math.PI * 2);
        ctx.fillStyle = col;
        ctx.fill();
      }
      const numX = cx + dotsToShow * (dotR * 2) + (dotsToShow - 1) * entryDotGap + 6;
      txt('\u00d7' + cnt, numX, labelY + 6, 11, theme.text, 'left', '700', 0.5);
      cx += dotsToShow * (dotR * 2) + (dotsToShow - 1) * entryDotGap + numW + entryGap;
    }
  }

  /* ================================================================ */
  /*  DRAW: INSTRUCTIONS                                               */
  /* ================================================================ */
  const HELP_COLORS = { MOVE:'#5aa5d9', BUILD:'#5fc03c', SELECT:'#e0b02b', UPGRADE:'#e8842b', MODIFIERS:'#9a6fe9', SELL:'#3fd97a', 'HEAL GUN':'#c76bff', WAVES:'#e0503d', ENEMIES:'#2bd9c1', PAUSE:'#e83b8a', SETTINGS:'#9aa8c0' };
  function drawHelpIcon(label, x, y, c, t) {
    ctx.save();
    ctx.fillStyle = c + '2a'; ctx.fillRect(x - 12, y - 12, 24, 24);
    ctx.strokeStyle = c; ctx.lineWidth = 1.2; ctx.strokeRect(x - 11.5, y - 11.5, 23, 23);
    ctx.lineWidth = 1.7; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.fillStyle = c;
    const line = (x1, y1, x2, y2) => { ctx.beginPath(); ctx.moveTo(x + x1, y + y1); ctx.lineTo(x + x2, y + y2); ctx.stroke(); };
    if (label === 'MOVE') {
      for (let i = 0; i < 4; i++) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(i * Math.PI / 2);
        const o = Math.sin(t * 3) * 0.8;
        ctx.beginPath(); ctx.moveTo(3, 0); ctx.lineTo(7 + o, 0); ctx.moveTo(5 + o, -2); ctx.lineTo(7.5 + o, 0); ctx.lineTo(5 + o, 2); ctx.stroke();
        ctx.restore();
      }
    } else if (label === 'BUILD') {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; const px2 = x + Math.cos(a) * 6, py2 = y + Math.sin(a) * 6; if (i) ctx.lineTo(px2, py2); else ctx.moveTo(px2, py2); }
      ctx.closePath(); ctx.globalAlpha = 0.45; ctx.fill(); ctx.globalAlpha = 1; ctx.stroke();
      line(0, 0, Math.cos(t * 1.5) * 9, Math.sin(t * 1.5) * 9);
    } else if (label === 'SELECT') {
      const b = Math.sin(t * 3) * 1;
      ctx.beginPath(); ctx.moveTo(x - 4 + b, y - 7 + b); ctx.lineTo(x - 4 + b, y + 5 + b); ctx.lineTo(x - 1 + b, y + 2 + b); ctx.lineTo(x + 2 + b, y + 8 + b);
      ctx.lineTo(x + 4 + b, y + 7 + b); ctx.lineTo(x + 1.5 + b, y + 1.5 + b); ctx.lineTo(x + 5.5 + b, y + 1.5 + b); ctx.closePath(); ctx.fill();
    } else if (label === 'UPGRADE') {
      const b = ((t * 1.2) % 1) * 4;
      for (let i = 0; i < 2; i++) { const yy = 3 - i * 6 - b + 2; ctx.globalAlpha = i === 0 ? 1 - b / 5 : 1; ctx.beginPath(); ctx.moveTo(x - 5, y + yy + 3); ctx.lineTo(x, y + yy - 2); ctx.lineTo(x + 5, y + yy + 3); ctx.stroke(); }
      ctx.globalAlpha = 1;
    } else if (label === 'MODIFIERS') {
      ctx.beginPath(); ctx.arc(x, y, 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.lineWidth = 0.9; ctx.stroke();
      ctx.beginPath(); ctx.arc(x + Math.cos(t * 2.4) * 7, y + Math.sin(t * 2.4) * 7, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + Math.cos(t * 2.4 + Math.PI) * 7, y + Math.sin(t * 2.4 + Math.PI) * 7, 2, 0, Math.PI * 2); ctx.fill();
    } else if (label === 'SELL') {
      txt('$', x, y + 0.5, 15, c, 'center', '700', 0);
    } else if (label === 'HEAL GUN') {
      const p = 0.75 + 0.25 * Math.sin(t * 4);
      line(-6 * p, 0, 6 * p, 0); line(0, -6 * p, 0, 6 * p);
      ctx.beginPath(); ctx.arc(x, y, 8.5, 0, Math.PI * 2); ctx.lineWidth = 0.8; ctx.stroke();
    } else if (label === 'WAVES') {
      for (let i = 0; i < 3; i++) { const p = ((t * 0.9) + i / 3) % 1; ctx.globalAlpha = 1 - p; ctx.beginPath(); ctx.arc(x, y, 1.5 + p * 9, 0, Math.PI * 2); ctx.stroke(); }
      ctx.globalAlpha = 1;
    } else if (label === 'ENEMIES') {
      const dots = [[-5, 3, 3.2], [3, 4, 2.4], [1, -4, 4]];
      dots.forEach((d, i) => { ctx.beginPath(); ctx.arc(x + d[0] + Math.sin(t * 2 + i) * 1.2, y + d[1], d[2], 0, Math.PI * 2); ctx.fill(); });
    } else if (label === 'PAUSE') {
      ctx.fillRect(x - 5, y - 6, 3.5, 12); ctx.fillRect(x + 1.5, y - 6, 3.5, 12);

    }

  }
  function helpBackdrop() {
    const t = performance.now() / 1000;
    ctx.save();
    ctx.setLineDash([4, 10]); ctx.lineWidth = 1;
    for (let k = 0; k < 3; k++) {
      ctx.lineDashOffset = -t * 14 * (k % 2 ? 1 : -1);
      ctx.strokeStyle = accentA(0.12 - k * 0.025);
      ctx.beginPath(); ctx.arc(W / 2, H / 2, 190 + k * 120, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.setLineDash([]);
    const roam = (i, tt) => {
      const a = i * 2.4 + tt * 0.25;
      const rad = 160 + Math.sin(i * 1.7 + tt * 0.7) * 60;
      return { x: W / 2 + Math.cos(a) * rad * 1.4, y: H / 2 + Math.sin(a) * rad * 0.8 };
    };
    for (let i = 0; i < 26; i++) {
      const p0 = roam(i, t), p1 = roam(i, t + 0.06);
      const face = Math.atan2(p1.y - p0.y, p1.x - p0.x);
      const r = i % 7 === 0 ? 8 : (i % 3 === 0 ? 4 : 5.5);
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = theme.isDark ? 'rgba(0,0,0,0.38)' : 'rgba(0,0,0,0.13)';
      ctx.beginPath(); ctx.ellipse(p0.x + 2, p0.y + r * 0.75, r * 0.95, r * 0.42, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'hsl(' + (theme.zombieHue + i * 0.7) + ',' + theme.zombieSat + '%,' + (theme.zombieLight + 10) + '%)';
      ctx.beginPath(); ctx.arc(p0.x, p0.y, r, 0, Math.PI * 2); ctx.fill();
      for (const sg of [-1, 1]) {
        ctx.beginPath(); ctx.arc(p0.x + Math.cos(face + sg * 0.55) * r * 0.52, p0.y + Math.sin(face + sg * 0.55) * r * 0.52, Math.max(1, r * 0.17), 0, Math.PI * 2);
        ctx.fillStyle = theme.bg; ctx.fill();
      }
    }
    ctx.fillStyle = theme.player; ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.arc(W / 2, H / 2, PLAYER_R, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(W / 2, H / 2, PLAYER_R * 0.32, 0, Math.PI * 2); ctx.fillStyle = '#c76bff'; ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  function drawInstructions(asOverlay) {

    const items = [
      ['MOVE',      'WASD or arrows. You drift a little when you stop.'],
      ['BUILD',     'Click empty ground to place a turret ($50).'],
      ['SELECT',    'Click a turret to open its panel. Click again to upgrade.'],
      ['UPGRADE',   'Raises DMG / RNG / RATE / HP. Levels scale infinitely \u2014 prices rise fast.'],
      ['MODIFIERS', 'Click modifier buttons in the panel to stack them.'],
      ['SELL',      'Sell a turret from its panel for 50% back.'],
      ['HEAL GUN',  '[G] to arm. Click enemy = one-shot. Click turret = heal 25%. Costs 15% HP per shot.'],
      ['WAVES',     'Toggle AUTO / MANUAL top-right. Manual waits for START WAVE.'],
      ['ENEMIES',   'Grunts are balanced. Sprinters are fast. Brutes are tanky. UFOs are bonus targets.'],

    const rowGap = 11;

    let contentH = 0;
    for (const w of wrapped) contentH += Math.max(1, w.lines.length) * lineH + rowGap;
    contentH -= rowGap;

    const footerH = 68;
    const panelH = pad * 2 + titleH + contentH + footerH;

    const px = (W - panelW) / 2;

    settingsModalRect = { x: px, y: py, w: panelW, h: panelH };

    ctx.strokeStyle = theme.panelBorder;

    ctx.strokeRect(px + 0.75, py + 0.75, panelW - 1.5, panelH - 1.5);

    {
      const now = performance.now() / 1000;
      const hg = ctx.createLinearGradient(px, py, px, py + pad + titleH);
      hg.addColorStop(0, accentA(0.22)); hg.addColorStop(1, accentA(0));
      ctx.fillStyle = hg; ctx.fillRect(px + 1.5, py + 1.5, panelW - 3, pad + titleH);
      ctx.save();
      ctx.beginPath(); ctx.rect(px, py, panelW, panelH); ctx.clip();
      const sy0 = py + ((now * 46) % (panelH + 60)) - 30;
      const sg = ctx.createLinearGradient(0, sy0 - 30, 0, sy0 + 30);
      sg.addColorStop(0, accentA(0)); sg.addColorStop(0.5, accentA(0.07)); sg.addColorStop(1, accentA(0));
      ctx.fillStyle = sg; ctx.fillRect(px, sy0 - 30, panelW, 60);
      ctx.fillStyle = theme.accent; ctx.fillRect(px, py, panelW, 3);
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillRect(px + ((now * 0.55) % 1) * (panelW + 120) - 120, py, 120, 3);
      ctx.restore();
      drawCornerBrackets(px, py, panelW, panelH, 18, theme.accent, 2);
      ctx.save(); ctx.shadowColor = theme.accent; ctx.shadowBlur = 16;

      ctx.restore();
    }
    txt('HOW TO PLAY', px + pad, py + pad + 10, 20, theme.text, 'left', '700', 4);
    ctx.fillStyle = theme.accent;
    ctx.fillRect(px + pad, py + pad + 26, 40, 2);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(px + pad + 44 + ((performance.now() / 1000 * 70) % 90), py + pad + 26, 6, 2);

    if (asOverlay) {
      const cs = 22;
      const cx = px + panelW - pad - cs;
      const cyS = py + pad + 2;
      const closeHover = mouse.x >= cx && mouse.x <= cx + cs && mouse.y >= cyS && mouse.y <= cyS + cs;
      ctx.strokeStyle = closeHover ? theme.accent : theme.textDim;
      ctx.lineWidth = 1.4;
      ctx.strokeRect(cx + 0.5, cyS + 0.5, cs - 1, cs - 1);
      if (closeHover) { ctx.fillStyle = accentA(0.12); ctx.fillRect(cx + 1, cyS + 1, cs - 2, cs - 2); }

      ctx.beginPath();

      ctx.moveTo(ccx + 4, ccy - 4); ctx.lineTo(ccx - 4, ccy + 4);
      ctx.strokeStyle = closeHover ? theme.accent : theme.text;
      ctx.lineWidth = 1.7; ctx.lineCap = 'round'; ctx.stroke();
      instructionsHitAreas.push({ x: cx - 2, y: cyS - 2, w: cs + 4, h: cs + 4, action: 'closeHelp' });
    }

    let cy = py + pad + titleH;
    let rowIdx = 0;
    for (const item of wrapped) {
      const rh = Math.max(1, item.lines.length) * lineH;
      const col = HELP_COLORS[item.label] || theme.accent;
      const rowRect = { x: px + 12, y: cy - 6, w: panelW - 24, h: rh + rowGap - 2 };
      const rowHover = pointInRect(mouse.x, mouse.y, rowRect);
      ctx.fillStyle = rowHover ? accentA(0.14) : (rowIdx % 2 === 0 ? accentA(0.06) : fgA(0.025));
      ctx.fillRect(rowRect.x, rowRect.y, rowRect.w, rowRect.h);
      ctx.fillStyle = col; ctx.globalAlpha = rowHover ? 1 : 0.75;
      ctx.fillRect(rowRect.x, rowRect.y, 3, rowRect.h); ctx.globalAlpha = 1;
      drawHelpIcon(item.label, px + pad + 14, cy + 6, col, performance.now() / 1000 + rowIdx * 0.4);
      txt(item.label, px + pad + 34, cy + 6, 11, rowHover ? col : theme.accent, 'left', '700', 1);
      for (let i = 0; i < item.lines.length; i++) {
        txt(item.lines[i], px + pad + labelW + 14, cy + 6 + i * lineH, 11, theme.text, 'left', '400', 0.3);
      }
      cy += rh + rowGap;
      rowIdx++;
    }

    const bw = 200, bh = 40;
    const bx = px + (panelW - bw) / 2;
    const by = py + panelH - pad - bh;
    const hover = pointInRect(mouse.x, mouse.y, { x: bx, y: by, w: bw, h: bh });
    const pulse = 0.7 + 0.3 * Math.sin(performance.now() / 500);

    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = theme.accentText;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);

    instructionsHitAreas.push({ x: bx, y: by, w: bw, h: bh, action: asOverlay ? 'closeHelp' : 'begin' });
  }

  /* ================================================================ */
  /*  DRAW: SETTINGS                                                   */
  /* ================================================================ */
  function drawSettings() {
    settingsHitAreas = [];
    sliderRects = {};

    ctx.fillStyle = theme.isDark ? 'rgba(0,0,0,0.78)' : 'rgba(17,17,20,0.48)';
    ctx.fillRect(0, 0, W, H);

    const pad = 26;
    const panelW = Math.min(560, W - 40);

    const headerH = 46;
    const themeLabelH = 22;
    const swR = 16, swGap = 12;
    const swRows = 2;
    const swatchH = swRows * swR * 2 + (swRows - 1) * swGap;
    const sectionGap = 22;
    const volLabelH = 22;
    const sliderH = 40;
    const gameplayLabelH = 22;
    const toggleH = 32;
    const numToggles = 5;
    const footerH = 44;

    const contentH =
      headerH +
      themeLabelH + swatchH + sectionGap +
      volLabelH + sliderH * 2 + sectionGap +
      gameplayLabelH + toggleH * numToggles + sectionGap +
      footerH;

    const panelH = pad * 2 + contentH;
    const px = (W - panelW) / 2;
    const py = Math.max(20, (H - panelH) / 2);
    settingsModalRect = { x: px, y: py, w: panelW, h: panelH };

    ctx.fillStyle = theme.modalBg;
    ctx.fillRect(px, py, panelW, panelH);
    ctx.strokeStyle = theme.panelBorder;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(px + 0.75, py + 0.75, panelW - 1.5, panelH - 1.5);

    drawCornerBrackets(px, py, panelW, panelH, 16, theme.accent, 2);

    let cy = py + pad;

    txt('SETTINGS', px + pad, cy + 10, 20, theme.text, 'left', '700', 4);
    ctx.fillStyle = theme.accent;
    ctx.fillRect(px + pad, cy + 28, 40, 2);

    const closeSize = 24;
    const closeX = px + panelW - pad - closeSize;
    const closeY = cy + 2;
    const closeHover = mouse.x >= closeX && mouse.x <= closeX + closeSize &&
                       mouse.y >= closeY && mouse.y <= closeY + closeSize;
    ctx.strokeStyle = closeHover ? theme.accent : theme.textDim;
    ctx.lineWidth = 1.4;
    ctx.strokeRect(closeX + 0.5, closeY + 0.5, closeSize - 1, closeSize - 1);
    if (closeHover) { ctx.fillStyle = accentA(0.12); ctx.fillRect(closeX + 1, closeY + 1, closeSize - 2, closeSize - 2); }
    const cxx = closeX + closeSize / 2, cyy = closeY + closeSize / 2;
    ctx.strokeStyle = closeHover ? theme.accent : theme.text;
    ctx.lineWidth = 1.7; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cxx - 4, cyy - 4); ctx.lineTo(cxx + 4, cyy + 4);
    ctx.moveTo(cxx + 4, cyy - 4); ctx.lineTo(cxx - 4, cyy + 4);
    ctx.stroke();
    settingsHitAreas.push({ x: closeX - 2, y: closeY - 2, w: closeSize + 4, h: closeSize + 4, action: 'close' });

    cy += headerH;

    drawSectionHeader(px + pad, cy + 8, panelW - pad * 2, 'THEME');
    cy += themeLabelH;

    const swCols = 7;
    const swCellW = swR * 2 + swGap;
    const swTotalW = swCols * swCellW - swGap;
    const swStartX = px + (panelW - swTotalW) / 2 + swR;
    const swStartY = cy + swR;

    for (let i = 0; i < THEMES.length; i++) {
      const th = THEMES[i];
      const col = i % swCols;
      const row = Math.floor(i / swCols);
      const scx = swStartX + col * swCellW;
      const scy = swStartY + row * (swR * 2 + swGap);
      const hovered = Math.hypot(mouse.x - scx, mouse.y - scy) <= swR + 3;
      const selected = i === themeIdx;

      ctx.beginPath(); ctx.arc(scx, scy, swR, 0, Math.PI * 2);
      ctx.fillStyle = th.bg; ctx.fill();
      ctx.beginPath(); ctx.arc(scx, scy, swR * 0.5, 0, Math.PI * 2);

      ctx.beginPath(); ctx.arc(scx, scy, swR, 0, Math.PI * 2);
      ctx.strokeStyle = selected ? theme.accent : (hovered ? theme.text : fgA(0.35));
      ctx.lineWidth = selected ? 2.5 : (hovered ? 1.8 : 1);
      ctx.stroke();

      settingsHitAreas.push({ x: scx - swR - 4, y: scy - swR - 4, w: (swR + 4) * 2, h: (swR + 4) * 2, action: 'theme', idx: i });

    cy += sliderH;
    drawSlider(px + pad, cy, panelW - pad * 2, 'sfxVolume', 'EFFECTS');
    cy += sliderH + sectionGap;

    drawSectionHeader(px + pad, cy + 8, panelW - pad * 2, 'GAMEPLAY');
    cy += gameplayLabelH;
    drawToggleRow(px + pad, cy, panelW - pad * 2, 'screenShake', 'SCREEN SHAKE'); cy += toggleH;
    drawToggleRow(px + pad, cy, panelW - pad * 2, 'showHints', 'ONBOARDING HINTS'); cy += toggleH;
    drawToggleRow(px + pad, cy, panelW - pad * 2, 'showGrid', 'DOT GRID BACKGROUND'); cy += toggleH;
    drawToggleRow(px + pad, cy, panelW - pad * 2, 'autoPause', 'AUTO-PAUSE ON TAB OUT'); cy += toggleH;
    drawToggleRow(px + pad, cy, panelW - pad * 2, 'showFps', 'SHOW FPS'); cy += toggleH + sectionGap;

    const btnH = 30;

    const by = cy;

    {
      const bx = px + pad;
