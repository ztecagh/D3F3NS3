<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#150a20; }
  canvas { display:block; cursor:crosshair; }
  * { -webkit-tap-highlight-color: transparent; user-select:none; }
  /* desktop-only gate: shown on phones / tablets and on very narrow windows */
  #deskOnly { display:none; position:fixed; inset:0; z-index:99; overflow:hidden; color:#e9e0ff; text-align:center;
    font-family:"Chakra Petch","Bahnschrift","DIN Alternate","Segoe UI",system-ui,sans-serif;
    background:radial-gradient(120% 80% at 50% 0%, #2a1650 0%, #150a20 55%, #0d0616 100%); }
  #deskOnly.on { display:flex; align-items:center; justify-content:center; }
  #deskOnly .grid { position:absolute; inset:0; opacity:.5;
    background-image:radial-gradient(rgba(176,108,255,.28) 1px, transparent 1.5px); background-size:26px 26px;
    -webkit-mask-image:radial-gradient(70% 60% at 50% 45%, #000 20%, transparent 100%); mask-image:radial-gradient(70% 60% at 50% 45%, #000 20%, transparent 100%); }
  #deskOnly .orb { position:absolute; width:10px; height:10px; border-radius:50%; background:#c76bff; opacity:.55; filter:blur(.3px);
    animation: dsFloat 9s ease-in-out infinite; }
  @keyframes dsFloat { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(18px,-34px) scale(1.5); } }
  @keyframes dsPulse { 0%,100% { opacity:.55; transform:scale(1); } 50% { opacity:1; transform:scale(1.04); } }
  @keyframes dsSweep { from { transform:translateX(-120%); } to { transform:translateX(320%); } }
  #deskOnly .card { position:relative; box-sizing:border-box; width:min(90vw, 440px); padding:34px 26px 28px; border-radius:18px;
    background:linear-gradient(180deg, rgba(36,20,68,.88), rgba(18,9,32,.92)); border:1.5px solid rgba(176,108,255,.55);
    box-shadow:0 0 0 1px rgba(255,255,255,.04) inset, 0 24px 80px rgba(120,60,220,.35); }
  #deskOnly .card::before { content:""; position:absolute; left:18px; right:18px; top:0; height:3px; border-radius:0 0 3px 3px; background:#b06cff; overflow:hidden; }
  #deskOnly .logo { font-size:clamp(34px, 11vw, 52px); font-weight:700; letter-spacing:.22em; margin:0 -0.22em 0 0; line-height:1; color:#c9a2ff;
    text-shadow:0 0 28px rgba(176,108,255,.6); }
  #deskOnly .tag { margin-top:8px; font-size:10px; letter-spacing:.38em; color:#8f7bc0; font-weight:600; }
  #deskOnly .rig { margin:26px auto 4px; width:150px; animation:dsPulse 3.2s ease-in-out infinite; }
  #deskOnly h1 { margin:18px 0 8px; font-size:17px; letter-spacing:.24em; font-weight:700; color:#fff; }
  #deskOnly p { margin:0 auto; max-width:330px; font-size:13.5px; line-height:1.6; color:#c3b4e6; font-weight:500; }
  #deskOnly .keys { display:flex; justify-content:center; gap:8px; margin:20px 0 4px; flex-wrap:wrap; }
  #deskOnly .keys span { padding:6px 11px; border-radius:7px; font-size:10.5px; letter-spacing:.14em; font-weight:700; color:#e9e0ff;
    border:1px solid rgba(176,108,255,.5); background:rgba(176,108,255,.12); box-shadow:0 2px 0 rgba(176,108,255,.35); }
  #deskOnly button { margin-top:22px; padding:13px 26px; border-radius:999px; border:1.5px solid #b06cff; background:rgba(176,108,255,.18); color:#fff;
    font:700 12px "Chakra Petch",system-ui,sans-serif; letter-spacing:.26em; cursor:pointer; transition:background .2s, transform .2s; }
  #deskOnly button:active { transform:scale(.97); }
  #deskOnly button.done { background:#b06cff; color:#150a20; }
  #deskOnly .foot { margin-top:16px; font-size:10px; letter-spacing:.22em; color:#7d6aa8; font-weight:600; }
  @media (prefers-reduced-motion: reduce) { #deskOnly .orb, #deskOnly .rig { animation:none; } }
  /* opening logo: fades in, holds, fades out over the game (any key or click skips it) */
  #logoSplash { position:fixed; inset:0; z-index:98; background:#000; display:flex; align-items:center; justify-content:center; opacity:1; transition:opacity .85s ease; cursor:default; }
  #logoSplash svg { width:min(76vmin, 640px); height:auto; opacity:0; transform:scale(.97); transition:opacity .4s ease, transform 1.4s cubic-bezier(.2,.6,.2,1); }
  #logoSplash.in svg { opacity:1; transform:scale(1); }
  #logoSplash.out { opacity:0; pointer-events:none; }
  @media (prefers-reduced-motion: reduce) { #logoSplash, #logoSplash svg { transition-duration:.01s; } }

<script>
(function () {
  var el = document.getElementById('logoSplash');
  if (!el) return;
  window.__logoShowing = true;

    if (!window.__logoShowing) return;
    window.__logoShowing = false; el.className = 'in out';   /* the logo stays lit and fades with the black, together */

  /* while the logo is up, the first key or click only dismisses it: keep it away from the game underneath */
  window.addEventListener('keydown', function (e) { if (window.__logoShowing) { e.stopImmediatePropagation(); e.preventDefault(); done(); } }, true);
  el.addEventListener('mousedown', done);
  requestAnimationFrame(function () { requestAnimationFrame(function () { el.className = 'in'; }); });
  setTimeout(done, 1250);
})();

<script>
(function () {
  var box = document.getElementById('deskOnly'), title = document.getElementById('dsTitle'), body = document.getElementById('dsBody'), btn = document.getElementById('dsCopy');
  function touchDevice() {
    var ua = navigator.userAgent || '';
    if (/Android|iPhone|iPad|iPod|Mobile|Silk|CriOS.*Mobile/i.test(ua)) return true;
    return (navigator.maxTouchPoints || 0) > 1 && window.matchMedia && matchMedia('(pointer: coarse)').matches && !matchMedia('(pointer: fine)').matches;
  }
  function check() {
    var touch = touchDevice(), narrow = window.innerWidth < 560;
    window.__deskBlocked = touch || narrow;
    box.className = window.__deskBlocked ? 'on' : '';
    if (touch) { title.textContent = 'BUILT FOR DESKTOP'; body.textContent = 'D3F3NS3 is played with a keyboard and mouse. Open this page on a computer to defend your turrets.'; btn.style.display = ''; }
    else if (narrow) { title.textContent = 'WINDOW TOO NARROW'; body.textContent = 'Widen your browser window to at least 560 pixels wide to play.'; btn.style.display = 'none'; }
  }
  btn.addEventListener('click', function () {
    var url = location.href, ok = function () { btn.textContent = 'LINK COPIED  ✓'; btn.className = 'done'; setTimeout(function () { btn.textContent = 'COPY LINK'; btn.className = ''; }, 2200); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok, function () {});
    else { var ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) {} document.body.removeChild(ta); }
  });
  window.addEventListener('resize', check); check();
})();
</script>
<script>
(function () {
  'use strict';

  const cvs = document.getElementById('c');
  let ctx = cvs.getContext('2d');
  const MONO = '"Chakra Petch", "Bahnschrift", "DIN Alternate", "Segoe UI", system-ui, sans-serif';
  try { if (document.fonts && document.fonts.load) ['400', '500', '600', '700'].forEach(w => document.fonts.load(w + ' 12px "Chakra Petch"')); } catch (e) {}

  let W = 0, H = 0, DPR = 1;
  let dotPattern = null;

  /* ================================================================ */
  /*  AUDIO                                                            */
  /* ================================================================ */
  let sfxBus = null, sfxActive = 0;
  const sfxStarts = [];
  let actx = null, masterGain = null, noiseBuffer = null, musicGain = null, moodLP = null, moodOut = null, droneGain = null, droneOsc = [];
  let bossMood = 0, bossWas = false, lastMoodT = 0, bossBeatNext = 0, bossBeatN = 0;
  const soundCooldown = {};

  const settings = {
    masterVolume: 0.85,
    sfxVolume: 0.72,
    screenShake: true,
    autoPause: true,
    adaptive: true,
    showHints: true,
    showFps: false,
    showGrid: true,
    showAggro: true,
    musicVolume: 0.5,
    musicTrack: 0,
    musicAuto: false,
    potato: false,
  };
  try { settings.potato = localStorage.getItem('d3f3ns3_potato') === '1'; } catch (e) {}
  try { settings.showAggro = localStorage.getItem('d3f3ns3_aggro') !== '0'; } catch (e) {}   /* the dashed ring that shows how far enemies notice you */

  function applyMasterVolume() { if (masterGain) masterGain.gain.value = settings.masterVolume; }

  function initAudio() {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      masterGain = actx.createGain();
      masterGain.gain.value = settings.masterVolume;
      /* gentle bus limiter: glues the mix and keeps big fights from clipping */
      const comp = actx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 4;
      comp.attack.value = 0.004; comp.release.value = 0.22;
      masterGain.connect(comp); comp.connect(actx.destination);
      buildSfxBus();
      musicGain = actx.createGain(); musicGain.gain.value = 0;
      /* music runs through a mood filter so boss waves can darken every track the same way */
      moodLP = actx.createBiquadFilter(); moodLP.type = 'lowpass'; moodLP.frequency.value = 20000; moodLP.Q.value = 0.9;
      moodOut = actx.createGain(); moodOut.gain.value = 1;
      musicGain.connect(moodLP); moodLP.connect(moodOut); moodOut.connect(masterGain);
      /* boss drone: a low minor-second cluster with a tritone and a slow tremolo, silent until the mood rises */
      droneGain = actx.createGain(); droneGain.gain.value = 0;
      const dlp = actx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 520; dlp.Q.value = 1.1;
      const dTrem = actx.createGain(); dTrem.gain.value = 0.75;
      dlp.connect(dTrem); dTrem.connect(droneGain); droneGain.connect(moodOut);
      droneOsc = [['sawtooth', 1, 0.5], ['sawtooth', 16 / 15, 0.34], ['sine', Math.SQRT2, 0.24]].map(([type, ratio, vol]) => {
        const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = 55 * ratio; g.gain.value = vol; o.connect(g); g.connect(dlp); o.start(); o._ratio = ratio; return o;
      });
      const lfo = actx.createOscillator(), lg = actx.createGain(); lfo.frequency.value = 0.17; lg.gain.value = 0.25; lfo.connect(lg); lg.connect(dTrem.gain); lfo.start();
      const len = Math.floor(actx.sampleRate * 0.25);
      noiseBuffer = actx.createBuffer(1, len, actx.sampleRate);
      const d = noiseBuffer.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { actx = null; }
  }
  /* Every effect goes through one bus with its own fast limiter, so a crowded fight cannot add up past a ceiling. A voice budget on top drops the small,
     routine sounds (a hit, a shot) when too many are already playing or too many started in the last 80 ms; big one-off events always play. */
  function buildSfxBus() {
    sfxBus = actx.createGain(); sfxBus.gain.value = 1;
    const sc = actx.createDynamicsCompressor();
    sc.threshold.value = -24; sc.knee.value = 10; sc.ratio.value = 8; sc.attack.value = 0.003; sc.release.value = 0.16;
    /* a Web Audio compressor adds make-up gain (about 3.3x at this setting): the trim after it gives small sounds back their old level, so only stacks come down */
    const trim = actx.createGain(); trim.gain.value = 0.30;
    sfxBus.connect(sc); sc.connect(trim); trim.connect(masterGain);
    sfxActive = 0; sfxStarts.length = 0;
  }
  const SFX_MAX_ACTIVE = 22, SFX_MAX_BURST = 10;
  function sfxGate(vol) {
    if (vol >= 0.1) return true;
    const now = performance.now();
    while (sfxStarts.length && now - sfxStarts[0] > 80) sfxStarts.shift();
    if (sfxActive >= SFX_MAX_ACTIVE || sfxStarts.length >= SFX_MAX_BURST) return false;
    sfxStarts.push(now); return true;
  }
  function canPlay(name, ms) {
    const now = performance.now();
    if (soundCooldown[name] && now - soundCooldown[name] < ms) return false;
    soundCooldown[name] = now; return true;
  }
  /* mix: the ear is far more sensitive between 1 and 5 kHz, so higher sounds are turned down rather than filtered; sfxTrim lets a single sound be balanced */
  let sfxTrim = 1;
  const toneWeight = (f, fe) => { const g = fe ? Math.sqrt(f * Math.max(1, fe)) : f; return g <= 700 ? 1 : Math.max(0.4, Math.pow(700 / g, 0.5)); };
  const noiseWeight = f => f <= 1500 ? 1 : Math.max(0.5, Math.pow(1500 / f, 0.45));
  function toneAt(freq, dur, type, vol, freqEnd, delay) {
    if (!actx || !sfxGate(vol)) return;
    const t0 = actx.currentTime + (delay || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol * settings.sfxVolume * sfxTrim * toneWeight(freq, freqEnd), t0 + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(sfxBus || masterGain);
    sfxActive++; o.onended = () => { sfxActive = Math.max(0, sfxActive - 1); };
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noiseAt(dur, vol, freq, q, delay) {
    if (!actx || !noiseBuffer || !sfxGate(vol)) return;
    const t0 = actx.currentTime + (delay || 0);
    const src = actx.createBufferSource();
    src.buffer = noiseBuffer;
    const f = actx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1;
    const g = actx.createGain();
    g.gain.setValueAtTime(vol * settings.sfxVolume * sfxTrim * noiseWeight(freq), t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(sfxBus || masterGain);
    sfxActive++; src.onended = () => { sfxActive = Math.max(0, sfxActive - 1); };
    src.start(t0); src.stop(t0 + dur + 0.02);
  }

  function sndShoot() { if (!canPlay('shoot', 55)) return; toneAt(760 * (0.9 + Math.random() * 0.2), 0.055, 'triangle', 0.05, 340); noiseAt(0.03, 0.03, 2600, 3); }
  function sndLaser() { if (!canPlay('laser', 70)) return; toneAt(1700, 0.08, 'sawtooth', 0.04, 420); toneAt(3400, 0.04, 'sine', 0.018, 1700, 0.005); }
  function sndPrick() { if (!canPlay('prick', 150)) return; toneAt(560, 0.05, 'square', 0.035, 240); noiseAt(0.03, 0.025, 1800, 2); toneAt(180, 0.08, 'triangle', 0.03, 120, 0.02); }
  function sndHit()   { if (!canPlay('hit', 48)) return; noiseAt(0.05, 0.06, 1700, 2.4); toneAt(180, 0.045, 'square', 0.03, 90); }
  function sndCrit()  { toneAt(1400, 0.08, 'square', 0.07, 700); toneAt(2100, 0.06, 'triangle', 0.055, 1100, 0.02); }
  function sndDeath() { if (!canPlay('death', 56)) return; toneAt(320, 0.14, 'square', 0.075, 70); noiseAt(0.09, 0.05, 900, 1.2); }
  function sndBruteDeath() { duckMusic(0.8); toneAt(180, 0.22, 'sawtooth', 0.09, 50); toneAt(90, 0.3, 'square', 0.07, 40, 0.04); noiseAt(0.15, 0.07, 700, 1); }
  function sndPlace() { toneAt(180, 0.11, 'triangle', 0.13, 430); noiseAt(0.05, 0.04, 500, 2); }
  function sndUpgrade(lv) { const k = 1 + Math.min(14, lv || 0) * 0.04; toneAt(520 * k, 0.07, 'square', 0.08, 520 * k); toneAt(780 * k, 0.09, 'square', 0.08, 780 * k, 0.06); toneAt(1040 * k, 0.14, 'triangle', 0.075, 1040 * k, 0.13); noiseAt(0.06, 0.03, 4000, 3, 0.02); }
  function sndWaveClear() { [523, 659, 784, 1047].forEach((f, i) => toneAt(f, 0.16, 'triangle', 0.075, f, i * 0.07)); toneAt(262, 0.5, 'sine', 0.06, 262, 0.05); }
  function sndTurretDown() { duckMusic(0.7); toneAt(200, 0.3, 'sawtooth', 0.09, 45); toneAt(120, 0.35, 'square', 0.07, 35, 0.03); noiseAt(0.22, 0.09, 600, 0.9); noiseAt(0.1, 0.05, 2500, 2, 0.05); }
  function sndTurretHit() { if (!canPlay('thit', 260)) return; toneAt(115, 0.06, 'square', 0.04, 70); noiseAt(0.04, 0.025, 900, 2); }
  function sndWarn() { if (!canPlay('warn', 700)) return; toneAt(880, 0.07, 'square', 0.05, 880); toneAt(880, 0.07, 'square', 0.05, 880, 0.12); }
  function sndStreak(n) { const b = 500 + Math.min(6, n) * 90; toneAt(b, 0.07, 'triangle', 0.08, b); toneAt(b * 1.25, 0.07, 'triangle', 0.08, b * 1.25, 0.06); toneAt(b * 1.5, 0.12, 'triangle', 0.08, b * 1.5, 0.12); toneAt(b * 2, 0.16, 'sine', 0.06, b * 2, 0.19); }
  function sndHeartbeat() { toneAt(70, 0.12, 'sine', 0.13, 45); toneAt(58, 0.15, 'sine', 0.11, 38, 0.15); }
  function sndSpawn() { if (!canPlay('spawn', 260)) return; noiseAt(0.07, 0.016, 700, 1.4); toneAt(140, 0.08, 'sine', 0.016, 90); }
  function sndField() { if (!canPlay('field', 380)) return; toneAt(1800 + Math.random() * 900, 0.05, 'sawtooth', 0.02, 700); noiseAt(0.05, 0.02, 3500, 4); }
  function sndDeflect() { if (!canPlay('deflect', 110)) return; toneAt(700, 0.07, 'triangle', 0.04, 1000); noiseAt(0.025, 0.02, 2200, 2); }
  function sndShieldHit() { if (!canPlay('shit', 140)) return; toneAt(1300, 0.06, 'sine', 0.045, 800); noiseAt(0.03, 0.015, 3000, 3); }
  function sndShieldBreak() { toneAt(1800, 0.18, 'sawtooth', 0.06, 200); noiseAt(0.2, 0.07, 3200, 1.5); }
  function sndShieldUp() { toneAt(600, 0.06, 'sine', 0.05, 600); toneAt(1200, 0.1, 'sine', 0.05, 1200, 0.05); }
  function sndRegen() { toneAt(700, 0.09, 'sine', 0.05, 700); toneAt(1050, 0.12, 'sine', 0.05, 1050, 0.07); }
  function sndThorn() { if (!canPlay('thorn', 160)) return; toneAt(620, 0.04, 'square', 0.035, 380); noiseAt(0.03, 0.02, 4500, 3); }
  function sndThornPulse() { toneAt(140, 0.2, 'sawtooth', 0.07, 50); noiseAt(0.12, 0.05, 1200, 1); }
  function sndDash() { toneAt(300, 0.14, 'sawtooth', 0.06, 900); noiseAt(0.12, 0.05, 2200, 1.2); toneAt(220, 0.2, 'triangle', 0.05, 440, 0.04); }
  function sndFireball() { noiseAt(0.18, 0.05, 900, 0.8); toneAt(320, 0.2, 'sawtooth', 0.04, 140); }
  function sndIgnitePlayer() { noiseAt(0.25, 0.08, 1400, 1); toneAt(500, 0.15, 'square', 0.05, 200); }
  function sndBurnTick() { if (!canPlay('btick', 250)) return; noiseAt(0.05, 0.03, 2600, 3); }
  function sndHeal() { if (!canPlay('mheal', 260)) return; toneAt(880, 0.08, 'sine', 0.045, 880); toneAt(1320, 0.1, 'sine', 0.04, 1320, 0.06); }
  function sndLungeWind() { if (!canPlay('lwind', 200)) return; toneAt(200, 0.55, 'sawtooth', 0.045, 700); }
  function sndLungeGo() { toneAt(900, 0.2, 'sawtooth', 0.06, 200); noiseAt(0.15, 0.06, 1800, 1); }
  function sndLungeHit() { duckMusic(0.75); toneAt(90, 0.22, 'square', 0.12, 40); noiseAt(0.12, 0.09, 500, 1); }
  function sndDeploy() { toneAt(180, 0.12, 'square', 0.07, 100); toneAt(330, 0.08, 'square', 0.05, 330, 0.1); toneAt(660, 0.1, 'triangle', 0.05, 660, 0.18); }
  function sndEnemyShot() { if (!canPlay('eshot', 120)) return; toneAt(520, 0.06, 'square', 0.035, 240); }
  function sndPickup(k) {
    if (k === 'cash') { toneAt(1200, 0.06, 'square', 0.05, 1200); toneAt(1800, 0.09, 'square', 0.05, 1800, 0.05); }
    else if (k === 'repair') { toneAt(700, 0.08, 'triangle', 0.07, 900); noiseAt(0.04, 0.03, 3000, 3); toneAt(1050, 0.1, 'triangle', 0.06, 1050, 0.06); }
    else { toneAt(660, 0.1, 'sine', 0.07, 660); toneAt(880, 0.1, 'sine', 0.07, 880, 0.08); toneAt(1320, 0.16, 'sine', 0.06, 1320, 0.16); }
  }
  function sndBossWind() { toneAt(70, 0.9, 'sawtooth', 0.09, 160); noiseAt(0.9, 0.04, 300, 0.7); }
  function sndStomp() { duckMusic(0.6); toneAt(90, 0.4, 'square', 0.16, 30); noiseAt(0.3, 0.12, 400, 0.8); toneAt(45, 0.5, 'sine', 0.14, 25); }
  function sndBossDeath() { duckMusic(0.55); toneAt(160, 0.8, 'sawtooth', 0.12, 25); noiseAt(0.6, 0.12, 500, 0.7); [392, 523, 659, 784, 1047].forEach((f, i) => toneAt(f, 0.2, 'triangle', 0.07, f, 0.5 + i * 0.09)); }
  function sndSpeed(n) { toneAt(500 + n * 180, 0.05, 'square', 0.05, 500 + n * 180); toneAt(700 + n * 220, 0.05, 'square', 0.05, 700 + n * 220, 0.05); }
  function sndHover() { if (!canPlay('hover', 50)) return; toneAt(1500, 0.02, 'sine', 0.02, 1500); }
  function sndDashReady() { toneAt(880, 0.05, 'sine', 0.035, 880); toneAt(1320, 0.06, 'sine', 0.03, 1320, 0.05); }

  /* ---- generative music: chord pad + bass + arpeggio that swells with the action ---- */
  let musicNext = 0, musicStep = 0, musicI = 0.1, musicDuck = 1;
  const duckMusic = d => { musicDuck = Math.min(musicDuck, d); };   /* big hits push the music down for a moment */
  const M_ROOTS = [110.0, 87.31, 130.81, 98.0];
  const M_STEP = 60 / 84 / 4;
  function mtone(freq, t0, dur, type, vol, attack) {
    if (!actx || !musicGain) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + (attack || 0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(musicGain); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function mnoise(t0, dur, vol, freq) {
    if (!actx || !noiseBuffer || !musicGain) return;
    const src = actx.createBufferSource(); src.buffer = noiseBuffer;
    const f = actx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = freq;
    const g = actx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(musicGain); src.start(t0); src.stop(t0 + dur + 0.02);
  }
  function musicStepAt(step, t0) {
    const bar = Math.floor(step / 16), chord = Math.floor(bar / 2) % 4, s16 = step % 16;
    const root = M_ROOTS[chord], third = chord === 0 ? 3 : 4;
    if (step % 32 === 0) for (const iv of [0, 7, 12 + third]) mtone(root * 2 * Math.pow(2, iv / 12), t0, M_STEP * 31, 'triangle', 0.03, 1.4);
    if (s16 % 4 === 0 && (musicI > 0.15 || s16 === 0)) mtone(root, t0, M_STEP * 3.2, 'sine', 0.06 + 0.03 * musicI, 0.01);
    const pat = [0, 2, 4, 2, 5, 4, 2, 1], tones = [0, 7, 12, 12 + third, 19, 24];
    if (musicI > 0.25 && s16 % 2 === 0 && Math.random() < 0.35 + musicI * 0.55)
      mtone(root * 2 * Math.pow(2, tones[pat[(s16 / 2) % 8]] / 12), t0, M_STEP * 1.8, 'square', 0.011 + 0.011 * musicI, 0.004);
    if (musicI > 0.5 && s16 % 4 === 2) mnoise(t0, 0.05, 0.02 + 0.02 * musicI, 7000);
    if (musicI > 0.7 && s16 % 8 === 0) mtone(60, t0, 0.14, 'sine', 0.09, 0.005);
  }

  /* ---- extra voices for the calm tracks ---- */
  const hz = (base, semis) => base * Math.pow(2, semis / 12);
  /* warm tone: oscillator(s) through a lowpass; detune > 0 adds a second reed for an accordion-like chorus */
  function mwarm(freq, t0, dur, type, vol, attack, cutoff, detune, dest) {
    if (!actx || !musicGain) return;
    const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff || 1400; f.Q.value = 0.6;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + (attack || 0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    f.connect(g); g.connect(dest || musicGain);
    const oscs = detune ? [-detune, detune] : [0];
    for (const d of oscs) {
      const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t0); o.detune.value = d;
      o.connect(f); o.start(t0); o.stop(t0 + dur + 0.05);
    }
  }
  /* pitched drum: kick, conga tones */
  function mdrum(f0, f1, t0, dur, vol, type) {
    if (!actx || !musicGain) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur * 0.8);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(musicGain); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  /* band-passed noise with a soft attack: shakers, the cumbia guacharaca scrape, vinyl dust */
  function mscrape(t0, dur, vol, freq, q, attack) {
    if (!actx || !noiseBuffer || !musicGain) return;
    const src = actx.createBufferSource(); src.buffer = noiseBuffer; src.loop = true;
    const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1.2;

  /* New enemy types are introduced every other wave at most, with breather waves in between. */

  function composeWave(waveNum) {
    const dd = D();
    const total = Math.round((6 + waveNum * 3) * dd.count * dir.mod.count);
    let grunts = total;
    let sprinters = 0;
    let brutes = 0;

    if (waveNum >= 3) {
      sprinters = Math.floor(total * (waveNum >= 8 ? 0.32 : 0.22));
      grunts = total - sprinters;
    }
    if (waveNum >= 5) {
      brutes = Math.floor(total * (waveNum >= 10 ? 0.25 : 0.15));
      grunts = total - sprinters - brutes;
    }
    const sp = dd.special * dir.mod.special;
    const cap = (n, f) => Math.max(0, Math.min(n, Math.ceil(total * f)));
    const grow = (intro, k, f) => waveNum >= intro + dir.introShift ? cap(Math.max(1, Math.floor((waveNum - intro + 1) * k * sp + 0.5)), f) : 0;
    const lungers = grow(INTRO.lunger, 0.6, 0.16);
    const spies   = grow(INTRO.spy, 0.35, 0.08);
    const pyros   = grow(INTRO.pyro, 0.5, 0.12);
    let medics    = grow(INTRO.medic, 0.4, 0.10);
    const trojans = grow(INTRO.trojan, 0.35, 0.09);
    const mortars = grow(INTRO.mortar, 0.3, 0.07);
    const snipers = grow(INTRO.sniper, 0.25, 0.06);
    const drills  = grow(INTRO.drill, 0.35, 0.09);
    const plateds = grow(INTRO.plated, 0.5, 0.12);
    const splitters = grow(INTRO.splitter, 0.4, 0.10);
    const rangers = Math.min(3, grow(INTRO.ranger, 0.25, 0.06));
    const drones = waveNum >= INTRO.drone + dir.introShift ? Math.min(6, 2 + Math.floor((waveNum - INTRO.drone) / 4)) : 0;
    let alchs = grow(INTRO.alchemist, 0.2, 0.05);
    /* one support type per wave: Medics on even waves, Alchemists on odd ones */
    if (waveNum >= INTRO.alchemist + dir.introShift) { if (waveNum % 2 === 1) medics = 0; else alchs = 0; }
    const bosses = (waveNum >= 10 && waveNum % 5 === 0) ? 1 + Math.floor((waveNum - 10) / 15) : 0;
    grunts = Math.max(0, grunts - lungers - pyros - medics - trojans - spies - mortars - snipers - drills - plateds - splitters - rangers - drones - alchs - bosses);
    let flavor = bosses ? 'BOSS' : null;
    const isIntro = Object.values(INTRO).indexOf(waveNum) !== -1;
    if (waveNum >= 4 && !isIntro && waveNum % 5 !== 0) {
      if (waveNum % 3 === 1 && sprinters > 0) { const sh = Math.floor(grunts * 0.5); sprinters += sh; grunts -= sh; flavor = 'RUSH'; }
      else if (waveNum % 3 === 2 && brutes > 0) { const sh = Math.floor(grunts * 0.4); brutes += sh; grunts -= sh; flavor = 'HEAVY'; }
    }

    const arr = [];
    for (let i = 0; i < grunts; i++) arr.push('grunt');
    for (let i = 0; i < sprinters; i++) arr.push('sprinter');
    for (let i = 0; i < brutes; i++) arr.push('brute');
    for (let i = 0; i < lungers; i++) arr.push('lunger');
    for (let i = 0; i < pyros; i++) arr.push('pyro');
    for (let i = 0; i < medics; i++) arr.push('medic');
    for (let i = 0; i < trojans; i++) arr.push('trojan');
    for (let i = 0; i < mortars; i++) arr.push('mortar');
    for (let i = 0; i < snipers; i++) arr.push('sniper');
    for (let i = 0; i < drills; i++) arr.push('drill');
    for (let i = 0; i < spies; i++) arr.push('spy');
    for (let i = 0; i < plateds; i++) arr.push('plated');
    for (let i = 0; i < splitters; i++) arr.push('splitter');
    for (let i = 0; i < rangers; i++) arr.push('ranger');
    for (let i = 0; i < drones; i++) arr.push('drone');
    for (let i = 0; i < alchs; i++) arr.push('alchemist');

    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    if (bosses) arr.length = Math.max(6, Math.ceil(arr.length * 0.45));   /* escorts: the boss arrives with a supporting wave */
    for (let i = 0; i < bosses; i++) arr.unshift('boss');
    arr.flavor = flavor;
    return arr;

  /* ---- WEB: a hit ties the target to its nearest free neighbour. Strands last a few seconds (a re-hit refreshes them) and share part of every

    if (mine >= eff.webLinks) { for (const w of webs) if (w.a === z || w.b === z) w.t = Math.max(w.t, eff.webLife); return; }

  function sndWeb() { if (!canPlay('webtie', 90)) return; toneAt(520, 0.06, 'sine', 0.03, 760); }

  /* The strands look like small orb webs: two bowed rails with rungs between them, a taut centre thread with a glint running along it, and dew drops
     where thread meets rail. Under tension (pulling levels, or stretched close to the limit) they straighten and hum. Each tied enemy is wrapped in a

  function drawWebs() {

    const silver = dark ? '228,222,248' : '96,88,140', glow = dark ? '255,255,255' : '255,255,255';

      const at = (k, u) => { const c = rail(k), v = 1 - u; return [v * v * a.x + 2 * v * u * c.cx + u * u * b.x, v * v * a.y + 2 * v * u * c.cy + u * u * b.y]; };

  function doSplash(z, dmg, turret, radius, mult) {

  function linkEcho(src, tz) {

      if (Math.hypot(tz.x - L.x, tz.y - L.y) > L.eff.range * 1.3) continue;
      const a = Math.atan2(tz.y - L.y, tz.x - L.x);

  function fireBullets(t, target) {

    t.angle = ang;
    const st = tStats(t.level);

    for (let k = 0; k < nB; k++) {
      /* bullet 0 flies straight at the target; extras fan out to alternating sides */

  function fireGunAt(target, type) {
    if (gunLocked()) { sndDenied(); flashMsg('SACRI-GUN OVERHEATED  ·  ' + Math.ceil(dir.gunLockUntil - gameTime) + 's', '#e04a3a'); return; }
    if (type === 'enemy' && TR('w_k_iron')) { sndDenied(); flashMsg('IRON COURIER PERK  ·  THE GUN CAN ONLY HEAL TURRETS', '#c0392b'); return; }

      for (const t of turrets) {
        if (Math.hypot(t.x - player.x, t.y - player.y) > 150) continue;

    dir.gunShots = dir.gunShots.filter(ts => gameTime - ts < DIRC.bloodWindow); dir.gunShots.push(gameTime);

      sx: player.x, sy: player.y, x: player.x, y: player.y,

  function applyGunEffect(s) {
    if (s.targetType === 'enemy') {
      const z = s.target;
      if (!z || z.hp <= 0 || zombies.indexOf(z) === -1) { burst(s.x, s.y, 6, '#c76bff', 90, 1.6); return; }
      /* Bosses can't be one-shot: the gun deals a slice of max HP instead */

        const d = z.maxHp * GUN_BOSS_PCT;
        z.hp -= d; z.hit = 1;
        burst(z.x, z.y, 18, '#c76bff', 200, 2.6);
        addFloatText(z.x, z.y - z.r - 10, '-' + Math.round(d), '#c76bff', 15);
        sndGunKill();
        if (z.hp > 0) return;
        z.hp = 0;
      }
      z.gunKilled = true; z.hp = 0; z.hit = 1;
      burst(z.x, z.y, 26, '#c76bff', 260, 3);
      burst(z.x, z.y, 12, '#ffffff', 160, 2);

      sndGunHeal();

  function addModifier(t, type) {
    if (!MOD_DEFS[type]) return;
    const clash = modClash(t, type);
    if (clash) { sndDenied(); flashMsg(MOD_DEFS[type].name + ' WON’T WORK WITH ' + MOD_DEFS[clash].name, '#c0392b'); return; }
    const slots = slotsFor(t);
    if (usedSlots(t) >= slots) { sndDenied(); flashMsg('NO FREE MODIFIER SLOT  \u00b7  UPGRADE THE TURRET FOR MORE', '#c0392b'); return; }
    const cost = modCostFor(t, type);
    if (money < cost) { sndDenied(); flashMsg('NOT ENOUGH CASH  \u00b7  NEED $' + cost, '#c0392b'); return; }
    money -= cost; runS.cashSpent += cost;
    t.invested += cost;
    t.paid = t.paid || {}; (t.paid[type] = t.paid[type] || []).push(cost);
    tree.notesReady = false;
    if (!tree.schools[MOD_SCHOOL[type]]) { tree.schools[MOD_SCHOOL[type]] = true; addFloatText(t.x, t.y - 46, MOD_TABS[MOD_SCHOOL[type]].name + ' STRIP OPEN  ·  [' + kl('tree') + ']', GOLD, 10); }
    t.mods[type] = (t.mods[type] || 0) + 1;

    const c = MOD_DEFS[type];
    burst(t.x, t.y, 14, c.color, 100, 2);

    sndAddMod(t.mods[type]);

  function reforgeModifier(t, type) {
    if (!t || !t.mods[type]) return;
    if (!betweenWaves && gameTime < (t.reforgeAt || 0)) { sndDenied(); flashMsg('REFORGE ON COOLDOWN  \u00b7  WAIT A MOMENT', '#c0392b'); return; }
    /* Refund what this level actually cost, not the current slot price */
    const stack = t.paid && t.paid[type];
    const paid = stack && stack.length ? stack.pop()
      : Math.round(modifierCost({ mods: Object.assign({}, t.mods, { [type]: t.mods[type] - 1 }) }) * (MOD_TIER[type] || 1) / 5) * 5;
    const flagged = dir.w.lost > 0 || t.hp / t.maxHp < 0.5;

    t.mods[type]--; t.invested = Math.max(0, t.invested - paid); money += refund; runS.cashSpent -= refund;
    if (t.mods[type] < 4 && t.keys) delete t.keys[type];

  function handleClick(x, y) {
    if (window.__deskBlocked) return;
    if (banner && state === 'play' && bannerX && pointInRect(x, y, bannerX)) { banner = null; bannerX = null; sndClose(); return; }
    if (ctrlView) { handleCtrlClick(x / ctrlScale(), y / ctrlScale()); return; }
    if (state === 'slots') { handleSlotsClick(x, y); return; }
    if (showingHelp) {
      for (const a of instructionsHitAreas) {
        if (pointInRect(x, y, a) && a.action === 'tab') { helpTab = a.idx; helpScroll = 0; sndSelect(); return; }
        if (pointInRect(x, y, a) && a.action === 'closeHelp') { showingHelp = false; sndClose(); return; }
      }
      if (!pointInRect(x, y, settingsModalRect)) { showingHelp = false; sndClose(); }
      return;
    }
    if (state === 'instructions') {
      for (const a of instructionsHitAreas) {
        if (pointInRect(x, y, a) && a.action === 'tab') { helpTab = a.idx; helpScroll = 0; sndSelect(); return; }
        if (pointInRect(x, y, a) && a.action === 'begin') {
          hasSeenInstructions = true;
          startGame();
          return;
        }
      }
      return;
    }
    if (state === 'menu') {
      for (const a of menuDiffHitAreas) {
        if (pointInRect(x, y, a)) { setDifficulty(a.key); return; }
      }
      for (const a of menuThemeHitAreas) {
        if (Math.hypot(x - a.cx, y - a.cy) <= a.r + 2) { setTheme(a.idx); sndSelect(); return; }
      }
      if (menuBtns.chip && pointInRect(x, y, menuBtns.chip)) { sndSelect(); goSlots(); return; }
      if (menuBtns.ctrl && pointInRect(x, y, menuBtns.ctrl)) { openControls('picker', 'menu'); return; }
      if (slotData && slotData.run) {
        if (menuBtns.newRun && pointInRect(x, y, menuBtns.newRun)) {
          if (performance.now() < menuConfirm) { slotData.run = null; saveNow(); menuConfirm = 0; if (!hasSeenInstructions) state = 'instructions'; else startGame(); }
          else { menuConfirm = performance.now() + 3000; sndSelect(); }
          return;
        }
        resumeRun(); return;
      }
      if (!hasSeenInstructions) { state = 'instructions'; return; }
      startGame();
      return;
    }
    if (codexOpen) { handleCodexClick(x, y); return; }
    if (treeOpen) { handleTreeClick(x, y); return; }
    if (settingsOpen) { handleSettingsClick(x, y); return; }
    if (pointInRect(x, y, settingsBtnRect())) { settingsOpen = true; sndSelect(); return; }
    if (state === 'dead') { if (deadReady() && pointInRect(x, y, deadBtnRect())) startGame(); return; }
    if (paused) {
      for (const a of pauseHitAreas) {
        if (pointInRect(x, y, a)) {
          if (a.action === 'resume') { paused = false; sndPause(); return; }
          if (a.action === 'saveexit') { saveAndExit(); return; }
          if (a.action === 'restart') { if (performance.now() < restartArm) { restartArm = 0; restartFromPause(); } else { restartArm = performance.now() + 3000; sndSelect(); } return; }
        }
      }

    if (addModFlash) { addModFlash.t += dt; if (addModFlash.t > 1.6) addModFlash = null; }

    if (banner) { banner.t += dt; if (banner.t > (banner.dur || 2.0)) banner = null; }
    spyAlertT += dt;
    dirTick(dt);
    if (discoveryToast) { discoveryToast.t += dt; if (discoveryToast.t > 5.5) discoveryToast = null; }
    if (spyAtk) { spyAtk.t += dt; if (spyAtk.t > 3.2 || zombies.indexOf(spyAtk.z) === -1 || !spyAtk.z.disguised) spyAtk = null; }
    if (!tut.kited && turrets.length) {
      let lur = false;
      for (const z of zombies) if (z.lured && !z.fixed) { lur = true; break; }
      if (lur && Math.hypot(player.vx, player.vy) > 50) tut.kiteT += dt;
      if (tut.kiteT > 7) tut.kited = true;
    }
    if (streakT > 0) { streakT -= dt; if (streakT <= 0) streak = 0; }
    hbT -= dt;
    if (player.hp < player.maxHp * 0.3 && hbT <= 0) { hbT = 0.5 + 0.7 * (player.hp / (player.maxHp * 0.3)); sndHeartbeat(); }
    for (const m of motes) {
      m.x += (m.vx + Math.sin(gameTime * 0.6 + m.ph) * 6) * dt; m.y += m.vy * dt;
      if (m.y < -6) { m.y = H + 6; m.x = Math.random() * W; }
      if (m.x < -6) m.x = W + 6; else if (m.x > W + 6) m.x = -6;
    }
    if (player.gunFlash > 0) player.gunFlash = Math.max(0, player.gunFlash - dt * 3);
    if (activeTurret && turrets.indexOf(activeTurret) === -1) clearSelection();

    let dx = 0, dy = 0, steerMag = 1;
    { const mv = moveAxis(); dx = mv.x; dy = mv.y; }
    /* mouse steering: with no key held, walk toward the cursor, easing off as it gets close (never while it is over the HUD) */
    const aim = controls.steer && !dx && !dy ? steerAim() : null;
    if (aim) {
      const sx = aim.x - player.x, sy = aim.y - player.y, sd = Math.hypot(sx, sy);
      if (sd > STEER_DEAD) { dx = sx / sd; dy = sy / sd; steerMag = Math.max(0.3, Math.min(1, (sd - STEER_DEAD) / STEER_FULL)); }
    }

    let nm = 1;
    for (const t of turrets) {
      const e = t.eff;
      if (e && e.nitroRadius > 0 && Math.hypot(player.x - t.x, player.y - t.y) < e.nitroRadius) nm = Math.max(nm, 1 + e.nitroBoost * 0.85 + 0.03);
    }
    player.nitroMul = nm;
    let targetVX = 0, targetVY = 0;
    const isMoving = dx !== 0 || dy !== 0;
    if (isMoving) {
      const l = Math.hypot(dx, dy);
      const tm = 1 + 0.04 * TR('r_step') + (player.slipT > gameTime ? 0.25 : 0);
      targetVX = (dx / l) * PLAYER_SPEED * nm * tm * steerMag;
      targetVY = (dy / l) * PLAYER_SPEED * nm * tm * steerMag;
    }
    if (player.dashT > 0) {
      player.dashT -= dt;
      if (player.dashT <= 0) { player.vx *= 0.35; player.vy *= 0.35; }
    } else {
      const rate = isMoving ? PLAYER_ACCEL : PLAYER_DECEL;
      const k = Math.min(1, rate * dt);
      player.vx += (targetVX - player.vx) * k;
      player.vy += (targetVY - player.vy) * k;
    }
    if (player.dashCd > 0) {
      player.dashCd -= dt;
      if (player.dashCd <= 0) {
        player.charges = Math.min(player.chargesMax || 1, (player.charges || 0) + 1);
        if (player.charges < (player.chargesMax || 1)) player.dashCd = dashCdLen();
        sndDashReady();
      }
    }

    player.x += player.vx * dt;
    player.y += player.vy * dt;
    player.x = Math.max(player.r + 14, Math.min(W - player.r - 14, player.x));
    player.y = Math.max(player.r + 14, Math.min(H - player.r - 14, player.y));
    if (player.hurt > 0) player.hurt = Math.max(0, player.hurt - dt * 4);
    player.healBank = Math.min(6, (player.healBank || 0) + 3 * dt);
    if (player.nitroMul > 1 && isMoving && Math.random() < dt * 40) particles.push({ x: player.x - player.vx * 0.02 + (Math.random() - 0.5) * 6, y: player.y - player.vy * 0.02 + (Math.random() - 0.5) * 6, vx: -player.vx * 0.2, vy: -player.vy * 0.2, life: 0.3, maxLife: 0.3, s: 2, color: '#f5a623' });
    {
      const mv = Math.min(1, Math.hypot(player.vx, player.vy) / PLAYER_SPEED);
      const ta = (player.dashT > 0 ? AGGRO_MAX : AGGRO_MIN + (AGGRO_MAX - AGGRO_MIN) * mv) * ringMul();
      player.aggro += (ta - player.aggro) * Math.min(1, dt * 6);
    }
    if (player.burnT > 0) {
      player.burnT -= dt;
      player.lastBy = 'burn'; player.hp -= player.burnDps * dt; player.hurt = Math.max(player.hurt, 0.5);
      if (Math.random() < dt * 20) particles.push({ x: player.x + (Math.random() - 0.5) * 8, y: player.y - 4, vx: (Math.random() - 0.5) * 30, vy: -50 - Math.random() * 40, life: 0.45, maxLife: 0.45, s: 2 + Math.random() * 1.6, color: Math.random() < 0.5 ? '#ff8833' : '#ffcc33' });
      sndBurnTick();
    }

    const speed = Math.hypot(player.vx, player.vy);
    if (speed > 40) {
      player.trail.push({ x: player.x, y: player.y, life: 0.28, maxLife: 0.28, speed });
      player.dustTimer -= dt;
      if (player.dustTimer <= 0 && speed > 120) {
        player.dustTimer = 0.045;
        const a = Math.atan2(-player.vy, -player.vx);
        particles.push({
          x: player.x + Math.cos(a) * player.r, y: player.y + Math.sin(a) * player.r,
          vx: Math.cos(a) * (15 + Math.random() * 20) + (Math.random() - 0.5) * 20,
          vy: Math.sin(a) * (15 + Math.random() * 20) + (Math.random() - 0.5) * 20,
          life: 0.35, maxLife: 0.35, s: 1.6 + Math.random() * 1.4, color: theme.textDim
        });
      }
    }
    for (let i = player.trail.length - 1; i >= 0; i--) {
      player.trail[i].life -= dt;
      if (player.trail[i].life <= 0) player.trail.splice(i, 1);
    }
    if (player.trail.length > 24) player.trail.splice(0, player.trail.length - 24);

    if (betweenWaves) {
      if (autoWave) { waveTimer -= dt; if (waveTimer <= 0) startWave(); }
    } else {
      if (ufoScheduled && !ufoSpawned) {
        ufoTimer -= dt;
        if (ufoTimer <= 0) {
          spawnZombie('ufo');
          ufoSpawned = true;
          sndUFO();
        }
      }
      /* stragglers: with nothing left to spawn and only a few enemies alive, out-ranging ones are drawn in so the wave can end */
      if (spawnQueue.length === 0 && zombies.length > 0 && zombies.length <= 3) {
        const before = stragT; stragT += dt;
        if (before < STRAG_AT && stragT >= STRAG_AT) { addFloatText(player.x, player.y - 30, 'STRAGGLERS CLOSING IN', '#ff9a5a', 11); sndWarn(); }
        if (stragT >= STRAG_AT) for (const z of zombies) if (z.type === 'spy' && z.disguised && !(z.revealT > 0) && z.spawnT <= 0) revealSpy(z);
      } else stragT = 0;
      if (spawnQueue.length > 0) {
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          if (zombies.length >= fieldCap()) spawnTimer = 0.25;   /* the field is crowded: hold the next arrival */
          else {
            const type = spawnQueue.shift();
            spawnZombie(type);
            const baseInterval = Math.max(0.3, 0.85 - wave * 0.03) * D().interval * dir.mod.interval / dir.live * (controls.steer ? 0.68 : 0.8);   /* enemies arrive faster; mouse-steer kites easily, so faster still */
            const mult = type === 'brute' ? 1.35 : (type === 'sprinter' ? 0.75 : 1);
            spawnTimer = baseInterval * mult;
            if (wave >= 9 && --surgeLeft <= 0) { surgeLeft = surgeSize(); spawnTimer += Math.min(3.2, 1.8 + wave * 0.04) * D().interval; }   /* a lull between surges */
          }
        }
      } else if (zombies.length === 0) {
        betweenWaves = true; waveTimer = 4;
        if (controls.steerAuto && controls.steer) setSteer(false, true);
        directorEvaluate();
        const clearBonus = Math.round((12 + wave * 3) * D().reward * INCOME);
        const fb = waveDamaged ? 0 : Math.round(clearBonus * 0.5);
        treeWaveCleared(tree.lostN || 0);
        money += clearBonus + fb;
        flash = { a: 0.12, color: theme.accentRgb.join(',') };
        burst(player.x, player.y, 24, theme.accent, 220, 3);
        banner = { text: 'WAVE ' + wave + ' COMPLETE', sub: '+$' + clearBonus + (fb ? '  \u00b7  FLAWLESS +$' + fb : '  \u00b7  TURRETS REPAIRED'), t: 0, color: '#5fda7a' };
        sndWaveClear();
        colonyWaveEnd();
        for (const t of turrets) t.sutureBank = 0;   /* a fresh stitch budget, so SUTURE keeps working through the break */
        addFloatText(player.x, player.y - 26, 'WAVE CLEAR +$' + clearBonus, '#5fda7a', 13);
        let anyRegen = false;
        for (const t of turrets) {
          const rg = 0.08 + (t.eff ? t.eff.regenWave : 0) + dir.mod.repair;
          t.hp = Math.min(t.maxHp, t.hp + t.maxHp * rg); t.healPulse = 0.6;
          if (t.eff && t.eff.regenWave > 0) { anyRegen = true; risingParticles(t.x, t.y, 8, '#2fd47a', 12, 70); addFloatText(t.x, t.y - 30, '+' + Math.round(t.maxHp * rg) + ' HP', '#2fd47a', 11); }
        }
        if (anyRegen) sndRegen();
        nextWavePreview = composeWave(wave + 1);
        snapshotRun();
      }
    }

    for (const t of turrets) t.eff = computeEff(t);
    for (const t of turrets) { t.nitro = 0; t.nitroSpd = 0; t.nitroSrc = null; }
    for (const src of turrets) {
      const ne = src.eff;
      if (!(ne.nitroBoost > 0)) continue;
      for (const t of turrets) {
        if (t === src) continue;
        if (Math.hypot(t.x - src.x, t.y - src.y) < ne.nitroRadius && ne.nitroBoost > t.nitro) { t.nitro = ne.nitroBoost; t.nitroSpd = ne.nitroBullet; t.nitroSrc = src; }
      }
    }
    for (const src of turrets) {
      const ne = src.eff;
      if (ne.nitroBoost > 0 && src.nitro < ne.nitroBoost * 0.5) { src.nitro = ne.nitroBoost * 0.5; src.nitroSpd = ne.nitroBullet * 0.5; }
    }
    for (const t of turrets) t.jam = 0;
    for (const z of zombies) if (z.type === 'drone' && z.att) z.att.jam = (z.att.jam || 0) + 1;
    for (const t of turrets) {
      {
        const e0 = t.eff;
        let spd = 1 + (t.nitro || 0);
        if (t.jam > 0) spd *= 1 - Math.min(0.6, DRONE_JAM * t.jam);
        if (e0.momPer > 0) {
          if (gameTime - (t.momLast || 0) > 1.5) t.momN = Math.max(0, (t.momN || 0) - e0.momDecay * dt);
          spd *= 1 + e0.momPer * (t.momN || 0);
        } else t.momN = 0;
        if (e0.surgeDur > 0 && t.surgeEnd > gameTime) spd *= e0.surgeMul;
        if (e0.frenzyBoost > 0 && t.frenzyT > gameTime) spd *= 1 + e0.frenzyBoost;
        if (mastery(t, 4) && !betweenWaves && gameTime - waveStartAt < 5) spd *= 1.15;
        t.cd -= dt * spd;
      }
      if (t.pulse > 0) t.pulse = Math.max(0, t.pulse - dt * 1.8);
      if (t.healPulse > 0) t.healPulse = Math.max(0, t.healPulse - dt * 2);
      if (t.fireFlash > 0) t.fireFlash = Math.max(0, t.fireFlash - dt * 6);
      if (t.hpShown === undefined || t.hpShown < t.hp) t.hpShown = t.hp;
      else t.hpShown = Math.max(t.hp, t.hpShown - t.maxHp * 0.5 * dt);
      if (t.hitFlash > 0) t.hitFlash = Math.max(0, t.hitFlash - dt * 4);
      if (t.attacked > 0) t.attacked -= dt;
      if (t.recoil > 0) t.recoil = Math.max(0, t.recoil - dt * 9);
      if (t.spawnPulse > 0) t.spawnPulse = Math.max(0, t.spawnPulse - dt * 3);
      ambient(t, dt);
      const eff = t.eff;
      defend(t, eff, dt);
      if (t.zapT > gameTime) { if (Math.random() < dt * 25) particles.push({ x: t.x + (Math.random() - 0.5) * 16, y: t.y + (Math.random() - 0.5) * 16, vx: (Math.random() - 0.5) * 80, vy: (Math.random() - 0.5) * 80, life: 0.2, maxLife: 0.2, s: 1.5, color: '#7ecbff' }); continue; }
      if (eff.mods.ice > 0 && player.burnT > 0 && t.cd <= 0 && Math.hypot(player.x - t.x, player.y - t.y) < eff.range) {
        t.cd = eff.interval; t.fireFlash = 1; t.recoil = 1;
        const a = Math.atan2(player.y - t.y, player.x - t.x); t.angle = a;
        fbolts.push({ x: t.x + Math.cos(a) * (tStats(t.level).r + 6), y: t.y + Math.sin(a) * (tStats(t.level).r + 6), vx: Math.cos(a) * 560, vy: Math.sin(a) * 560, life: 1.4 });
        sndFrost();
        continue;
      }
      const rangeSq = eff.range === Infinity ? Infinity : eff.range * eff.range;
      let bestSc = Infinity, tz = null;
      const hunter = eff.mods.sniper > 0 || eff.fireMode === 'laser';   /* long-range builds go for the support troops first */
      for (const z of zombies) {
        if (z.disguised || z.x < -4 || z.x > W + 4 || z.y < -4 || z.y > H + 4) continue;
        const ddx = z.x - t.x, ddy = z.y - t.y;
        const d2 = ddx*ddx + ddy*ddy;
        if (d2 >= rangeSq) continue;
        const sc = hunter && SUPPORT_FIRST[z.type] ? d2 - 1e9 : (z.type === 'medic' || z.type === 'alchemist') ? d2 * 0.4 : z.type === 'ranger' ? d2 * 0.55 : d2;
        if (sc < bestSc) { bestSc = sc; tz = z; }
      }
      t.tgt = tz;
      if (!tz) continue;
      const ang = Math.atan2(tz.y - t.y, tz.x - t.x);
      let diff = ang - t.angle;
      while (diff >  Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      t.angle += diff * Math.min(1, dt * 16);
      if (t.cd <= 0) {
        t.cd = eff.interval;
        fireTurret(t, tz);
      }
    }

    let playerTakingDamage = false;
    const zDpsPlayer = Z_DPS_PLAYER_BASE * (1 + wave * Z_DPS_PLAYER_SCALE) * D().dmg * dir.mod.dmg;
    const zDpsTurret = Z_DPS_TURRET_BASE * (1 + wave * Z_DPS_TURRET_SCALE) * D().dmg * dir.mod.dmg;

    let lastStandMult = 1;
    if (!betweenWaves) {
      if (zombies.length === 1) lastStandMult = 1.6;
      else if (zombies.length === 2) lastStandMult = 1.3;
    }

    const env = { zDpsPlayer, zDpsTurret, lastStandMult };
    updateMortars(dt, env);
    for (let zi = zombies.length - 1; zi >= 0; zi--) {
      const z = zombies[zi];
      if (z.hit > 0) z.hit = Math.max(0, z.hit - dt * 5);
      if (z.plateFlash > 0) z.plateFlash = Math.max(0, z.plateFlash - dt * 5);
      if (z.frost > 0) z.frost = Math.max(0, z.frost - dt * 1.2);
      if (z.spawnT > 0) z.spawnT = Math.max(0, z.spawnT - dt * 2);

      if (z.burnT > gameTime) {
        z.hp -= z.burnD * dt;
        if (z.thermal && z.slowT > gameTime) { z.hp -= z.burnD * 0.35 * dt; if (Math.random() < dt * 2) discoverCombo('thermal', z); }
        if (Math.random() < dt * 12) {
          particles.push({
            x: z.x + (Math.random() - 0.5) * 8,
            y: z.y - z.r,
            vx: (Math.random() - 0.5) * 30,
            vy: -40 - Math.random() * 40,
            life: 0.4 + Math.random() * 0.3, maxLife: 0.7,
            s: 1.4 + Math.random() * 1.4,
            color: Math.random() < 0.5 ? '#ff8833' : '#ffcc33'
          });
        }
      }
      if (z.poisonT > gameTime) {
        const stacks = Math.max(1, z.poisonStacks);
        const per = Math.max(z.poisonD, Math.min(10 + wave * 2.5, z.maxHp * (z.poisonPct || 0)));
        z.hp -= per * stacks * dt;
        if (Math.random() < dt * 8) {
          particles.push({
            x: z.x + (Math.random() - 0.5) * 8,
            y: z.y + (Math.random() - 0.5) * 4,
            vx: (Math.random() - 0.5) * 25,
            vy: 20 + Math.random() * 30,
            life: 0.5 + Math.random() * 0.3, maxLife: 0.8,
            s: 1.4 + Math.random() * 1.4,
            color: '#5fad3c'
          });
        }
      }
      if (z.fixed) { z.kx = 0; z.ky = 0; }
      else if (z.kx || z.ky) {
        const km = Math.hypot(z.kx, z.ky); if (km > 90) { z.kx *= 90 / km; z.ky *= 90 / km; }
        z.x += z.kx * dt * 8; z.y += z.ky * dt * 8;
        const decay = Math.exp(-dt * 9);
        z.kx *= decay; z.ky *= decay;
        if (Math.abs(z.kx) < 0.1 && Math.abs(z.ky) < 0.1) { z.kx = 0; z.ky = 0; }
      }

      if (z.bonus) {
        z.x += z.speed * z.bonusDir * dt;
        if ((z.bonusDir === 1 && z.x > W + 60) || (z.bonusDir === -1 && z.x < -60)) {
          zombies.splice(zi, 1);
        }
        continue;
      }

      const ai = SPECIAL_AI[z.type];
      if (ai) {
        const res = ai(z, dt, env);
        if (res === 'remove') { zombies.splice(zi, 1); continue; }
        if (res) continue;
      }

      const lured = !(player.cloakT > gameTime) && (Math.hypot(player.x - z.x, player.y - z.y) < player.aggro || z.tauntT > gameTime);
      let target = null;
      if (!lured && turrets.length) {
        let lureT = null, lureD = Infinity;
        for (const t of turrets) {
          const e = t.eff;
          if (e && e.lureR > 0 && gameTime >= (t.lureOff || 0)) { const d = Math.hypot(t.x - z.x, t.y - z.y); if (d < e.lureR && d < lureD) { lureD = d; lureT = t; } }
        }
        if (lureT) target = lureT;
        else {
          let bestScore = Infinity;
          for (const t of turrets) {
            const s = Math.hypot(t.x - z.x, t.y - z.y);
            if (s < bestScore) { bestScore = s; target = t; }
          }
        }
      }
      z.lured = lured && turrets.length > 0;
      if (lured) z.chew = 0;
      const tx = target ? target.x : player.x;
      const ty = target ? target.y : player.y;
      const ddx = tx - z.x, ddy = ty - z.y;
      const d = Math.hypot(ddx, ddy) || 1;
      z.face = Math.atan2(ddy, ddx);
      const reach = z.r + (target ? tStats(target.level).r : player.r);
      let speedMult = 1;
      if (z.freezeT > gameTime || z.stunT > gameTime) speedMult = 0;
      else if (z.slowT > gameTime) speedMult = z.slowF;
      speedMult *= lastStandMult;
      let moveSp = z.speed * speedMult;
      if (!target) moveSp = Math.min(moveSp, PLAYER_SPEED * 0.88);
      if (d > reach) {
        z.x += (ddx / d) * moveSp * dt;
        z.y += (ddy / d) * moveSp * dt;
      } else if (target) {
        z.chew = (z.chew || 0) + dt; z.tgtT = target;
        damageTurret(target, zDpsTurret * (1 + Math.min(1.5, z.chew * 0.35)) * (z.poisonT > gameTime ? 1 - (z.poisonWeak || 0) : 1) * dt, z, dt);
        if (target.hp < target.maxHp * 0.3) sndWarn(); else sndTurretHit();
        if (Math.random() < dt * 10) burst(target.x, target.y, 2, '#ff5a4a', 70, 1.6);
      } else {
        if (player.dashT <= 0) {
          player.lastBy = z.type;
          player.hp -= zDpsPlayer * (z.poisonT > gameTime ? 1 - (z.poisonWeak || 0) : 1) * dt;
          player.hurt = 1;
          playerTakingDamage = true;
          shake = Math.min(7, shake + dt * 40);
        }
      }
    }
    if (playerTakingDamage) sndHurt();

    for (const z of zombies) {
      if (z.bonus) continue;
      if (z.burnT > gameTime && z.burnSpread > 0 && Math.random() < dt * 2) {
        for (const other of zombies) {
          if (other === z || other.bonus || other.disguised || other.burnT > gameTime) continue;
          if (Math.hypot(other.x - z.x, other.y - z.y) < z.burnSpread) {
            other.burnT = gameTime + 2;
            other.burnD = Math.max(other.burnD, z.burnD * 0.7);
            other.burnSpread = z.burnSpread * 0.8;
            burst(other.x, other.y, 3, '#ff8833', 60, 1.5);
            break;
          }
        }
      }
    }

    const n = zombies.length;
    for (let i = 0; i < n; i++) {
      const a = zombies[i];
      if (a.bonus || a.fixed || a.flying) continue;
      for (let j = i + 1; j < n; j++) {
        const b = zombies[j];
        if (b.bonus || b.fixed || b.flying) continue;
        const ddx = b.x - a.x, ddy = b.y - a.y;
        const rr = a.r + b.r;
        const d2 = ddx*ddx + ddy*ddy;
        if (d2 < rr*rr && d2 > 0.0001) {
          const d = Math.sqrt(d2);
          const push = ((rr - d) / d) * 0.45;
          const px = ddx * push, py = ddy * push;
          a.x -= px; a.y -= py; b.x += px; b.y += py;
        }
      }
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      const eff = b.turret ? b.turret.eff : null;
      if (b.homing && eff) {
        const cur = Math.atan2(b.vy, b.vx), cdx = Math.cos(cur), cdy = Math.sin(cur);
        /* drop a target that died, was already hit, or has been overshot (prevents circling it) */
        if (b.target) {
          const tx = b.target.x - b.x, ty = b.target.y - b.y;
          if (b.target.hp <= 0 || zombies.indexOf(b.target) === -1 || b.hitZombies.indexOf(b.target) !== -1 || (tx * cdx + ty * cdy < 0 && tx * tx + ty * ty < 90 * 90)) {
            if (b.target.hp > 0) (b.skip = b.skip || []).push(b.target);
            b.target = null;
          }
        }
        /* lock onto the closest enemy ahead of the bullet */
        if (!b.target) {
          let bestD = Infinity, nz = null;
          for (const z of zombies) {
            if (z.disguised || b.hitZombies.indexOf(z) !== -1 || (b.skip && b.skip.indexOf(z) !== -1)) continue;
            const dx = z.x - b.x, dy = z.y - b.y, d2 = dx * dx + dy * dy;
            if (d2 > 320 * 320 || (dx * cdx + dy * cdy) < 0) continue;
            if (d2 < bestD) { bestD = d2; nz = z; }
          }
          b.target = nz;
        }
        if (b.target) {
          const desired = Math.atan2(b.target.y - b.y, b.target.x - b.x);
          let diff = desired - cur;
          while (diff >  Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          const turn = Math.min(1, b.homingStr * dt);
          b.turned = (b.turned || 0) + Math.abs(diff * turn);
          if (b.turned > Math.PI * 1.2) { b.homing = false; }   /* orbiting: give up and fly straight */
          else {
            const na = cur + diff * turn, sp = Math.hypot(b.vx, b.vy);
            b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
          }
        }
      }
      if (b.trail) {
        b.trail.push({ x: b.x, y: b.y, life: 0.12 });
        for (let j = b.trail.length - 1; j >= 0; j--) {
          b.trail[j].life -= dt;
          if (b.trail[j].life <= 0) b.trail.splice(j, 1);
        }
        if (b.trail.length > 6) b.trail.splice(0, b.trail.length - 6);
      }
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (b.life <= 0 || b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30) { bullets.splice(i, 1); continue; }
      let consumed = false;
      for (const z of zombies) {
        if (z.disguised || b.hitZombies.indexOf(z) !== -1) continue;
        const ddx = z.x - b.x, ddy = z.y - b.y;
        const rr = z.r + b.r;
        if (ddx*ddx + ddy*ddy < rr*rr) {
          const sp = Math.hypot(b.vx, b.vy) || 1;
          const dirX = b.vx / sp, dirY = b.vy / sp;
          if (z.plateHp > 0 && plateBlocks(z, b)) {
            /* the plate stops the bullet: no hit, no status. Splash still bursts on the body and chain arcs still leave the plate. */
            z.plateHp -= b.dmg * (z.acidT > gameTime ? 1 + (z.acidN || 0) * (z.acidPer || 0) : 1); z.plateFlash = 1;
            if (z.plateHp <= 0) { z.plateHp = 0; burst(z.x, z.y, 14, SPECIAL_COLORS.plated, 170, 2.4); shards(z.x, z.y, 6, SPECIAL_COLORS.plated, 120, 2.4); addFloatText(z.x, z.y - z.r - 10, 'PLATE BROKEN', SPECIAL_COLORS.plated, 10); }
            if (eff) {
              if (eff.splashRadius > 0) { doSplash(z, b.dmg, b.turret, eff.splashRadius, eff.splashDmgMult); applyHit(z, b.dmg * eff.splashDmgMult * traitMul(z, 'splash'), b.turret, { noCrit: true }); }
              if (eff.webLinks > 0) webTie(z, b.turret, eff);
            }
            fx.push({ type: 'impact', x: b.x, y: b.y, r: 4, life: 0.2, maxLife: 0.2, color: '#ffffff' });
            burst(b.x, b.y, 4, '#dfe8f2', 110, 1.4); sndPlate();
            consumed = true; break;
          }
          const result = applyHit(z, b.dmg, b.turret, { dirX, dirY, oc: b.oc });
          z.x += dirX * 2.2; z.y += dirY * 2.2;
          if (result.isCrit) burst(b.x, b.y, 6, GOLD, 100, 2);
          if (eff) {
            if (eff.splashRadius > 0) doSplash(z, b.dmg, b.turret, eff.splashRadius, eff.splashDmgMult);
            if (eff.webLinks > 0) webTie(z, b.turret, eff);
          }
          fx.push({ type: 'impact', x: b.x, y: b.y, r: 3, life: 0.18, maxLife: 0.18, color: bulletColor(b) });
          if (eff) modBurst(b.x, b.y, eff.modKeys, false);
          burst(b.x, b.y, 3, bulletColor(b), 80, 1.4);
          sndHit();
          b.hitZombies.push(z);
          if (b.bounceLeft > 0) {
            let nearest = null, nearestD = 240;
            for (const o of zombies) {
              if (o === z || b.hitZombies.indexOf(o) !== -1) continue;
              const d = Math.hypot(o.x - z.x, o.y - z.y);
              if (d < nearestD) { nearestD = d; nearest = o; }
            }
            if (nearest) {
              const a = Math.atan2(nearest.y - z.y, nearest.x - z.x);
              const sp2 = Math.hypot(b.vx, b.vy);
              b.vx = Math.cos(a) * sp2; b.vy = Math.sin(a) * sp2;
              b.x = z.x; b.y = z.y;
              b.dmg *= b.bounceRet;
              b.bounceLeft--;
              b.target = nearest;
              fx.push({ type:'bounce', x1: z.x, y1: z.y, x2: nearest.x, y2: nearest.y, life: 0.2, maxLife: 0.2 });
              sndBounce();
              continue;
            }
          }
          if (b.pierceLeft > 0) { b.pierceLeft--; b.dmg *= b.pierceRet; b.homing = false; continue; }
          consumed = true; break;
        }
      }
      if (consumed) bullets.splice(i, 1);
    }

    for (let i = zombies.length - 1; i >= 0; i--) {
      const z = zombies[i];
      if (z.hp <= 0) {
        kills++;
        streak++; streakT = 1.6;
        if (streak >= 5 && streak % 5 === 0) {
          const sb = Math.round(Math.min(streak, 25) * 2 * INCOME); money += sb;   /* capped: an endless streak used to pay more and more */
          addFloatText(player.x, player.y - 34, 'x' + streak + ' STREAK  +$' + sb, GOLD, 15);
          fx.push({ type: 'ring', x: player.x, y: player.y, r: 10, life: 0.5, maxLife: 0.5, color: GOLD });
          sndStreak(streak / 5);
        }
        const def = z.def || ENEMY_TYPES.grunt;
        let reward = Math.max(1, Math.round((REWARD_BASE + wave * REWARD_WAVE) * def.rewardMult * D().reward * INCOME * comebackMul() / Math.max(1, dir.mod.count)));
        if (z.gunKilled) reward = Math.max(2, Math.floor(reward * 0.7));
        {
          const kl = z.lastHitBy;
          if (kl && kl.eff && kl.eff.bountyPct > 0 && turrets.indexOf(kl) !== -1) {
            const room = (60 + wave * 8) - bountyWave;
            const add = Math.min(room, Math.ceil(reward * kl.eff.bountyPct));
            if (add > 0) { reward += add; bountyWave += add; burst(kl.x, kl.y, 4, GOLD, 80, 1.6); }
          }
        }
        if (z.lastHitBy && z.lastHitBy.eff) modBurst(z.x, z.y, z.lastHitBy.eff.modKeys, true);
        {
          const fk = z.lastHitBy;
          if (fk && fk.eff && fk.eff.frenzyDur > 0 && turrets.indexOf(fk) !== -1) {
            /* Cut the reload to a quarter instead of zero, so chain/splash kill streaks can't fire every frame */
            fk.cd = Math.min(fk.cd, fk.eff.interval * 0.25); fk.frenzyT = gameTime + fk.eff.frenzyDur;
            if (fk.eff.frenzyHeal > 0 && fk.hp < fk.maxHp) { fk.hp = Math.min(fk.maxHp, fk.hp + fk.maxHp * fk.eff.frenzyHeal); fk.healPulse = Math.max(fk.healPulse || 0, 0.4); }
          }
        }
        if (z.lured) { reward = Math.ceil(reward * dir.mod.decoy); addFloatText(z.x, z.y - 26, 'DECOY', '#c76bff', 9); }
        if (TR('s_big') && (z.type === 'brute' || z.type === 'medic' || z.type === 'boss')) reward = Math.ceil(reward * 1.25);
        if (TR('r_k_bait') && z.lured) reward = Math.ceil(reward * 1.15);
        if (TR('s_purse')) reward = Math.ceil(reward * (1 + 0.08 * TR('s_purse')));
        if (z.bonus) reward = Math.round((60 + wave * 8) * (TR('s_big') ? 1.5 : 1));
        money += reward;
        if (codex) { codex.kills = codex.kills || {}; codex.kills[z.type] = (codex.kills[z.type] || 0) + 1; }
        addFloatText(z.x, z.y - 12, '+$' + reward, z.bonus ? '#c76bff' : theme.text, z.bonus ? 16 : 12);
        const l = zLightBase() + (def.lightOffset || 0);
        const s = zSatBase() + (def.satOffset || 0);
        burst(z.x, z.y, z.bonus ? 30 : 10, 'hsl(' + z.hue + ',' + (s + 5) + '%,' + (l + 5) + '%)', z.bonus ? 240 : 120, z.bonus ? 3.5 : 2.2);
        shards(z.x, z.y, z.bonus ? 12 : (z.type === 'brute' ? 8 : 5), theme.bg, z.bonus ? 160 : 100, z.bonus ? 3.4 : (z.type === 'brute' ? 3 : 2.6));
        fx.push({ type: 'ring', x: z.x, y: z.y, r: z.r + 2, life: z.bonus ? 0.55 : 0.35, maxLife: z.bonus ? 0.55 : 0.35, color: z.bonus ? '#c76bff' : 'hsl(' + z.hue + ',' + (s + 10) + '%,' + (l + 8) + '%)' });
        fx.push({ type: 'deathburst', x: z.x, y: z.y, r: z.r, life: z.bonus || z.type === 'boss' ? 0.7 : 0.4, maxLife: z.bonus || z.type === 'boss' ? 0.7 : 0.4, color: z.bonus ? '#c76bff' : (SPECIAL_COLORS[z.type] || 'hsl(' + z.hue + ',' + (s + 10) + '%,' + (l + 8) + '%)'), n: z.type === 'boss' ? 16 : (SPECIAL_COLORS[z.type] ? 10 : 7), seed: Math.random() * 6.28 });
        if (z.burnT > gameTime) { burst(z.x, z.y, 8, '#ff8833', 130, 1.8); risingParticles(z.x, z.y, 6, '#ffb347', z.r, 70); }
        if (z.freezeT > gameTime || z.frost > 0.6) { shards(z.x, z.y, 9, '#bfe6ff', 150, 3); burst(z.x, z.y, 5, '#ffffff', 110, 1.4); }
        else if (z.frost > 0.3) burst(z.x, z.y, 5, '#a8dcf5', 100, 1.5);
        if (z.poisonT > gameTime) { burst(z.x, z.y, 6, '#5fad3c', 100, 1.6); fx.push({ type: 'cloud', x: z.x, y: z.y, r: 28 + z.r * 1.4, life: 0.7, maxLife: 0.7 }); }
        let spreadMark = false, spreadRadius = 0;
        for (const t of turrets) {
          if (t.eff && t.eff.markSpread > 0 && z.markT > gameTime) { spreadMark = true; spreadRadius = t.eff.markSpread; break; }
        }
        if (spreadMark) {
          for (const o of zombies) {
            if (o === z) continue;
            if (Math.hypot(o.x - z.x, o.y - z.y) < spreadRadius) o.markT = Math.max(o.markT, gameTime + 3);
          }
        }
        if (z.bonus) sndUFOKill();
        else if (z.type === 'brute') sndBruteDeath();
        else sndDeath();
        if (z.type === 'trojan') dropTurret(z.x, z.y);
        if (z.type === 'boss') bossDown(z);
        maybeDrop(z);
        if (z.boomPct > 0 && z.burnT > gameTime) fireBoom(z);
        if (z.plague && z.burnT > gameTime && z.poisonT > gameTime) {
          fx.push({ type: 'cloud', x: z.x, y: z.y, r: 62, life: 0.9, maxLife: 0.9 });
          for (const o of zombies) {
            if (o === z || o.disguised || o.bonus) continue;
            if (Math.hypot(o.x - z.x, o.y - z.y) < 62) { o.poisonStacks = Math.min(5, (o.poisonStacks || 0) + 2); o.poisonD = Math.max(o.poisonD, 3); o.poisonPct = Math.max(o.poisonPct || 0, 0.008); o.poisonT = Math.max(o.poisonT, gameTime + 4); }
          }
          burst(z.x, z.y, 10, '#8fd14f', 120, 2.2); discoverCombo('plague', z);
        }
        if (z.type === 'splitter') spawnShards(z);
        colonyOnKill(z);
        zombies.splice(i, 1);
      }
    }

    for (let i = ebullets.length - 1; i >= 0; i--) {
      const b = ebullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (Math.random() < dt * 40) particles.push({ x: b.x, y: b.y, vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20, life: 0.3, maxLife: 0.3, s: b.kind === 'fire' ? 2.4 : 1.6, color: b.kind === 'fire' ? (Math.random() < 0.5 ? '#ff8833' : '#ffcc33') : '#ff5c7a' });
      if (b.life <= 0 || b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30) { ebullets.splice(i, 1); continue; }
      let gone = false;
      const pdist = Math.hypot(player.x - b.x, player.y - b.y);
      if (b.kind === 'parry' && player.dashT > 0 && pdist < player.r + b.r + 12) {
        player.dashCd = 0; player.charges = player.chargesMax || 1;
        /* Rewards cap per wave so stalling a boss to farm parries doesn't pay */
        if (parryPaid < PARRY_PAY_MAX) { parryPaid++; player.hp = Math.min(player.maxHp, player.hp + 3); money += 5; }
        addFloatText(b.x, b.y - 12, parryPaid < PARRY_PAY_MAX ? 'PARRY!' : 'PARRY', '#ff7ad9', 13);
        burst(b.x, b.y, 12, '#ff7ad9', 170, 2.2);
        fx.push({ type: 'ring', x: b.x, y: b.y, r: 6, life: 0.4, maxLife: 0.4, color: '#ff7ad9' });
        sndParry(); gone = true;
      } else if (player.dashT <= 0 && pdist < player.r + b.r) {
        player.lastBy = b.boss ? 'boss' : (b.kind === 'fire' ? 'pyro' : 'ranged'); player.hp -= burstDmg(b.dmg); player.hurt = 1; shake = Math.max(shake, 4); sndHurt();
        if (b.kind === 'fire') {
          if (gameTime >= (player.dousedT || 0)) {
            if (player.burnT <= 0 && gameTime - (player.burnTxtT || -9) > 3) { player.burnTxtT = gameTime; addFloatText(player.x, player.y - 20, 'BURNING', '#ff6a2a', 12); }
            player.burnT = Math.max(player.burnT, 3.2 * (1 - 0.2 * TR('w_sink'))); player.burnDps = Math.max(player.burnDps, b.burn);
            sndIgnitePlayer();
          }
        }
        burst(b.x, b.y, 6, b.kind === 'fire' ? '#ff8833' : '#ff5c7a', 100, 1.8);
        gone = true;
      } else {
        for (const t of turrets) {
          if (Math.hypot(t.x - b.x, t.y - b.y) < tStats(t.level).r + b.r) {
            if (tryDeflect(t, b)) { gone = true; break; }
            if (b.kind === 'fire') {
              damageTurret(t, b.dmg * 1.5, null, 0);
              if (!(t.burnT > 0)) addFloatText(t.x, t.y - tStats(t.level).r - 22, 'IGNITED', '#ff6a2a', 11);
              t.burnT = Math.max(t.burnT || 0, 2.5); t.burnDps = Math.max(t.burnDps || 0, b.burn * 0.7);
              burst(b.x, b.y, 8, '#ff8833', 110, 2); sndIgnitePlayer();
            } else {
              damageTurret(t, b.tdmg !== undefined ? b.tdmg : b.dmg, null, 0);
              burst(b.x, b.y, 4, b.kind === 'rifle' ? '#ffd04a' : '#ff5c7a', 80, 1.6); sndTurretHit();
            }
            gone = true; break;
          }
        }
      }
      if (gone) ebullets.splice(i, 1);
    }

    updateColonies(dt); updateHosts(dt); updateWebs(dt); updateReflected(dt);
    for (let i = fbolts.length - 1; i >= 0; i--) {
      const b = fbolts[i];
      const dx = player.x - b.x, dy = player.y - b.y, d = Math.hypot(dx, dy) || 1;
      b.vx += (dx / d * 620 - b.vx) * Math.min(1, dt * 9); b.vy += (dy / d * 620 - b.vy) * Math.min(1, dt * 9);
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (Math.random() < dt * 50) particles.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 0.25, maxLife: 0.25, s: 1.8, color: '#bfe9ff' });
      if (d < player.r + 7) {
        if (player.burnT > 0) {
          player.burnT = 0; player.burnDps = 0; player.dousedT = gameTime + 3;
          addFloatText(player.x, player.y - 22, 'EXTINGUISHED', '#bfe9ff', 12);
          burst(player.x, player.y, 14, '#bfe9ff', 160, 2.2);
          fx.push({ type: 'ring', x: player.x, y: player.y, r: player.r + 4, life: 0.45, maxLife: 0.45, color: '#bfe9ff' });
          sndFrostHit();
        }
        fbolts.splice(i, 1); continue;
      }
      if (b.life <= 0) fbolts.splice(i, 1);
    }
    for (let i = pickups.length - 1; i >= 0; i--) {
      const pk = pickups[i];
      pk.age = (pk.age || 0) + dt;
      if (pk.kind === 'cash' && pk.age > 0.45) {
        const cdx = player.x - pk.x, cdy = player.y - pk.y, cd = Math.hypot(cdx, cdy) || 1;
        const sp = Math.min(1000, 280 + (pk.age - 0.45) * 1100);
        pk.x += cdx / cd * sp * dt; pk.y += cdy / cd * sp * dt; pk.vx = pk.vy = 0;
        if (Math.random() < dt * 40) particles.push({ x: pk.x, y: pk.y, vx: 0, vy: 0, life: 0.25, maxLife: 0.25, s: 1.8, color: GOLD });
        if (cd < player.r + 8) { collectPickup(pk); pickups.splice(i, 1); }
        continue;
      }
      pk.life -= dt; pk.x += pk.vx * dt; pk.y += pk.vy * dt; pk.vx *= 0.9; pk.vy *= 0.9;
      pk.x = Math.max(12, Math.min(W - 12, pk.x)); pk.y = Math.max(12, Math.min(H - 12, pk.y));
      const dx = player.x - pk.x, dy = player.y - pk.y, d = Math.hypot(dx, dy) || 1;
      const magR = pk.pulled ? 9999 : 90 * (1 + 0.25 * TR('s_mag'));
      if (d < magR) { const pull = pk.pulled ? 520 : 320 * (1 - d / magR) + 80; pk.x += dx / d * pull * dt; pk.y += dy / d * pull * dt; }
      if (d < player.r + 9) { collectPickup(pk); pickups.splice(i, 1); continue; }
      if (pk.life <= 0) pickups.splice(i, 1);
    }
    if (coinPop) { coinPop.t += dt; if (coinPop.t > 0.9) coinPop = null; }
    if (flash) { flash.a -= dt * 0.6; if (flash.a <= 0) flash = null; }

    for (let i = turrets.length - 1; i >= 0; i--) {
      const t = turrets[i];
      if (t.hp <= 0) {
        burst(t.x, t.y, 20, theme.player, 180, 2.6);
        shards(t.x, t.y, 8, theme.player, 140, 3); runS.turretsLost++; if (!runS.firstLost) runS.firstLost = { wave, lv: t.level }; if (dirCountsLoss(t)) dir.w.lost++; tree.lostN = (tree.lostN || 0) + 1;
        fx.push({ type: 'explode', x: t.x, y: t.y, r: tStats(t.level).r + 6, life: 0.5, maxLife: 0.5 });
        shake = Math.max(shake, 6); addFloatText(t.x, t.y - 22, 'TURRET LOST', '#ff5a4a', 12);
        sndTurretDown();
        if (t === activeTurret) clearSelection();
        turrets.splice(i, 1);
      }
    }

    /* Skill Tree damage scaling, applied once per frame to all damage the player took */
    if (player.hp < hpFrameStart) {
      const lost = hpFrameStart - player.hp;
      const red = (player.ghostT > gameTime || player.lifeInvT > gameTime) ? 1 : (player.platingT > gameTime ? 0.3 : 0);
      if (red > 0) player.hp = hpFrameStart - lost * (1 - red);
    }
    if (player.hp <= 0 && TR('w_life') && tree.lifeWave !== wave) {
      tree.lifeWave = wave; player.hp = 1; player.lifeInvT = gameTime + 1;
      fx.push({ type: 'ring', x: player.x, y: player.y, r: 10, life: 0.6, maxLife: 0.6, color: '#ff6b6b' });
      burst(player.x, player.y, 18, '#ff6b6b', 180, 2.4); addFloatText(player.x, player.y - 24, 'SECOND LIFE', '#ff6b6b', 14); sndShieldUp();
    }
    if (player.hp <= 0) { player.hp = 0; gameOver(); }
  }

  /* ================================================================ */
  /*  COLORS                                                           */
  /* ================================================================ */
  function bulletColor(b) { return b.oc ? '#ffd43b' : (b.turret ? bulletColorOf(b.turret) : theme.player); }
  function bulletColorOf(t) {
    if (!t.eff) return theme.player;
    const m = t.eff.mods;
    if (m.poison > 0) return '#5fad3c';
    if (m.ice && m.fire) return '#9b6bb5';
    if (m.ice) return '#5aa5d9';
    if (m.fire) return '#e07a2b';
    if (m.laser) return '#d94a3d';
    if (m.web) return '#c9c2e8';
    if (m.splash) return '#d9772b';
    if (m.blackhole) return '#5a3aa8';
    if (m.prism) return '#da77f2';
    if (m.focus) return '#e8590c';
    if (m.crit) return '#d9a02b';
    return theme.player;
  }

  /* ================================================================ */
  /*  DRAW: TURRET                                                     */
  /* ================================================================ */
  /* Gem path for a modifier, shaped by its school:
     elements = diamond, force = square, precision = triangle, vital = circle, tempo = 4-point star */
  function modGlyph(school, x, y, s, rot) {
    ctx.beginPath();
    if (school === 3) { ctx.arc(x, y, s * 0.85, 0, Math.PI * 2); return; }
    const pts = school === 0 ? 4 : school === 1 ? 4 : school === 2 ? 3 : 8;
    const off = school === 1 ? Math.PI / 4 : 0;
    for (let i = 0; i < pts; i++) {
      const a = rot + off + i * Math.PI * 2 / pts;
      const r = school === 4 ? (i % 2 ? s * 0.45 : s * 1.15) : school === 1 ? s * 1.05 : school === 2 ? s * 1.15 : s * 1.1;
      if (i) ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); else ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    }

        ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 3.6; ctx.stroke();
        if (sf > 0.001) {
          ctx.beginPath(); ctx.arc(t.x, t.y, SR, A0, A0 + TAU * sf);

        } else {
          ctx.setLineDash([3, 5]); ctx.beginPath(); ctx.arc(t.x, t.y, SR, 0, TAU);
          ctx.strokeStyle = 'rgba(77,210,255,' + (0.35 + 0.3 * Math.sin(time * 6)) + ')'; ctx.lineWidth = 1.6; ctx.stroke(); ctx.setLineDash([]);
        }
        if (t.shieldFlash > 0) {
          ctx.beginPath(); ctx.arc(t.x, t.y, SR + 1.5, 0, TAU);
          ctx.strokeStyle = 'rgba(200,245,255,' + t.shieldFlash + ')'; ctx.lineWidth = 3.4; ctx.stroke();
          ctx.fillStyle = 'rgba(77,210,255,' + (t.shieldFlash * 0.16) + ')';
          ctx.beginPath(); ctx.arc(t.x, t.y, SR, 0, TAU); ctx.fill();

      if (activeTurret === t || ratio < 0.999) txt(Math.ceil(t.hp) + '/' + t.maxHp, t.x, t.y - R - (eff.shieldMax > 0 ? 17 : 10), 9, theme.text, 'center', '700', 0);
      if (t.spyT > gameTime) {

          for (let k = 0; k <= 5; k++) {

            if (k) ctx.lineTo(t.x + Math.cos(aa) * rr, t.y + Math.sin(aa) * rr); else ctx.moveTo(t.x + Math.cos(aa) * rr, t.y + Math.sin(aa) * rr);
          }
          ctx.stroke();

        txt('OFFLINE', t.x, t.y + st.r + 30, 8, '#7ecbff', 'center', '700', 1);
      }
      if (t.burnT > 0) {

        ctx.beginPath(); ctx.arc(t.x, t.y, st.r + 2.5, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,120,40,' + (0.85 * fl) + ')'; ctx.lineWidth = 2.4; ctx.stroke();
      }
      if (t.hitFlash > 0) { ctx.beginPath(); ctx.arc(t.x, t.y, st.r + 2, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(255,70,50,' + t.hitFlash + ')'; ctx.lineWidth = 2.5; ctx.stroke(); }

      if (t.spawnPulse > 0) { ctx.beginPath(); ctx.arc(t.x, t.y, st.r + 4 + (1 - t.spawnPulse) * 30, 0, Math.PI * 2); ctx.strokeStyle = accentA(t.spawnPulse * 0.7); ctx.lineWidth = 2; ctx.stroke(); }
