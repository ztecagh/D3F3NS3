  /* ================================================================ */
  /*  DRAW: TURRET PANEL — clean, evenly-spaced layout                 */
  /* ================================================================ */
  function panelEffects(e) {
    const out = [], pc = v => Math.round(v * 100) + '%';
    if (e.burnDps) out.push('BURN ' + Math.round(e.burnDps) + '/s \u00d7' + e.burnDur.toFixed(1) + 's');
    if (e.poisonPct || e.poisonDps) out.push('POISON ' + (e.poisonPct ? (e.poisonPct * 100).toFixed(1) + '% HP/s' : Math.round(e.poisonDps) + '/s'));
    if (e.acidPer) out.push('ACID ' + (e.acidPer * 100).toFixed(1) + '% \u00d7' + e.acidMax);
    if (e.slowFactor) out.push('SLOW ' + pc(1 - e.slowFactor));
    if (e.freezeChance) out.push('FREEZE ' + pc(e.freezeChance));
    if (e.stunChance) out.push('STUN ' + pc(e.stunChance) + ' ' + e.stunDur.toFixed(1) + 's');
    if (e.windN) out.push('WIND /' + e.windN + ' \u00b7 ' + Math.round(e.windPush) + 'px');
    if (e.webLinks) out.push('WEB \u00d7' + e.webLinks + ' \u00b7 ' + pc(e.webMirror) + ' \u00b7 SLOW ' + Math.round((1 - e.webSlow) * 100) + '%');
    if (e.staticN) out.push('STATIC /' + e.staticN);
    if (e.splashRadius) out.push('SPLASH ' + Math.round(e.splashRadius) + 'px');
    if (e.critChance) out.push('CRIT ' + pc(e.critChance) + ' \u00d7' + e.critMult.toFixed(1));
    if (e.executeThreshold) out.push('EXECUTE <' + pc(e.executeThreshold));
    if (e.markBonus > 1) out.push('MARK +' + pc(e.markBonus - 1));
    if (e.pierceCount) out.push('PIERCE ' + e.pierceCount);
    if (e.bounceCount) out.push('BOUNCE ' + e.bounceCount);
    if (e.homingLevel) out.push('HOMING');
    if (e.prismN > 1) out.push('PRISM \u00d7' + e.prismN);
    if (e.fireMode === 'laser') out.push('LASER');
    if (e.drainHeal) out.push('DRAIN ' + pc(e.drainHeal));
    if (e.shieldMax) out.push('SHIELD ' + Math.round(e.shieldMax) + ' \u00b7 DEFLECT ' + pc(e.shieldDeflect));
    if (e.thornsPct) out.push('THORNS ' + pc(e.thornsPct));
    if (e.regenWave || e.regenPassive) out.push('REGEN ' + pc(e.regenWave) + '/wave');
    if (e.sancR) out.push('HEAL AURA ' + Math.round(e.sancR) + 'px (COSTS TURRET HP)');
    if (e.fieldRadius) out.push('FIELD ' + Math.round(e.fieldRadius) + 'px');
    if (e.blackholeRadius) out.push('PULL ' + Math.round(e.blackholeRadius) + 'px');
    if (e.quakeR) out.push('QUAKE ' + Math.round(e.quakeR) + 'px');
    if (e.mineMax) out.push('COLONIES ' + e.mineMax + ' · ' + e.mineCap + ' ENEMIES EACH');
    if (e.mineHost) out.push('HOSTS ' + e.mineHost);
    if (e.linkCount) out.push('LINK \u00d7' + e.linkCount);
    if (e.lureR) out.push('LURE ' + Math.round(e.lureR) + 'px');
    if (e.nitroRadius) out.push('NITRO +' + pc(e.nitroBoost));
    if (e.focusMax) out.push('FOCUS \u00d7' + e.focusMax);
    if (e.ocN) out.push('OVERCHARGE /' + e.ocN);
    if (e.bountyPct) out.push('BOUNTY +' + pc(e.bountyPct));
    return out;
  }
  function drawTurretPanel(t) {
    const eff = t.eff;
    const base = tStats(t.level);
    const upCost = upgradeCost(t);
    const canUpgrade = money >= upCost;
    const refund = sellValue(t);
    const slots = slotsFor(t);
    const used = usedSlots(t);
    const mCost = modifierCost(t);
    const canAffordMod = money >= mCost;
    const hasSpace = used < slots;

    // --- Layout constants (all spacing is intentional and even) ---
    const cp = H < 700;       // short window: tighten every gap
    const pad        = cp ? 12 : 16;    // outer padding
    const panelW     = 408;
    const hHeader    = 20;    // "TURRET LV N"
    const gapAfterH  = cp ? 8 : 14;
    const hUpBtn     = cp ? 26 : 32;
    const gapBtwnBtns= cp ? 6 : 8;
    const hSellBtn   = cp ? 22 : 26;
    const gapBeforeD1= cp ? 10 : 18;
    const divH       = 1;
    const gapAfterD1 = cp ? 8 : 12;
    const hStat      = cp ? 17 : 22;    // 4 rows
    const hStatHead  = cp ? 14 : 18;    // column captions
    const gapBeforeD2= cp ? 8 : 12;
    const gapAfterD2 = cp ? 8 : 14;
    const hModHead   = 14;
    const gapAfterMH = cp ? 6 : 10;
    const hGridRow   = cp ? 26 : 32;
    const hGridGap   = cp ? 4 : 6;
    const gridCols   = 4;
    const gridRows   = 2;
    const gridH      = gridRows * hGridRow + (gridRows - 1) * hGridGap;
    const gapAfterGH = cp ? 8 : 16;
    const hFooter    = cp ? 26 : 30;    // room for two wrapped lines
    const hTabs = cp ? 22 : 26, gapAfterTabs = cp ? 6 : 10;
    const keyPending = MOD_LIST.find(k => (t.mods[k] || 0) >= 4 && KEYSTONES[k] && !(t.keys && t.keys[k]));
    const hKey = keyPending ? 44 : 0;
    /* what the modifiers actually do, beyond the four base stats */
    const fxList = panelEffects(eff);
    const fxLines = fxList.length ? wrapText(fxList.join('   ·   '), panelW - pad * 2 - 50, '700 9px ' + MONO, 0.4).slice(0, 2) : [];
    const hFx = fxLines.length ? fxLines.length * 13 + (cp ? 4 : 8) : 0;

    const contentH =
      hHeader + gapAfterH +
      hUpBtn + gapBtwnBtns + hSellBtn + gapBeforeD1 +
      divH + gapAfterD1 +
      hStatHead + hStat * 4 + hFx + gapBeforeD2 +
      divH + gapAfterD2 +
      hModHead + gapAfterMH +
      hTabs + gapAfterTabs +
      gridH + hKey +
      gapAfterGH + hFooter;

    const panelH = pad * 2 + contentH;

    /* choose the side that hides the fewest neighbouring turrets */
    const rightX = t.x + base.r + 22, leftX = t.x - base.r - 22 - panelW;
    let py = Math.max(12, Math.min(H - 12 - panelH, t.y - panelH / 2));
    const covered = x0 => { let n = 0; for (const o of turrets) if (o !== t && o.x > x0 - 14 && o.x < x0 + panelW + 14 && o.y > py - 14 && o.y < py + panelH + 14) n++; return n; };
    const fitsR = rightX + panelW <= W - 12, fitsL = leftX >= 12;
    let side = panelLock.t === t ? panelLock.side : 0;
    if (side === 1 && !fitsR) side = 0;
    if (side === -1 && !fitsL) side = 0;
    if (!side) { side = (fitsR && (!fitsL || covered(rightX) <= covered(leftX))) ? 1 : (fitsL ? -1 : 1); panelLock = { t, side }; }
    let px = side === 1 ? (fitsR ? rightX : Math.max(12, Math.min(W - 12 - panelW, rightX))) : leftX;
    if (dockBottomPrev > 0) { /* stay clear of the wave dock and banner: drop below it, or slide beside it when there is no room */
      const db = dockBox(), gap = 10;
      if (px < db.x + db.w + gap && px + panelW > db.x - gap && py < dockBottomPrev + 8) {
        if (dockBottomPrev + 8 + panelH <= H - 12) py = dockBottomPrev + 8;
        else {
          const left = db.x - gap - panelW, right = db.x + db.w + gap;
          px = t.x < db.x + db.w / 2 ? (left >= 12 ? left : right) : (right + panelW <= W - 12 ? right : left);
          px = Math.max(12, Math.min(W - 12 - panelW, px));
        }
      }
    }
    if (H >= 760 && currentTip() && px < W / 2 + 290 && px + panelW > W / 2 - 290 && py + panelH > H - 112) py = Math.max(12, H - 112 - panelH);
    { /* keep clear of the HUD stack (stats box + skill tree button) */
      const hb = treeBtnRect(), hudR = hb.x + hb.w + 12, hudB = hb.y + hb.h + 10;
      if (px < hudR && py < hudB) { if (hudB + panelH <= H - 12) py = hudB; else px = hudR; }
    }

    panelRect = { x: px, y: py, w: panelW, h: panelH };

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    rrect(px + 3, py + 3, panelW, panelH, 8); ctx.fill();
    // Body
    card(px, py, panelW, panelH, 8, theme.modalBg, theme.panelBorder, 1.5);

    // --- Cursor ---
    let cy = py + pad;

    // --- Header row ---
    const headerCY = cy + hHeader / 2;
    const lvlLabel = t.level >= 10 ? 'TURRET  \u2605 LV ' + t.level : 'TURRET LV ' + t.level;
    txt(lvlLabel, px + pad, headerCY, 12, theme.text, 'left', '700', 1.5);

    // Close X (right side of header)
    const closeSize = 20;
    const closeX = px + panelW - pad - closeSize;
    const closeY = cy + (hHeader - closeSize) / 2;
    const closeHover = mouse.x >= closeX && mouse.x <= closeX + closeSize &&
                       mouse.y >= closeY && mouse.y <= closeY + closeSize;
    if (closeHover) {
      ctx.fillStyle = 'rgba(192,57,43,0.9)';

    }
    ctx.strokeStyle = closeHover ? '#ffffff' : theme.textDim;
    ctx.lineWidth = 1.6;
    ctx.lineCap = 'round';
    const ccx = closeX + closeSize / 2, ccy = closeY + closeSize / 2;
    ctx.beginPath();
    ctx.moveTo(ccx - 4, ccy - 4); ctx.lineTo(ccx + 4, ccy + 4);
    ctx.moveTo(ccx + 4, ccy - 4); ctx.lineTo(ccx - 4, ccy + 4);
    ctx.stroke();
    panelHitAreas.push({ x: closeX - 2, y: closeY - 2, w: closeSize + 4, h: closeSize + 4, action: 'close', turret: t });
    cy += hHeader + gapAfterH;

    // --- Upgrade button ---
    {
      const bx = px + pad, by = cy, bw = panelW - pad * 2, bh = hUpBtn;

    // --- Sell button ---
    {
      const bx = px + pad, by = cy, bw = panelW - pad * 2, bh = hSellBtn;

      ctx.strokeStyle = hover ? '#c0392b' : 'rgba(192,57,43,0.55)';

      ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);

      txt(armed ? 'CLICK AGAIN TO CONFIRM SELL  \u00b7  $' + refund : 'SELL  \u00b7  $' + refund + '  (' + Math.round(sellRatio() * 100) + '%)', bx + bw / 2, by + bh / 2, 10, armed ? '#ffffff' : '#c0392b', 'center', '700', 0.8);

    { const hy = cy + hStatHead / 2 - 2;
      txt('BASE', cBase, hy, 8, fgA(0.5), 'left', '700', 1);
      txt('MODS', cMod, hy, 8, fgA(0.5), 'left', '700', 1);
      txt('TOTAL', cTot, hy, 8, fgA(0.5), 'left', '700', 1);

      cy += hStatHead; }
    for (const [label, bv, dv, tot, next, dec] of rows) {

      txt(dec ? bv.toFixed(1) : String(bv), cBase, ry, 11, theme.textDim, 'left', '600', 0);
      let ds = '—', dc = fgA(0.3);

      else if (Math.abs(dv) >= (dec ? 0.05 : 0.5)) { ds = (dv > 0 ? '+' : '−') + (dec ? Math.abs(dv).toFixed(1) : Math.round(Math.abs(dv))); dc = dv > 0 ? (theme.isDark ? '#5fda7a' : '#1f8f4a') : '#e04a3a'; }
      txt(ds, cMod, ry, 11, dc, 'left', '700', 0);
      txt(tot, cTot, ry, 11, theme.text, 'left', '700', 0);
      txt('→', cArr, ry, 11, theme.textDim, 'left', '400', 0);

        if (writeSlotRaw(n, d2)) { refreshSlots(); slotNoteSet('IMPORTED INTO SLOT ' + (n + 1), '#5fda7a'); sndSelect(); } else slotNoteSet('COULDN’T WRITE TO STORAGE', '#e04a3a');
        return;
      }
      return;
    }
  }

  /* ================================================================ */
  /*  DEV MODE (hidden; toggled with the Konami code on the profile    */
  /*  screen). Infinite coins and sparks, invincibility, wave warp.    */
  /*  A run that used it never writes a record.                        */
  /* ================================================================ */
  let devMode = false, devOpen = true, devWaveSel = 10, devHits = [], devRect = null, konamiBuf = [];
  const devOpt = { god: true, coins: true, sparks: true };
  try { devMode = localStorage.getItem('d3f3ns3_dev') === '1'; } catch (e) {}
  const KONAMI = ['arrowup', 'arrowup', 'arrowdown', 'arrowdown', 'arrowleft', 'arrowright', 'arrowleft', 'arrowright', 'b', 'a'];
  const KONAMI_SHORT = ['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'b', 'a'];
  function konamiKey(k) {
    konamiBuf.push(k); if (konamiBuf.length > 10) konamiBuf.shift();
    const hit = seq => konamiBuf.length >= seq.length && seq.every((v, i) => konamiBuf[konamiBuf.length - seq.length + i] === v);
    if (hit(KONAMI) || hit(KONAMI_SHORT)) {
      konamiBuf = []; devMode = !devMode;
      try { localStorage.setItem('d3f3ns3_dev', devMode ? '1' : '0'); } catch (e) {}
      initAudio(); [523, 659, 784, 1047].forEach((f, i) => toneAt(devMode ? f : f * 0.5, 0.12, 'square', 0.05, devMode ? f : f * 0.5, i * 0.06));
      slotNoteSet(devMode ? 'DEV MODE ON' : 'DEV MODE OFF', GOLD);
    }
  }
  function devTick() {
    if (!devMode || state !== 'play' || !player) return;
    runS.dev = true;
    if (devOpt.coins) money = Math.max(money, 999999);
    if (devOpt.sparks && tree) { tree.sparks = Math.max(tree.sparks, 999); tree.earned = Math.max(tree.earned, tree.sparks); }
    if (devOpt.god) { player.hp = player.maxHp; player.burnT = 0; for (const t of turrets) t.hp = t.maxHp; }
  }
  function devGoToWave(n) {
    n = Math.max(1, Math.min(99, n | 0));
    zombies.length = 0; hosts.length = 0; spawnQueue.length = 0; ebullets.length = 0; mortarShells.length = 0; reflected.length = 0; bullets.length = 0; fbolts.length = 0;
    wave = n - 1; betweenWaves = true; waveTimer = 4; waveDamaged = false; dirWaveReset(); nextWavePreview = composeWave(n);
    flashMsg('DEV  ·  WAVE ' + n + ' NEXT', GOLD);
  }
  function devPanelRect() { const w = 214, h = devOpen ? 246 : 30; return { x: 20, y: H - 56 - h, w, h }; }
  function drawDevPanel() {
    devHits = []; const r = devPanelRect(); devRect = r;
    card(r.x + 2, r.y + 3, r.w, r.h, 8, 'rgba(0,0,0,0.3)');
    card(r.x, r.y, r.w, r.h, 8, theme.modalBg, GOLD, 1.4);
    txt('DEV MODE', r.x + 12, r.y + 15, 10, GOLD, 'left', '700', 2);
    const cb = { x: r.x + r.w - 30, y: r.y + 5, w: 22, h: 20 };
    card(cb.x, cb.y, cb.w, cb.h, 4, pointInRect(mouse.x, mouse.y, cb) ? accentA(0.15) : null, fgA(0.3), 1);
    txt(devOpen ? '–' : '+', cb.x + cb.w / 2, cb.y + cb.h / 2, 12, theme.text, 'center', '700', 0);
    devHits.push({ x: cb.x, y: cb.y, w: cb.w, h: cb.h, a: 'collapse' });
    if (!devOpen) return;
    let y = r.y + 38;
    const toggle = (label, key) => {
      const row = { x: r.x + 10, y, w: r.w - 20, h: 22 }, on = devOpt[key], hv = pointInRect(mouse.x, mouse.y, row);
      card(row.x, row.y, row.w, row.h, 5, hv ? fgA(0.1) : fgA(0.04), on ? GOLD : fgA(0.25), 1);
      txt(label, row.x + 10, row.y + row.h / 2, 9, theme.text, 'left', '700', 1);
      txt(on ? 'ON' : 'OFF', row.x + row.w - 10, row.y + row.h / 2, 9, on ? GOLD : theme.textDim, 'right', '700', 1);
      devHits.push({ x: row.x, y: row.y, w: row.w, h: row.h, a: 'opt', k: key }); y += 27;
    };
    toggle('INVINCIBLE', 'god'); toggle('INFINITE COINS', 'coins'); toggle('INFINITE SPARKS', 'sparks');
    y += 4; txt('WAVE WARP', r.x + 12, y + 6, 9, theme.textDim, 'left', '700', 2); y += 20;
    const btn = (x, w, label, a, d, col) => {
      const b = { x, y, w, h: 24 }, hv = pointInRect(mouse.x, mouse.y, b);
      card(b.x, b.y, b.w, b.h, 5, hv ? accentA(0.18) : fgA(0.05), hv ? (col || theme.accent) : fgA(0.3), 1);
      txt(label, b.x + b.w / 2, b.y + b.h / 2, 9, hv ? (col || theme.accent) : theme.text, 'center', '700', 0.5);
      devHits.push({ x, y, w, h: 24, a, d });
    };
    btn(r.x + 10, 30, '-5', 'sel', -5); btn(r.x + 44, 30, '-1', 'sel', -1);
    txt(String(devWaveSel), r.x + r.w / 2, y + 12, 14, GOLD, 'center', '700', 0.5);
    btn(r.x + r.w - 74, 30, '+1', 'sel', 1); btn(r.x + r.w - 40, 30, '+5', 'sel', 5);
    y += 32;
    btn(r.x + 10, (r.w - 28) / 2, 'GO TO ' + devWaveSel, 'go', 0, GOLD); btn(r.x + 18 + (r.w - 28) / 2, (r.w - 28) / 2, 'SKIP WAVE', 'skip', 0);
    y += 32;
    btn(r.x + 10, r.w - 20, 'CLEAR ENEMIES', 'clear', 0, '#e04a3a');
  }
  function devClick(x, y) {
    if (!devRect || !pointInRect(x, y, devRect)) return false;
    for (let i = devHits.length - 1; i >= 0; i--) {
      const h = devHits[i]; if (!pointInRect(x, y, h)) continue;
      sndSelect();
      if (h.a === 'collapse') devOpen = !devOpen;
      else if (h.a === 'opt') devOpt[h.k] = !devOpt[h.k];
      else if (h.a === 'sel') devWaveSel = Math.max(1, Math.min(99, devWaveSel + h.d));
      else if (h.a === 'go') devGoToWave(devWaveSel);
      else if (h.a === 'skip') devGoToWave(betweenWaves ? wave + 2 : wave + 1);
      else if (h.a === 'clear') { zombies.length = 0; hosts.length = 0; spawnQueue.length = 0; ebullets.length = 0; mortarShells.length = 0; reflected.length = 0; }
      break;
    }
    return true;
  }

  /* ================================================================ */
  /*  LOOP                                                             */
  /* ================================================================ */
  let lastT = performance.now();
  function loop(now) {
    let dt = (now - lastT) / 1000;
    lastT = now;
    if (window.__deskBlocked) { requestAnimationFrame(loop); return; }
    if (dt > 0.05) dt = 0.05;
    if (state === 'play' && !paused) { slotAcc += dt * 1000; if (slotAcc > 60000) saveSoon(); }
    devTick();
    for (let i = 0; i < gameSpeed; i++) update(dt);
    devTick();
    musicTick();
    draw();
    requestAnimationFrame(loop);
  }

  resize();
  reset();
  bootSave();
  window.addEventListener('pagehide', () => { if (state === 'play' && betweenWaves) snapshotRun(); saveNow(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (state === 'play' && betweenWaves) snapshotRun(); saveNow(); } });
  requestAnimationFrame(loop);

})();
</script>
</body>
